<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Исследование потребностей сообщества — QARAVAN</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFDF5">
<link rel="icon" href="/survey/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/survey/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/survey/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Qaravan tokens — те же, что на форме отзыва */
  --q-red:#FF3333; --q-orange:#FF9933; --q-yellow:#F8F36E;
  --q-green:#66CC66; --q-sky:#0099CC; --q-purple:#7668AA;
  --q-black:#000000; --q-ink:#333333; --q-gray:#6E6E6E;
  --q-line:#ECE8DE; --q-paper:#FFFDF5; --q-white:#FFFFFF;
  --q-red-tint:#FFE4E4; --q-orange-tint:#FFEDD9; --q-sky-tint:#DDF1F8;
  --q-green-tint:#E3F6E3; --q-purple-tint:#EAE7F4;
  --font-brand:'Montserrat','Helvetica Neue',Arial,sans-serif;
  --radius-md:12px; --radius-lg:16px; --radius-pill:999px;
  --shadow-card:0 2px 6px rgba(51,51,51,.05), 0 10px 28px rgba(51,51,51,.07);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--q-paper); color:var(--q-ink);
  font-family:var(--font-brand); font-size:17px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--q-sky); font-weight:700; text-decoration-thickness:2px}
a:hover{color:var(--q-purple)}
.wrap{max-width:560px; margin:0 auto; padding:20px 20px 64px}

/* header */
.top{display:flex; justify-content:space-between; align-items:center; gap:16px; padding:4px 0 18px}
.wordmark{font-weight:900; font-size:26px; letter-spacing:-.03em; line-height:1; white-space:nowrap}
a.wordmark{text-decoration:none}
.topright{display:flex; align-items:center; gap:12px; min-width:0}
.lang{display:flex; gap:0; border:2px solid var(--q-ink); border-radius:var(--radius-pill); overflow:hidden; background:var(--q-white); flex:none}
.lang button{
  border:0; background:transparent; padding:8px 15px; font:inherit; font-size:13px; font-weight:700;
  color:var(--q-ink); cursor:pointer; line-height:1.2; transition:background .15s ease, color .15s ease;
}
.lang button[aria-pressed="true"]{background:var(--q-ink); color:var(--q-white)}

/* автосохранение: человек всегда видит, что его ответы не пропадут */
.savechip{display:none; align-items:center; gap:7px; font-size:13px; font-weight:700; color:var(--q-gray); white-space:nowrap; overflow:hidden}
.savechip.show{display:flex}
.savechip .dot{width:9px; height:9px; border-radius:50%; background:var(--q-line); flex:none; transition:background .2s}
.savechip.saving .dot{background:var(--q-orange)}
.savechip.saved .dot{background:var(--q-green)}
.savechip.local .dot{background:var(--q-gray)}

/* progress */
.progress{display:none; margin-bottom:26px}
.progress.show{display:block}
.progress-meta{display:flex; justify-content:space-between; align-items:baseline; font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--q-gray); margin-bottom:8px}
.bar{height:8px; border-radius:var(--radius-pill); background:var(--q-line); overflow:hidden}
.bar i{display:block; height:100%; width:0; border-radius:var(--radius-pill);
  background:linear-gradient(90deg,var(--q-red),var(--q-orange),var(--q-green),var(--q-sky),var(--q-purple));
  transition:width .35s ease}
@media (prefers-reduced-motion:reduce){ .bar i{transition:none} }

/* hero / intro */
.eyebrow{font-size:13px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--q-sky)}
h1{font-weight:800; font-size:clamp(28px,7.5vw,40px); line-height:1.1; letter-spacing:-.02em; margin:10px 0 8px; text-wrap:balance}
h2.sec{font-weight:800; font-size:clamp(22px,6vw,30px); line-height:1.15; letter-spacing:-.02em; margin:8px 0 0; text-wrap:balance; outline:none}
.sub{color:var(--q-gray); margin:0; text-wrap:pretty}
.intro-card{background:var(--q-white); border:2px solid var(--q-ink); border-radius:var(--radius-lg); padding:22px; margin-top:24px}
.intro-card ul{margin:0; padding:0; list-style:none; display:grid; gap:14px}
.intro-card li{display:flex; gap:12px; align-items:flex-start; font-size:15.5px; text-wrap:pretty}
.intro-card li .ico{flex:none; width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px}
.motto{margin:22px 0 0; font-weight:800; font-size:17px}
.helpnow{background:var(--q-sky-tint); border-radius:var(--radius-md); padding:14px 16px; font-size:14.5px; margin-top:22px; text-wrap:pretty}
.start{margin-top:30px}
.start button{
  width:100%; border:2px solid var(--q-ink); border-radius:var(--radius-pill); background:var(--q-ink);
  color:var(--q-white); font:inherit; font-size:18px; font-weight:700; padding:17px; cursor:pointer;
  transition:transform .15s ease, opacity .15s ease;
}
.start button:active{transform:scale(.99)}
.start .fine{color:var(--q-gray); font-size:13px; margin:12px 0 0; text-align:center; text-wrap:pretty}

/* восстановленный черновик */
.resume-note{display:none; background:var(--q-green-tint); border-radius:var(--radius-md); padding:14px 16px; font-size:14.5px; margin:0 0 24px; text-wrap:pretty}
.resume-note.show{display:block}
.resume-note button{border:0; background:none; padding:0; font:inherit; font-size:14px; font-weight:700; color:var(--q-gray); text-decoration:underline; text-underline-offset:3px; cursor:pointer; margin-top:6px}
.resume-note button:hover{color:var(--q-ink)}

/* sections */
fieldset{border:0; padding:24px 0 0; margin:0}
fieldset+fieldset{border-top:1px solid var(--q-line); margin-top:40px; padding-top:36px}
fieldset.gone{display:none}
legend{float:left; width:100%; padding:0; margin:0 0 20px; font-weight:700; font-size:19px; line-height:1.35; text-wrap:pretty}
legend+*{clear:both}
.hint{color:var(--q-gray); font-size:14px; font-weight:400; margin:8px 0 0; text-wrap:pretty}
legend .hint{display:block; margin:6px 0 0}
.sec-head{padding-top:6px}
.sec-intro{color:var(--q-gray); font-size:15px; margin:10px 0 0; text-wrap:pretty}

/* chips (мультивыбор) */
.chips{display:flex; flex-wrap:wrap; gap:12px; margin-top:0}
.chips button{
  border:2px solid var(--q-ink); background:var(--q-white); border-radius:var(--radius-pill);
  padding:12px 18px; font:inherit; font-size:15px; font-weight:700; line-height:1.25;
  cursor:pointer; color:var(--q-ink); text-align:left;
  transition:transform .15s ease, background .15s ease, border-color .15s ease, color .15s ease, opacity .15s ease;
}
.chips button:active{transform:scale(.97)}
.chips button[aria-pressed="true"]{background:var(--q-sky); border-color:var(--q-sky); color:var(--q-white)}
.chips button:nth-child(6n+1)[aria-pressed="true"]{background:var(--q-red); border-color:var(--q-red)}
.chips button:nth-child(6n+2)[aria-pressed="true"]{background:var(--q-orange); border-color:var(--q-orange)}
.chips button:nth-child(6n+3)[aria-pressed="true"]{background:var(--q-green); border-color:var(--q-green)}
.chips button:nth-child(6n+4)[aria-pressed="true"]{background:var(--q-purple); border-color:var(--q-purple)}
.chips button:nth-child(6n+5)[aria-pressed="true"]{background:var(--q-sky); border-color:var(--q-sky)}
.chips button:nth-child(6n)[aria-pressed="true"]{background:var(--q-ink); border-color:var(--q-ink)}
.chips button.dim{opacity:.38}
.counter{font-size:13px; font-weight:700; color:var(--q-gray); margin:12px 0 0}
.counter.maxed{color:var(--q-orange)}
.limit-hint{display:none; color:var(--q-orange); font-size:14px; font-weight:700; margin:10px 0 0}
.limit-hint.show{display:block}
.other-input{display:none; margin-top:14px}
.other-input.show{display:block}

/* text fields */
textarea,input[type="text"]{
  width:100%; border:2px solid var(--q-ink); border-radius:var(--radius-md); background:var(--q-white);
  padding:13px 16px; font:inherit; font-size:16px; color:var(--q-ink); margin-top:0;
  transition:border-color .15s ease, box-shadow .15s ease;
}
textarea{min-height:118px; resize:vertical; line-height:1.5}
textarea:focus,input[type="text"]:focus{
  outline:none; border-color:var(--q-sky); box-shadow:0 0 0 3px var(--q-sky-tint);
}
button:focus-visible,a:focus-visible,input[type="range"]:focus-visible{outline:3px solid var(--q-sky); outline-offset:2px}

/* radio rows (один вариант) */
.opts{display:grid; gap:12px; margin-top:0}
.opts label{
  display:flex; gap:12px; align-items:flex-start; border:2px solid var(--q-ink);
  background:var(--q-white); border-radius:var(--radius-md); padding:14px 16px; cursor:pointer;
  font-size:16px; line-height:1.4; transition:border-color .15s ease, background .15s ease;
}
.opts input{margin:4px 0 0; accent-color:var(--q-sky); width:19px; height:19px; flex:none}
.opts label:has(input:checked){border-color:var(--q-sky); background:var(--q-sky-tint)}
@media (min-width:480px){ .opts.cols2{grid-template-columns:1fr 1fr} }

/* slider (шкалы) */
.slider{margin-top:6px}
.slider .readout{min-height:52px; display:flex; align-items:center; justify-content:center; text-align:center;
  border:2px dashed var(--q-line); border-radius:var(--radius-md); background:var(--q-white);
  font-size:16px; font-weight:700; color:var(--q-gray); padding:10px 14px; margin-bottom:18px;
  transition:border-color .2s, color .2s, background .2s}
.slider.answered .readout{border-style:solid; border-color:var(--q-ink); color:var(--q-ink); background:var(--q-yellow)}
.slider input[type="range"]{
  -webkit-appearance:none; appearance:none; width:100%; height:44px; margin:0; background:transparent; cursor:pointer;
}
.slider input[type="range"]::-webkit-slider-runnable-track{height:10px; border-radius:var(--radius-pill); background:var(--q-line)}
.slider input[type="range"]::-moz-range-track{height:10px; border-radius:var(--radius-pill); background:var(--q-line)}
.slider.answered input[type="range"]::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--q-green),var(--q-yellow),var(--q-orange),var(--q-red))}
.slider.answered.pos input[type="range"]::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--q-red),var(--q-orange),var(--q-yellow),var(--q-green))}
.slider.answered input[type="range"]::-moz-range-track{background:linear-gradient(90deg,var(--q-green),var(--q-yellow),var(--q-orange),var(--q-red))}
.slider.answered.pos input[type="range"]::-moz-range-track{background:linear-gradient(90deg,var(--q-red),var(--q-orange),var(--q-yellow),var(--q-green))}
.slider input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:32px; height:32px; border-radius:50%;
  background:var(--q-white); border:3px solid var(--q-gray); margin-top:-11px;
  box-shadow:var(--shadow-card); transition:border-color .2s}
.slider.answered input[type="range"]::-webkit-slider-thumb{border-color:var(--q-ink)}
.slider input[type="range"]::-moz-range-thumb{
  width:26px; height:26px; border-radius:50%; background:var(--q-white); border:3px solid var(--q-gray); box-shadow:var(--shadow-card)}
.slider.answered input[type="range"]::-moz-range-thumb{border-color:var(--q-ink)}
.ticks{display:grid; margin-top:6px}
.ticks button{border:0; background:none; padding:8px 2px; font:inherit; font-size:12.5px; font-weight:700; color:var(--q-gray); cursor:pointer; line-height:1.25}
.ticks button:first-child{text-align:left}
.ticks button:last-child{text-align:right}
.ticks button.on{color:var(--q-ink)}
.na-link{border:0; background:none; color:var(--q-gray); font:inherit; font-size:14px; font-weight:700; text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:0; margin-top:16px; display:block}
.na-link:hover{color:var(--q-ink)}
.na-link.on{color:var(--q-purple)}

/* перенос на другое устройство */
.xfer{margin-top:30px; text-align:center}
.xfer > .na-link{display:inline; margin:0}
.xfer-panel{display:none; text-align:left; background:var(--q-white); border:2px solid var(--q-ink); border-radius:var(--radius-md); padding:16px; margin-top:14px}
.xfer-panel.show{display:block}
.xfer-panel p{margin:0 0 10px; font-size:14px; color:var(--q-gray); text-wrap:pretty}
.xfer-panel input{margin:0; font-size:14px}
.xfer-copy{margin-top:10px; border:2px solid var(--q-ink); border-radius:var(--radius-pill); background:var(--q-white); color:var(--q-ink); font:inherit; font-size:14px; font-weight:700; padding:10px 18px; cursor:pointer; transition:transform .15s ease}
.xfer-copy:active{transform:scale(.97)}

/* steps */
.step{display:none}
.step.on{display:block; animation:stepin .3s ease-out}
@keyframes stepin{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){ .step.on{animation:none} }
.stepnav{margin-top:46px; display:flex; align-items:center; justify-content:space-between; gap:14px}
.stepnav .next{border:2px solid var(--q-ink); border-radius:var(--radius-pill); background:var(--q-ink); color:var(--q-white); font:inherit; font-size:17px; font-weight:700; padding:15px 34px; cursor:pointer; transition:transform .15s ease}
.stepnav .next:active{transform:scale(.97)}
.stepnav .back{border:0; background:none; color:var(--q-gray); font:inherit; font-size:15px; font-weight:700; cursor:pointer; padding:10px 0}

/* submit */
.submit{margin-top:46px}
.submit button[type="submit"]{
  width:100%; border:2px solid var(--q-ink); border-radius:var(--radius-pill); background:var(--q-ink);
  color:var(--q-white); font:inherit; font-size:18px; font-weight:700; padding:17px; cursor:pointer;
  transition:transform .15s ease, opacity .15s ease;
}
.submit button[type="submit"]:active{transform:scale(.99)}
.submit button[type="submit"]:disabled{opacity:.4; cursor:default; transform:none}
.err{
  display:none; margin:0 0 14px; background:var(--q-red-tint); color:var(--q-ink);
  border-radius:var(--radius-md); padding:14px 18px; font-size:15px; font-weight:500;
}
.err.show{display:block}

/* thanks */
#thanks{display:none; padding-top:6vh}
#thanks.show{display:block}
#thanks h1{margin-top:0}
#thanks .again{border:0; background:none; color:var(--q-gray); font:inherit; font-size:14px; font-weight:700; text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:0; margin-top:34px}

.hp{position:absolute; left:-9999px; top:-9999px}
footer{margin-top:56px; color:var(--q-gray); font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <noscript><p style="background:#FFE4E4;border-radius:12px;padding:14px 18px">Чтобы заполнить опрос, включите JavaScript в браузере. / Please enable JavaScript to fill out this survey.</p></noscript>
  <div class="top">
    <a class="wordmark" href="https://qaravan.org" aria-label="qaravan.org"><span style="color:#000000">q</span><span style="color:#FF3333">a</span><span style="color:#FF9933">r</span><span style="color:#EBC53F">a</span><span style="color:#0099CC">v</span><span style="color:#66CC66">a</span><span style="color:#7668AA">n</span></a>
    <div class="topright">
      <div class="savechip" id="saveChip" role="status" aria-live="polite"><span class="dot"></span><span id="saveText"></span></div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="btnRu" aria-pressed="true">РУ</button>
        <button type="button" id="btnEn" aria-pressed="false">EN</button>
      </div>
    </div>
  </div>

  <div class="progress" id="progress">
    <div class="progress-meta"><span id="stepLabel"></span><span id="secName"></span></div>
    <div class="bar"><i id="barFill"></i></div>
  </div>

  <div id="formView">
    <p class="resume-note" id="resumeNote"><span data-i18n="resume_note"></span>
      <button type="button" id="restartBtn" data-i18n="restart_btn"></button>
    </p>

    <form id="f" novalidate="">
      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

      <!-- ШАГ 0: приглашение и согласие -->
      <div class="step on" data-step="0">
        <header>
          <div class="eyebrow">QARAVAN · 2026</div>
          <h1 data-i18n="intro_h1"></h1>
          <p class="sub" data-i18n="intro_sub"></p>
        </header>
        <div class="intro-card">
          <ul>
            <li><span class="ico" style="background:var(--q-sky-tint)">🔒</span><span data-i18n="card_privacy"></span></li>
            <li><span class="ico" style="background:var(--q-orange-tint)">⏱️</span><span data-i18n="card_time"></span></li>
            <li><span class="ico" style="background:var(--q-green-tint)">💾</span><span data-i18n="card_save"></span></li>
            <li><span class="ico" style="background:var(--q-purple-tint)">🙌</span><span data-i18n="card_skip"></span></li>
          </ul>
        </div>
        <p class="motto" data-i18n="motto"></p>
        <p class="sub" style="margin-top:8px" data-i18n="intro_sub2"></p>
        <div class="start">
          <button type="button" id="startBtn" data-i18n="start_btn"></button>
          <p class="fine" data-i18n="start_fine"></p>
        </div>
        <footer>qaravan.org</footer>
      </div>

      <!-- ШАГИ 1–5 рендерятся из конфига -->
      <div class="step" data-step="1"></div>
      <div class="step" data-step="2"></div>
      <div class="step" data-step="3"></div>
      <div class="step" data-step="4"></div>
      <div class="step" data-step="5"></div>
    </form>
  </div>

  <div id="thanks">
    <h1 data-i18n="thanks_h1"></h1>
    <p class="sub" data-i18n="thanks_sub"></p>
    <p class="motto" data-i18n="motto"></p>
    <div class="helpnow" style="margin-top:26px" data-i18n="thanks_help"></div>
    <p class="sub" style="margin-top:22px" data-i18n="thanks_care"></p>
    <button type="button" class="again" id="againBtn" data-i18n="again_btn"></button>
    <footer>qaravan.org</footer>
  </div>
</div>

<script>
"use strict";
// ============================================================================
// Конфиг вопросов. Коды (первый элемент тройки) — язык обмена с сервером:
// api/survey.mjs переводит их в английские метки колонок monday, а
// survey/CODEBOOK.md документирует соответствие. Меняешь код здесь — меняй там.
// Тексты двуязычные: [ru, en] у вопросов, [code, ru, en] у вариантов —
// обе версии обязаны спрашивать одно и то же (сравнимость данных).
// ============================================================================
const PNTS = "pnts"; // «Предпочитаю не отвечать»
const NO_ANS = ["Предпочитаю не отвечать", "Prefer not to answer"];

const Q = {
q1: { type:"single", text:["Как вы впервые узнали о QARAVAN?","How did you first hear about QARAVAN?"], hint:["Выберите один вариант.","Pick one."], opts:[
  ["friends","Друзья или знакомые","Friends or acquaintances"],
  ["telegram","Телеграм","Telegram"],
  ["social","Социальные сети (Instagram, Facebook и др.)","Social media (Instagram, Facebook, etc.)"],
  ["bbpride","Brighton Beach Pride","Brighton Beach Pride"],
  ["org","Другая организация","Another organization"],
  ["search","Поиск в интернете","Internet search"],
  ["other","Другое","Other"]], other:"other" },
q2: { type:"multi", max:3, text:["Почему вы изначально решили участвовать в программах QARAVAN?","Why did you originally decide to take part in QARAVAN's programs?"], hint:["Выберите до 3-х вариантов.","Pick up to 3."], opts:[
  ["help","Искал(а) помощь (юридическую, медицинскую и т.д.)","I was looking for help (legal, medical, etc.)"],
  ["community","Хотел(а) найти друзей и сообщество","I wanted to find friends and community"],
  ["emosupport","Нужна была эмоциональная поддержка","I needed emotional support"],
  ["events","Интерес к мероприятиям","Interest in the events"],
  ["recommend","Рекомендация знакомых","A friend recommended it"],
  ["other","Другое","Other"],
  ["not_participated","Я пока не участвовал(а) в программах QARAVAN","I haven't taken part in QARAVAN's programs yet"]], other:"other", exclusive:["not_participated"] },
q3: { type:"multi", text:["Как вы участвовали в жизни QARAVAN?","How have you taken part in QARAVAN's life?"], hint:["Выберите все подходящие варианты.","Pick all that apply."], opts:[
  ["inperson","Посещал(а) мероприятия лично","Attended events in person"],
  ["chat","Участвую в телеграм-чате Qaravan Connects","I'm in the Qaravan Connects Telegram chat"],
  ["referrals","Получал(а) через QARAVAN направления к специалистам (юристам, врачам и др.)","Got referrals to specialists (lawyers, doctors, etc.) through QARAVAN"],

  confirm_adopt: "There's an unfinished response on this device. Open the draft from the link instead?",
  section_of: n => `Section ${n} of ${SECTIONS.length}`,
  completed: p => `Completed: ${p}%`,
  nav_next: "Next", nav_back: "Back",
  send: "Submit answers", sending: "Submitting…",
  err_net: "It didn't go through. Your answers are saved on this device — check your connection and try again.",
  save_saving: "Saving…", save_saved: "Saved ✓", save_local: "Saved on this device", save_restored: "Draft restored",
  count_sel: (n, m) => `Selected: ${n} of ${m}`,
  count_cap: m => `Pick up to ${m === 3 ? "three" : m}`,
  limit_hint: m => `No more than ${m === 3 ? "three" : m}: unselect one of your picks first.`,
  other_ph: "Your answer", other_aria: "Other — please specify",
  no_answer: "No answer selected",
  xfer_link: "Continue on another device",
  xfer_note: "Open this link on another device — your saved draft will load and you can pick up where you left off. Don't share the link: it opens your answers.",
  xfer_copy: "Copy link", xfer_copied: "Copied ✓", xfer_aria: "Personal link to continue",
  thanks_h1: "Thank you!",
  thanks_sub: "Your answers will help us build the programs our community actually needs.",
  thanks_help: `Need help right now? <a href="${HELP_URL}" target="_blank" rel="noopener">Fill out this form</a> — we'll get in touch.`,
  thanks_care: "Take care of yourself. 🧡",
  again_btn: "Fill it out again",
},
};
const HTML_KEYS = new Set(["card_privacy", "card_time", "card_save", "card_skip", "motto", "thanks_help"]);

// Логика показа: вопрос виден, только когда он применим к человеку.
// Скрытый вопрос не уходит на сервер и не считается в прогрессе.
const VISIBLE = {
  q3: () => !(A.q2 || []).includes("not_participated"),
  q5: () => ["few6mo","once","before","never"].includes(A.q4),
  q15: () => ["chg_big","chg_some"].includes(A.q14),
  q18: () => A.q17 === 3 || A.q17 === 4,
};

// ===== состояние + локальное сохранение =====
const LSKEY = "qsurvey26.v1";
const $ = id => document.getElementById(id);
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() :
  "xxxx-xxxx-4xxx-yxxx-xxxx".replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==="x"?r:(r&0x3|0x8)).toString(16); }) + "-" + Date.now().toString(16));

let S;
function freshState(){ return { rid: uuid(), A: {}, step: 0, maxSection: 0, startedAt: 0, done: false, lang: "" }; }
function load(){
  try { const d = JSON.parse(localStorage.getItem(LSKEY) || "null"); if (d && d.rid && d.A) return d; } catch (e) {}
  return null;
}
S = load() || freshState();
let A = S.A;
let lang = S.lang === "en" || (!S.lang && new URLSearchParams(location.search).get("lang") === "en") ? "en" : "ru";
const STR = () => STRINGS[lang];
const tx = v => Array.isArray(v) ? v[lang === "en" ? 1 : 0] : v;          // текст вопроса/подсказки
const optLabel = o => (lang === "en" && o[2]) ? o[2] : o[1];              // подпись варианта
function persist(){ S.lang = lang; try { localStorage.setItem(LSKEY, JSON.stringify(S)); } catch (e) {} }
const RID_RX = /^[0-9a-zA-Z-]{12,64}$/;
const resumeURL = () => location.origin + location.pathname.replace(/\/index\.html$/, "") + "?r=" + S.rid;

// ===== рендер вопросов =====
function el(tag, cls, text){ const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

function fsWrap(qid, q){
  const fs = el("fieldset"); fs.id = "fs_" + qid;
  const lg = el("legend");
  const t = el("span", null, tx(q.text)); lg.appendChild(t);
  if (q.hint) lg.appendChild(el("span", "hint", tx(q.hint)));
  fs.appendChild(lg);
  return fs;
}

function renderSingle(qid, q){
  const fs = fsWrap(qid, q);
  const wrap = el("div", "opts" + (q.cols2 ? " cols2" : ""));
  wrap.setAttribute("role", "radiogroup");
  q.opts.forEach(o => {
    const code = o[0];
    const l = el("label");
    const r = document.createElement("input");
    r.type = "radio"; r.name = qid; r.value = code; r.checked = A[qid] === code;
    r.onchange = () => { A[qid] = code; onOther(qid, q, true); touched(qid); };
    l.append(r, el("span", null, optLabel(o)));
    wrap.appendChild(l);
  });
  fs.appendChild(wrap);
  if (q.other) fs.appendChild(otherInput(qid));
  return fs;
}

function renderMulti(qid, q){
  const fs = fsWrap(qid, q);
  const wrap = el("div", "chips");
  q.opts.forEach(o => {
    const b = el("button", null, optLabel(o));
    b.type = "button"; b.dataset.code = o[0];
    b.onclick = () => toggleChip(qid, q, o[0]);
    wrap.appendChild(b);
  });
  fs.appendChild(wrap);
  if (q.max){
    fs.appendChild(el("p", "counter", ""));
    fs.appendChild(el("p", "limit-hint", STR().limit_hint(q.max)));
  }
  if (q.other) fs.appendChild(otherInput(qid));
  syncMulti(qid, q);
  return fs;
}

function toggleChip(qid, q, code){
  const cur = new Set(A[qid] || []);
  const excl = q.exclusive || [];
  if (cur.has(code)) cur.delete(code);
  else {
    if (q.max && !cur.has(code) && [...cur].filter(c => !excl.includes(c)).length >= q.max && !excl.includes(code)){
      const lh = document.querySelector(`#fs_${qid} .limit-hint`);
      if (lh){ lh.classList.add("show"); setTimeout(() => lh.classList.remove("show"), 2600); }
      return;
    }
    if (excl.includes(code)) cur.clear();          // «эксклюзивный» вариант снимает остальные
    else excl.forEach(c => cur.delete(c));         // обычный вариант снимает «эксклюзивный»
    cur.add(code);
  }
  A[qid] = [...cur];
  syncMulti(qid, q);
  onOther(qid, q, true);
  touched(qid);
}

function syncMulti(qid, q){
  const fs = $("fs_" + qid); if (!fs) return;
  const cur = new Set(A[qid] || []);
  const excl = q.exclusive || [];
  const normal = [...cur].filter(c => !excl.includes(c)).length;
  const maxed = q.max && normal >= q.max;
  fs.querySelectorAll(".chips button").forEach(b => {
    const on = cur.has(b.dataset.code);
    b.setAttribute("aria-pressed", on ? "true" : "false");
    const blocked = maxed && !on && !excl.includes(b.dataset.code);
    b.classList.toggle("dim", !!blocked);
    if (blocked) b.setAttribute("aria-disabled", "true"); else b.removeAttribute("aria-disabled");
  });
  const c = fs.querySelector(".counter");
  if (c){
    c.textContent = cur.size ? STR().count_sel(normal || cur.size, q.max) : STR().count_cap(q.max);
    c.classList.toggle("maxed", !!maxed);
  }
}

function otherInput(qid){
  const w = el("div", "other-input"); w.id = "other_" + qid;
  const i = document.createElement("input");
  i.type = "text"; i.maxLength = 200; i.placeholder = STR().other_ph; i.value = A[qid + "_other"] || "";
  i.setAttribute("aria-label", STR().other_aria);
  i.oninput = () => { A[qid + "_other"] = i.value; touched(); };
  w.appendChild(i);
  return w;
}
function onOther(qid, q, focus){
  const w = $("other_" + qid); if (!w) return;
  const v = A[qid];
  const on = q.type === "single" ? v === q.other : (v || []).includes(q.other);
  w.classList.toggle("show", !!on);
  if (on && focus) w.querySelector("input").focus({ preventScroll: true });
}

function renderScale(qid, q){
  const fs = fsWrap(qid, q);
  const box = el("div", "slider" + (q.positive ? " pos" : ""));
  const read = el("div", "readout", STR().no_answer);
  const r = document.createElement("input");
  r.type = "range"; r.min = q.min; r.max = q.max; r.step = 1;
  r.value = Math.ceil((q.min + q.max) / 2);
  r.setAttribute("aria-label", tx(q.text));
  const ticks = el("div", "ticks");
  ticks.style.gridTemplateColumns = `repeat(${q.max - q.min + 1},1fr)`;
  q.ticks.forEach((t, i) => {
    const b = el("button", null, tx(t)); b.type = "button";
    b.onclick = () => setScale(q.min + i);
    ticks.appendChild(b);
  });
  const sync = () => {
    const v = A[qid];
    const answered = typeof v === "number";
    box.classList.toggle("answered", answered);
    if (answered){ r.value = v; read.textContent = tx(q.labels[v]); r.setAttribute("aria-valuetext", tx(q.labels[v])); }
    else read.textContent = v === PNTS ? tx(NO_ANS) : STR().no_answer;
    [...ticks.children].forEach((b, i) => b.classList.toggle("on", answered && q.min + i === v));
    if (q.pnts){ const na = fs.querySelector(".na-link"); if (na) na.classList.toggle("on", v === PNTS); }
  };
  const setScale = v => { A[qid] = v; sync(); touched(qid); };
  r.oninput = () => setScale(Number(r.value));
  box.append(read, r, ticks);
  fs.appendChild(box);
  if (q.pnts){
    const na = el("button", "na-link", tx(NO_ANS));
    na.type = "button";
    na.onclick = () => { A[qid] = A[qid] === PNTS ? undefined : PNTS; if (A[qid] === undefined) delete A[qid]; sync(); touched(qid); };
    fs.appendChild(na);
  }
  sync();
  return fs;
}

function renderOpen(qid, q){
  const fs = fsWrap(qid, q);
  const t = document.createElement("textarea");
  t.maxLength = q.max || 4000; t.value = A[qid] || "";
  t.setAttribute("aria-label", tx(q.text));
  t.oninput = () => { A[qid] = t.value; touched(); };
  fs.appendChild(t);
  return fs;
}

const RENDER = { single: renderSingle, multi: renderMulti, scale: renderScale, open: renderOpen };

// «Продолжить на другом устройстве»: личная ссылка с response id. Открыв её
// на другом устройстве, человек получает свой черновик с доски (GET /api/survey).
function xferBlock(){
  const box = el("div", "xfer");
  const btn = el("button", "na-link", STR().xfer_link);
  btn.type = "button";
  const panel = el("div", "xfer-panel");
  const inp = document.createElement("input");
  inp.type = "text"; inp.readOnly = true;
  inp.setAttribute("aria-label", STR().xfer_aria);
  inp.onfocus = () => inp.select();
  const copy = el("button", "xfer-copy", STR().xfer_copy);
  copy.type = "button";
  copy.onclick = async () => {
    inp.value = resumeURL();
    let ok = false;
    try { await navigator.clipboard.writeText(inp.value); ok = true; }
    catch (e) { inp.select(); try { ok = document.execCommand("copy"); } catch (e2) {} }
    if (ok){ copy.textContent = STR().xfer_copied; setTimeout(() => { copy.textContent = STR().xfer_copy; }, 2200); }
  };
  btn.onclick = () => { inp.value = resumeURL(); panel.classList.toggle("show"); };
  panel.append(el("p", null, STR().xfer_note), inp, copy);
  box.append(btn, panel);
  return box;
}

function buildSteps(){
  SECTIONS.forEach((sec, si) => {
    const host = document.querySelector(`.step[data-step="${sec.n}"]`);
    host.innerHTML = "";
    const head = el("header", "sec-head");
    const eb = el("div", "eyebrow", STR().section_of(sec.n));
    eb.style.color = SEC_COLORS[si];
    const h2 = el("h2", "sec", tx(sec.name));
    h2.id = "sech_" + sec.n; h2.tabIndex = -1;
    head.append(eb, h2);
    if (sec.intro) head.appendChild(el("p", "sec-intro", tx(sec.intro)));
    host.appendChild(head);
    sec.qs.forEach(qid => host.appendChild(RENDER[Q[qid].type](qid, Q[qid])));

    const nav = el("div", "stepnav");
    const back = el("button", "back", STR().nav_back);
    back.type = "button"; back.onclick = () => goStep(sec.n - 1);
    nav.appendChild(back);
    if (sec.n < SECTIONS.length){
      const next = el("button", "next", STR().nav_next);
      next.type = "button"; next.onclick = () => goStep(sec.n + 1);
      nav.appendChild(next);
    }
    host.appendChild(nav);
    if (sec.n === SECTIONS.length){
      const sub = el("div", "submit");
      const err = el("p", "err"); err.id = "err"; err.setAttribute("role", "alert");
      const send = el("button", null, STR().send);
      send.type = "submit"; send.id = "send";
      sub.append(err, send, el("footer", null, "qaravan.org"));
      host.appendChild(sub);
    }
    host.appendChild(xferBlock());
    sec.qs.forEach(qid => { Q[qid].other && onOther(qid, Q[qid]); });
  });
  applyVisibility();
}

function applyVisibility(){
  Object.keys(VISIBLE).forEach(qid => {
    const fs = $("fs_" + qid);
    if (fs) fs.classList.toggle("gone", !VISIBLE[qid]());
  });
}

// ===== язык =====
// Тексты «хрома» страницы (вступление, «спасибо», кнопки) живут в data-i18n;
// вопросы перерисовываются заново из конфига. Ответы при переключении не трогаем.
function renderChrome(){
  document.documentElement.lang = lang;
  document.title = STR().title;
  $("btnRu").setAttribute("aria-pressed", lang === "ru" ? "true" : "false");
  $("btnEn").setAttribute("aria-pressed", lang === "en" ? "true" : "false");
  document.querySelectorAll("[data-i18n]").forEach(n => {
    const k = n.dataset.i18n;
    if (HTML_KEYS.has(k)) n.innerHTML = STR()[k]; else n.textContent = STR()[k];
  });
}
function setLang(l){
  if (l === lang) return;
  lang = l;
  persist();
  renderChrome();
  buildSteps();
  if (S.step >= 1){ $("stepLabel").textContent = STR().section_of(S.step); syncPct(); }
  schedule(); // язык заполнения — тоже данные, пусть уедет с автосейвом
}
$("btnRu").onclick = () => setLang("ru");
$("btnEn").onclick = () => setLang("en");

// ===== шаги и прогресс =====
function goStep(n, focusHeading = true){
  S.step = n;
  document.querySelectorAll(".step").forEach(s => s.classList.toggle("on", s.dataset.step === String(n)));
  if (n > S.maxSection) S.maxSection = n;
  const p = $("progress");
  p.classList.toggle("show", n >= 1);
  if (n >= 1){
    $("stepLabel").textContent = STR().section_of(n);
    $("barFill").style.width = Math.max(4, Math.round((n - 1) / SECTIONS.length * 100)) + "%";
    syncPct();
  }
  persist();
  window.scrollTo({ top: 0, behavior: "smooth" });
  if (n >= 1 && focusHeading){ const h = $("sech_" + n); if (h) h.focus({ preventScroll: true }); }
  if (n >= 1) schedule();   // переход между разделами — тоже повод сохраниться
}

function syncPct(){ $("secName").textContent = STR().completed(progressPct()); }

function applicable(){ return Object.keys(Q).filter(qid => !(qid in VISIBLE) || VISIBLE[qid]()); }
function answered(qid){
  const v = A[qid], q = Q[qid];
  if (!q) return false;
  if (q.type === "multi") return Array.isArray(v) && v.length > 0;
  if (q.type === "open") return typeof v === "string" && v.trim().length > 0;
  if (q.type === "scale") return typeof v === "number" || v === PNTS;
  return !!v;
}
function progressPct(){
  const qs = applicable();
  return Math.round(qs.filter(answered).length / qs.length * 100);
}

// ===== автосохранение =====
// Локально — мгновенно при каждом изменении; на сервер (доска monday) — с
// паузой 1200 мс, чтобы не бомбить API на каждую букву. Строка в monday
// создаётся при первом содержательном ответе и дальше обновляется.
let dirty = false, inflight = false, timer = 0;
const chip = (mode, key) => {
  const c = $("saveChip");
  c.className = "savechip show " + mode;
  $("saveText").textContent = STR()[key];
};

function touched(qid){
  if (qid && Q[qid]) applyVisibility();
  if (!S.startedAt) S.startedAt = Date.now();
  persist();
  syncPct();
  schedule();
}
function schedule(){
  if (S.done || !hasAnswers()) return;
  dirty = true;
  chip("saving", "save_saving");
  clearTimeout(timer);
  timer = setTimeout(() => save("draft"), 1200);
}
function hasAnswers(){ return Object.keys(A).some(k => answered(k.replace(/_other$/, "")) ); }

function payload(mode){
  const qs = applicable();
  const out = {};
  qs.forEach(qid => {
    if (!answered(qid)) return;
    const q = Q[qid], v = A[qid];
    if (q.type === "multi"){
      let arr = v.slice(0, 12);
      if (q.max){
        const excl = q.exclusive || [];
        arr = arr.filter(c => excl.includes(c)).concat(arr.filter(c => !excl.includes(c)).slice(0, q.max));
      }
      out[qid] = arr;
    } else if (q.type === "open") out[qid] = v.trim().slice(0, q.max || 4000);
    else out[qid] = v;
    if (q.other){
      const picked = q.type === "single" ? v === q.other : v.includes(q.other);
      const txt = (A[qid + "_other"] || "").trim();
      if (picked && txt) out[qid + "_other"] = txt.slice(0, 200);
    }
  });
  return {
    rid: S.rid, mode, lang,
    answers: out,
    progress: progressPct(),
    lastSection: Math.min(S.maxSection, SECTIONS.length),
    startedAt: S.startedAt || Date.now(),
    website: document.querySelector(".hp").value,
  };
}

async function save(mode){
  if (inflight){ dirty = true; return; }        // очередь: следующий заход подхватит
  inflight = true; dirty = false;
  try {
    const r = await fetch("/api/survey", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload(mode)),
    });
    if (!r.ok) throw new Error("http " + r.status);
    chip("saved", "save_saved");
  } catch (e) {
    dirty = true;                                // локально всё есть; сервер догоним позже
    chip("local", "save_local");
  } finally {
    inflight = false;
    if (dirty && !S.done){ clearTimeout(timer); timer = setTimeout(() => save("draft"), 4000); }
  }
}

// последний шанс: уход со страницы — добросить несохранённое одним маячком
window.addEventListener("pagehide", () => {
  if (S.done || !dirty || !hasAnswers()) return;
  try {
    navigator.sendBeacon("/api/survey", new Blob([JSON.stringify(payload("draft"))], { type: "application/json" }));
  } catch (e) {}
});
window.addEventListener("online", () => { if (dirty && !S.done) schedule(); });

// ===== отправка =====
$("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const err = $("err"), send = $("send");
  err.classList.remove("show");
  send.disabled = true; send.textContent = STR().sending;
  clearTimeout(timer);
  const waitIdle = () => new Promise(res => { const t = () => inflight ? setTimeout(t, 150) : res(); t(); });
  await waitIdle();
  inflight = true;
  try {
    const r = await fetch("/api/survey", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload("submit")),
    });
    if (!r.ok) throw new Error("http " + r.status);
    inflight = false;
    S.done = true; dirty = false; persist();
    $("formView").style.display = "none";
    $("progress").classList.remove("show");
    $("saveChip").classList.remove("show");
    $("thanks").classList.add("show");
    window.scrollTo({ top: 0 });
  } catch (e) {
    inflight = false;
    err.textContent = STR().err_net;
    err.classList.add("show");
    send.disabled = false; send.textContent = STR().send;
  }
});

// ===== старт, восстановление, «ещё раз» =====
$("startBtn").onclick = () => goStep(1);
function resetAll(){
  try { localStorage.setItem(LSKEY, JSON.stringify({ ...freshState(), lang })); } catch (e) {}
  S.done = true;            // заглушить pagehide-маячок со старыми ответами
  dirty = false;
  location.reload();
}
$("restartBtn").onclick = () => {
  if (!confirm(STR().confirm_restart)) return;
  resetAll();
};
$("againBtn").onclick = resetAll;

(async function boot(){
  renderChrome();
  buildSteps();
  // ?r=<rid> — переход по личной ссылке «продолжить на другом устройстве»:
  // забираем черновик с доски и принимаем его rid, чтобы писать в ту же строку.
  const r = (new URLSearchParams(location.search).get("r") || "").trim();
  if (r && RID_RX.test(r)){
    if (r !== S.rid){
      const localBusy = hasAnswers() && !S.done;
      const adopt = !localBusy || confirm(STR().confirm_adopt);
      if (adopt){
        let d = null;
        try {
          const resp = await fetch("/api/survey?rid=" + encodeURIComponent(r));
          if (resp.ok) d = await resp.json();
        } catch (e) {}
        S = freshState(); S.rid = r; A = S.A;
        if (d && d.found && d.submitted) S.done = true;
        else if (d && d.found){
          if (d.answers && typeof d.answers === "object") Object.assign(A, d.answers);
          S.startedAt = Number(d.startedAt) || Date.now();
          S.step = Math.min(Math.max(Math.round(Number(d.lastSection) || 1), 1), SECTIONS.length);
          S.maxSection = S.step;
        }
        if (d && (d.lang === "en" || d.lang === "ru") && d.lang !== lang){ lang = d.lang; renderChrome(); }
        persist();
        buildSteps(); // перерисовать с подтянутыми ответами
      }
    }
    history.replaceState(null, "", location.pathname); // личную ссылку из адресной строки убираем
  }
  if (S.done){
    $("formView").style.display = "none";
    $("thanks").classList.add("show");
  } else if (S.step >= 1 && hasAnswers()){
    $("resumeNote").classList.add("show");
    goStep(Math.min(S.step, SECTIONS.length), false);
    chip("saved", "save_restored");
  } else {
    goStep(0, false);
  }
})();
</script>
</body></html>

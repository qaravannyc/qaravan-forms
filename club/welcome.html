<!DOCTYPE html>
<html lang="ru"><head>

<link rel="icon" href="/survey/favicon.svg" type="image/svg+xml">

<link rel="preload" href="/assets/fonts/FiraSans-Regular.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="/assets/qaravan.css">

<style>
.intro{margin:0; font:400 17px/1.5 var(--font-brand); color:var(--q-ink); text-wrap:pretty}
.muted{margin:16px 0 0; color:var(--q-muted); font:400 15px/1.45 var(--font-brand); text-wrap:pretty}
.start{margin-top:28px}
.start a{display:flex; align-items:center; justify-content:center; min-height:52px; padding:10px 24px; border:2px solid var(--q-ink); background:var(--q-ink); color:var(--q-white);
  font:600 19px/1.15 var(--font-head); letter-spacing:.01em; text-decoration:none; transition:box-shadow .15s ease-out}
.start a:hover{box-shadow:inset 0 0 0 999px rgba(0,0,0,.14)}
[hidden]{display:none !important}
h1:focus{outline:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="wordmark" href="https://qaravan.org" aria-label="qaravan.org"><img src="/assets/logo-wordmark.svg" width="140" height="28" alt="qaravan"></a>
  </div>
  <header class="hero on">
    <div class="eyebrow" style="--flag:var(--q-red)" id="eyebrow"></div>
    <h1 id="h1" tabindex="-1"></h1>
  </header>
  <p class="intro" id="text"></p>
  <div class="start" id="joinBox" hidden><a id="join" href="#" target="_blank" rel="noopener"></a></div>
  <p class="muted" id="note"></p>
  <footer>qaravan.org</footer>
</div>
<script>
// Страница после оплаты в Stripe: /club/welcome?session_id=… Спрашивает /api/club?action=welcome,

    join: "Вступить в группу WhatsApp",
    note: "Ссылка на группу и ссылка на отмену членства придут на почту от info@qaravan.org. Участники группы видят номера телефонов друг друга.",
    pending: "Оплата прошла", pending_text: "Письмо со ссылкой на группу WhatsApp придёт на почту от info@qaravan.org. Если его нет через час, проверьте папку «Спам» или напишите нам.",
    unpaid: "Оплата не завершилась", unpaid_text: "Похоже, оплата не прошла. Вернитесь к анкете и попробуйте ещё раз.", back: "Вернуться к анкете",
  },

    eyebrow: "Movie club", checking: "Checking your payment…", wait: "One moment, we’re checking your payment with Stripe.",
    paid: (n) => (n ? `${n}, you’re in the club!` : "You’re in the club!"),
    paid_text: "Thank you for supporting the club. Join the WhatsApp group: that’s where we vote on films, propose new ones and plan screenings.",
    join: "Join the WhatsApp group",
    note: "The group link and a link to cancel your membership will come by email from info@qaravan.org. Group members can see each other’s phone numbers.",

  },

    eyebrow: "Кіноклуб",

    pending: "Оплата пройшла",

    unpaid_text: "Схоже, оплата не пройшла. Поверніться до анкети і спробуйте ще раз.",
    back: "Повернутися до анкети",
  },
  uz: {
    eyebrow: "Kinoklub",
    checking: "Toʻlov tekshirilmoqda…",
    wait: "Bir soniya, toʻlovni Stripe tizimida tekshiryapmiz.",
    paid: (n) => (n ? `${n}, siz klubdasiz!` : "Siz klubdasiz!"),
    paid_text: "Klubni qoʻllab-quvvatlaganingiz uchun rahmat. WhatsApp guruhiga qoʻshiling: u yerda filmlar uchun ovoz beramiz, oʻz filmlarimizni taklif qilamiz va namoyishlarni kelishib olamiz.",
    join: "WhatsApp guruhiga qoʻshilish",
    note: "Guruhga havola va aʼzolikni bekor qilish havolasi info@qaravan.org manzilidan emailingizga keladi. Guruh aʼzolari bir-birining telefon raqamlarini koʻradi.",
    pending: "Toʻlov qabul qilindi",
    pending_text: "WhatsApp guruhiga havola bilan xat info@qaravan.org manzilidan emailingizga keladi. Agar bir soat ichida kelmasa, «Spam» jildini tekshiring yoki bizga yozing.",
    unpaid: "Toʻlov yakunlanmadi",
    unpaid_text: "Toʻlov amalga oshmaganga oʻxshaydi. Anketaga qayting va yana urinib koʻring.",
    back: "Anketaga qaytish",
  },
  tg: {
    eyebrow: "Киноклуб",
    checking: "Пардохтро месанҷем…",
    wait: "Як лаҳза, пардохтро дар Stripe месанҷем.",
    paid: (n) => (n ? `${n}, шумо дар клуб ҳастед!` : "Шумо дар клуб ҳастед!"),
    paid_text: "Ташаккур, ки клубро дастгирӣ мекунед. Ба гурӯҳи WhatsApp дохил шавед: дар он ҷо мо барои филмҳо овоз медиҳем, филмҳои худро пешниҳод мекунем ва дар бораи намоишҳо мувофиқа мекунем.",
    join: "Ба гурӯҳи WhatsApp дохил шудан",
    note: "Пайванд ба гурӯҳ ва пайванд барои бекор кардани узвият бо email аз info@qaravan.org меоянд. Аъзоёни гурӯҳ рақамҳои телефони ҳамдигарро мебинанд.",
    pending: "Пардохт анҷом ёфт",
    pending_text: "Мактуб бо пайванд ба гурӯҳи WhatsApp аз info@qaravan.org меояд. Агар он дар давоми як соат наояд, ҷузвдони «Спам»-ро санҷед ё ба мо нависед.",
    unpaid: "Пардохт анҷом наёфт",
    unpaid_text: "Чунин менамояд, ки пардохт нагузашт. Ба анкета баргардед ва бори дигар кӯшиш кунед.",
    back: "Бозгашт ба анкета",
  },
  ky: {
    eyebrow: "Киноклуб",
    checking: "Төлөм текшерилүүдө…",
    wait: "Бир секунд, төлөмдү Stripe аркылуу текшерип жатабыз.",
    paid: (n) => (n ? `${n}, сиз клубдасыз!` : "Сиз клубдасыз!"),
    paid_text: "Клубду колдогонуңуз үчүн рахмат. WhatsApp тобуна кошулуңуз: ал жерде тасмалар үчүн добуш беребиз, өз тасмаларыбызды сунуштайбыз жана көрсөтүүлөр боюнча макулдашабыз.",
    join: "WhatsApp тобуна кошулуу",
    note: "Топко шилтеме жана мүчөлүктү жокко чыгаруу шилтемеси info@qaravan.org дарегинен email дарегиңизге келет. Топтун катышуучулары бири-биринин телефон номерлерин көрүшөт.",
    pending: "Төлөм өттү",
    pending_text: "WhatsApp тобуна шилтемеси бар кат info@qaravan.org дарегинен email дарегиңизге келет. Эгер бир сааттан кийин да келбесе, «Спам» папкасын текшериңиз же бизге жазыңыз.",
    unpaid: "Төлөм аягына чыккан жок",
    unpaid_text: "Төлөм өтпөй калган окшойт. Анкетага кайтып, кайра аракет кылып көрүңүз.",
    back: "Анкетага кайтуу",
  },
  az: {
    eyebrow: "Kinoklub",
    checking: "Ödəniş yoxlanılır…",
    wait: "Bir saniyə, ödənişi Stripe-da yoxlayırıq.",
    paid: (n) => (n ? `${n}, siz klubdasınız!` : "Siz klubdasınız!"),
    paid_text: "Klubu dəstəklədiyiniz üçün təşəkkür edirik. WhatsApp qrupuna qoşulun: orada filmlərə səs veririk, öz filmlərimizi təklif edirik və nümayişlər barədə razılaşırıq.",
    join: "WhatsApp qrupuna qoşulmaq",
    note: "Qrupun linki və üzvlüyü ləğv etmək üçün link info@qaravan.org ünvanından email ünvanınıza gələcək. Qrup üzvləri bir-birinin telefon nömrələrini görür.",
    pending: "Ödəniş keçdi",
    pending_text: "WhatsApp qrupunun linki olan məktub info@qaravan.org ünvanından email ünvanınıza gələcək. Bir saat ərzində gəlməsə, «Spam» qovluğunu yoxlayın və ya bizə yazın.",
    unpaid: "Ödəniş tamamlanmadı",
    unpaid_text: "Deyəsən, ödəniş keçmədi. Anketə qayıdın və yenidən cəhd edin.",
    back: "Anketə qayıtmaq",
  },
  tk: {
    eyebrow: "Kino kluby",
    checking: "Tölegi barlaýarys…",
    wait: "Bir sekunt, tölegi Stripe-da barlaýarys.",
    paid: (n) => (n ? `${n}, siz klubda!` : "Siz klubda!"),
    paid_text: "Kluby goldaýandygyňyz üçin sag boluň. WhatsApp toparyna goşulyň: şol ýerde filmler üçin ses berýäris, öz filmlerimizi teklip edýäris we görkezilişler barada ylalaşýarys.",
    join: "WhatsApp toparyna goşulmak",
    note: "Toparyň salgysy we agzalygy ýatyrmak üçin salgy info@qaravan.org salgysyndan email arkaly geler. Toparyň agzalary biri-biriniň telefon belgilerini görýärler.",
    pending: "Töleg geçdi",
    pending_text: "WhatsApp toparynyň salgysy bilen hat info@qaravan.org salgysyndan email arkaly geler. Bir sagatdan hat gelmese, «Spam» bukjasyny barlaň ýa-da bize ýazyň.",
    unpaid: "Töleg tamamlanmady",
    unpaid_text: "Töleg geçmedi öýdýäris. Anketa yza dolanyň we ýene bir gezek synanyşyň.",
    back: "Anketa yza dolanmak",
  },
  es: {
    eyebrow: "Club de cine",
    checking: "Verificando su pago…",
    wait: "Un momento, estamos verificando su pago con Stripe.",
    paid: (n) => (n ? `¡${n}, ya está en el club!` : "¡Ya está en el club!"),
    paid_text: "Gracias por apoyar al club. Únase al grupo de WhatsApp: ahí votamos por las películas, proponemos otras nuevas y planeamos las proyecciones.",
    join: "Unirse al grupo de WhatsApp",
    note: "El enlace del grupo y un enlace para cancelar su membresía le llegarán por correo electrónico de info@qaravan.org. Los miembros del grupo pueden ver los números de teléfono de los demás.",
    pending: "Recibimos el pago",
    pending_text: "Le llegará un correo de info@qaravan.org con el enlace al grupo de WhatsApp. Si no llega en una hora, revise la carpeta de spam o escríbanos.",
    unpaid: "El pago no se completó",
    unpaid_text: "Parece que el pago no terminó. Vuelva al formulario e intente de nuevo.",
    back: "Volver al formulario",
  },
};
let lang = "ru";
try { const l = JSON.parse(localStorage.getItem("qaravan.club.v1") || "{}").lang; if (Object.hasOwn(T, l)) lang = l; } catch {}
const t = T[lang];
const $ = (id) => document.getElementById(id);
document.documentElement.lang = lang;
$("eyebrow").textContent = t.eyebrow; $("h1").textContent = t.checking; $("text").textContent = t.wait;
const sid = new URLSearchParams(location.search).get("session_id") || "";
async function check(tries) {
  try {
    const j = await fetch(`/api/club?action=welcome&session_id=${encodeURIComponent(sid)}`).then((r) => r.json());
    if (j.state === "paid") {
      $("h1").textContent = t.paid(j.name); $("text").textContent = t.paid_text; $("note").textContent = t.note;
      if (j.whatsapp) { $("join").href = j.whatsapp; $("join").textContent = t.join; $("joinBox").hidden = false; }
      // the form is done: next time it starts fresh, in the same language
      try { localStorage.setItem("qaravan.club.v1", JSON.stringify({ lang })); } catch {}
    } else if (j.state === "unpaid" && tries > 0) { return setTimeout(() => check(tries - 1), 2500); }
    else if (j.state === "unpaid") {
      $("h1").textContent = t.unpaid; $("text").textContent = t.unpaid_text;
      $("join").href = "https://www.qaravan.org" + (lang === "en" ? "" : "/" + lang) + "/forms/club/"; $("join").removeAttribute("target"); $("join").textContent = t.back; $("joinBox").hidden = false;
    } else { $("h1").textContent = t.pending; $("text").textContent = t.pending_text; }
  } catch { $("h1").textContent = t.pending; $("text").textContent = t.pending_text; }
  $("h1").focus();
}
check(sid ? 3 : 0);
</script>
</body>
</html>

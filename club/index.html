<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Киноклуб QARAVAN</title>
<meta name="description" content="Киноклуб QARAVAN: раз в месяц смотрим фильмы о людях, которые меняли США.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:url" content="https://feedback.qaravan.org/club">
<meta property="og:title" content="Киноклуб QARAVAN / QARAVAN Movie Club">
<meta property="og:description" content="Раз в месяц смотрим фильмы о людях, которые меняли США.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/survey/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/survey/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/survey/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/FiraSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/FiraSansCondensed-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/qaravan.css">
<link rel="stylesheet" href="/assets/forms.css">
<style>
.wrap{max-width:720px}
.col{max-width:560px}
.intro{margin:0; font:400 17px/1.5 var(--font-brand); color:var(--q-ink); text-wrap:pretty}
.muted{margin:12px 0 0; color:var(--q-muted); font:400 15px/1.45 var(--font-brand); text-wrap:pretty}
[hidden]{display:none !important}
.progress{height:4px; background:var(--q-line); margin:28px 0 0}
.progress i{display:block; height:100%; width:0; background:var(--q-ink); transition:width .25s ease-out}
@media (prefers-reduced-motion:reduce){ .progress i{transition:none} }
.screen{padding-top:28px}
.screen:focus{outline:none}
.qtitle{margin:0 0 6px; font:600 21px/1.35 var(--font-brand); text-wrap:pretty}
.field+.field{margin-top:20px}
.lbl{display:block; margin:0 0 8px; font:600 16px/1.3 var(--font-brand)}
.lbl .opt{color:var(--q-muted); font-weight:400}
.field input{margin-top:0}
input[aria-invalid="true"]{border-color:var(--danger)}
.err{box-shadow:none; border:2px solid var(--danger); padding:14px 18px 15px}
.block{margin-top:32px; padding-top:28px; border-top:1px solid var(--q-line)}

/* ranking: posters in a grid, the picked ones carry an ink square with their place */
.count{margin:16px 0 0; font:600 15px/1.3 var(--font-head); letter-spacing:.01em; font-variant-numeric:tabular-nums}
.order{margin:8px 0 0; padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:6px 14px; font:400 15px/1.4 var(--font-brand); color:var(--q-muted)}
.order b{color:var(--q-ink); font-weight:600}
.grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px 14px; margin-top:20px}
@media (min-width:600px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr)); gap:24px 18px} }
.film{display:flex; flex-direction:column; min-width:0}
.pick{position:relative; display:block; width:100%; padding:0; border:0; background:none; text-align:left; cursor:pointer; color:var(--q-ink)}
.poster{display:block; position:relative; aspect-ratio:2/3; background:var(--q-line); border:2px solid var(--q-edge); overflow:hidden; transition:border-color .12s}
.poster img{display:block; width:100%; height:100%; object-fit:cover}
.poster .ph{position:absolute; inset:0; display:flex; align-items:flex-end; padding:12px; font:700 18px/1.1 var(--font-head); color:var(--q-muted)}
.pick:hover .poster{border-color:var(--q-ink)}
.pick[aria-pressed="true"] .poster{border:4px solid var(--q-ink)}
.badge{position:absolute; left:0; top:0; z-index:1; display:none; width:40px; height:40px; place-items:center; background:var(--q-ink); color:var(--q-white); font:700 22px/1 var(--font-head)}
.pick[aria-pressed="true"] .badge{display:grid}
.pick:not(:has(.poster)){padding:12px 12px 10px 56px; min-height:64px; border:2px solid var(--q-edge)}
.pick:not(:has(.poster)):hover{border-color:var(--q-ink)}
.pick:not(:has(.poster))[aria-pressed="true"]{border-color:var(--q-ink); box-shadow:inset 0 0 0 2px var(--q-ink)}
.pick:not(:has(.poster)) .ftitle{margin-top:0}
.mine{position:absolute; right:0; top:0; z-index:1; padding:4px 8px; background:var(--q-white); border-left:2px solid var(--q-ink); border-bottom:2px solid var(--q-ink); font:600 12.5px/1.2 var(--font-head); letter-spacing:.06em; text-transform:uppercase}
.ftitle{display:block; margin-top:10px; font:600 16px/1.3 var(--font-brand); text-wrap:balance}
.fyear{display:block; margin-top:2px; font:400 14px/1.3 var(--font-brand); color:var(--q-muted)}
.note{margin:6px 0 0; font:400 14px/1.4 var(--font-brand); color:var(--q-muted); text-wrap:pretty}
.trailer{min-height:40px; margin-top:4px; font-size:15px}
.trailer::before{content:""; width:0; height:0; margin-right:8px; border-left:9px solid var(--q-ink); border-top:6px solid transparent; border-bottom:6px solid transparent}
.toast{margin:14px 0 0}

/* adding your own film: search field, results as rows */
.results{display:grid; gap:8px; margin-top:12px}
.results button{display:flex; gap:12px; align-items:center; width:100%; min-height:56px; padding:6px 12px 6px 6px; border:2px solid var(--q-edge); background:var(--q-white); color:var(--q-ink); text-align:left; cursor:pointer; font:400 16px/1.3 var(--font-brand)}
.results button:hover{border-color:var(--q-ink)}
.results img,.results .noimg{flex:none; width:36px; height:54px; object-fit:cover; background:var(--q-line)}
.results small{display:block; color:var(--q-muted); font-size:14px}

/* membership tiers */
.tiers label{justify-content:space-between; align-items:center}
.tiers .amt{font:700 22px/1.1 var(--font-head)}
.tiers .rec{margin-left:auto; font:600 12.5px/1.2 var(--font-head); letter-spacing:.08em; text-transform:uppercase; color:var(--q-ink); border:2px solid var(--q-ink); padding:3px 7px}
.tiers label > span:first-of-type{display:flex; gap:12px; align-items:center}
.fee{margin:16px 0 0; font:600 16px/1.45 var(--font-brand); text-wrap:pretty}
.promise{display:flex; gap:12px; align-items:flex-start; margin-top:4px; cursor:pointer; font:400 16px/1.45 var(--font-brand); text-wrap:pretty}
.promise input{margin-top:2px}
.actions{margin-top:36px}
.actions .na-link{margin-top:20px}
.credit{margin-top:56px; display:flex; gap:12px; align-items:center; color:var(--q-muted); font:400 13px/1.4 var(--font-brand)}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* trailer player */
dialog{width:min(960px,calc(100vw - 24px)); max-width:none; padding:0; border:0; background:#000}
dialog::backdrop{background:rgba(0,0,0,.8)}
.frame{position:relative; aspect-ratio:16/9}
.frame iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
.close{position:absolute; right:0; top:-48px; min-height:44px; padding:8px 14px; border:2px solid var(--q-white); background:transparent; color:var(--q-white); font:600 16px/1 var(--font-head); cursor:pointer}
dialog[open]{overflow:visible; margin-top:max(64px,calc(50vh - 30vw))}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="wordmark" href="https://qaravan.org" aria-label="qaravan.org"><img src="/assets/logo-wordmark.svg" width="140" height="28" alt="qaravan"></a>
    <div class="lang" role="group" data-i18n-aria="language_label">
      <button type="button" id="btnRu" aria-pressed="true">RU</button>
      <button type="button" id="btnEn" aria-pressed="false">EN</button>
    </div>
  </div>

  <header class="hero col" id="hero">
    <div class="eyebrow" style="--flag:var(--q-red)" id="eyebrow"></div>
    <h1 id="h1"></h1>
  </header>

  <!-- 1–4: the join form -->
  <form id="joinForm" novalidate>
    <input class="hp" type="text" name="website" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="progress col" aria-hidden="true"><i id="bar"></i></div>

    <section class="screen col" data-step="1" tabindex="-1">
      <p class="intro" data-t="intro"></p>
      <p class="muted" data-t="intro2"></p>
      <div class="block">
        <h2 class="qtitle" data-t="q_contact"></h2>
        <div class="field"><label class="lbl" for="first" data-t="first"></label><input type="text" id="first" autocomplete="given-name" maxlength="60"><p class="field-hint" id="hint_first" data-t="err_first"></p></div>
        <div class="field"><label class="lbl" for="last" data-t="last"></label><input type="text" id="last" autocomplete="family-name" maxlength="80"><p class="field-hint" id="hint_last" data-t="err_last"></p></div>
        <div class="field"><label class="lbl" for="email" data-t="email"></label><input type="email" id="email" autocomplete="email" maxlength="200" inputmode="email"><p class="field-hint" id="hint_email" data-t="err_email"></p></div>
      </div>
    </section>

    <section class="screen" data-step="2" tabindex="-1" hidden>
      <div class="col">
        <h2 class="qtitle" data-t="q_rank"></h2>
        <p class="muted" data-t="rank_hint"></p>
        <p class="count" id="count" aria-live="polite"></p>
        <ol class="order" id="order"></ol>
        <p class="field-hint toast" id="hint_rank"></p>
      </div>
      <div class="grid" id="grid"></div>
      <div class="block col" id="addBlock" hidden>
        <h2 class="qtitle" data-t="add_title"></h2>
        <p class="muted" data-t="add_hint"></p>
        <input type="text" id="search" autocomplete="off" maxlength="80" data-ph="search_ph">
        <div class="results" id="results" aria-live="polite"></div>
        <p class="muted" id="searchNote" hidden></p>
      </div>
    </section>

    <section class="screen col" data-step="3" tabindex="-1" hidden>
      <fieldset>
        <legend data-t="q_topics"></legend>
        <p class="hint" data-t="many"></p>
        <div class="chips" id="topics" style="margin-top:16px"></div>
        <div class="other-input" id="topicOtherWrap"><input type="text" id="topicOther" maxlength="200" data-ph="other_ph"></div>
      </fieldset>
      <fieldset>
        <legend data-t="q_talk"></legend>
        <div class="opts" id="talk"></div>
      </fieldset>
    </section>

    <section class="screen col" data-step="4" tabindex="-1" hidden>
      <fieldset>
        <legend data-t="q_helps"></legend>
        <p class="hint" data-t="optional_many"></p>
        <div class="chips" id="helps" style="margin-top:16px"></div>
      </fieldset>
      <div class="block">
        <p class="muted" style="margin:0 0 16px" data-t="whatsapp_note"></p>
        <label class="promise"><input type="checkbox" id="promise"><span data-t="promise"></span></label>
        <p class="field-hint" id="hint_promise" data-t="err_promise"></p>
      </div>
    </section>

    <div class="col">
      <p class="err" id="err" role="alert"></p>
      <nav class="stepnav">
        <button type="button" class="back" id="backBtn" data-t="back"></button>
        <span class="stepcount" id="stepcount"></span>
        <button type="submit" class="next" id="nextBtn"></button>
      </nav>
    </div>
  </form>

  <!-- 5: membership -->
  <section class="screen col" id="memberView" tabindex="-1" hidden>
    <p class="intro" data-t="m_intro"></p>
    <fieldset>
      <legend class="sr-only" data-t="m_legend"></legend>
      <div class="opts tiers" id="tiers"></div>
    </fieldset>
    <p class="fee" data-t="fee"></p>
    <p class="err" id="payErr" role="alert"></p>
    <div class="actions">
      <div class="start"><button type="button" id="payBtn" data-t="pay"></button></div>
      <p class="muted" data-t="pay_hint"></p>
      <button type="button" class="na-link" id="excLink" data-t="exc_link"></button>
    </div>
  </section>

  <!-- 6: exception request -->
  <form class="screen col" id="excForm" tabindex="-1" novalidate hidden>
    <fieldset>
      <legend data-t="x_q"></legend>
      <p class="hint" data-t="many"></p>
      <div class="chips" id="reasons" style="margin-top:16px"></div>
      <div class="other-input" id="xOtherWrap"><input type="text" id="xOther" maxlength="200" data-ph="other_ph"></div>
      <p class="field-hint" id="hint_reasons" data-t="err_reasons"></p>
    </fieldset>
    <fieldset>
      <legend><span data-t="x_comment"></span> <span class="hint" style="display:inline" data-t="optional"></span></legend>
      <textarea id="xComment" maxlength="2000"></textarea>
    </fieldset>
    <p class="muted" data-t="x_privacy"></p>
    <div class="submit">
      <p class="err" id="xErr" role="alert"></p>
      <button type="submit" id="xSend" data-t="x_send"></button>
      <button type="button" class="back" id="xBack" data-t="x_back"></button>
    </div>
  </form>

  <!-- the end -->
  <section class="screen col" id="doneView" tabindex="-1" hidden>
    <p class="intro" id="doneText"></p>
    <button type="button" class="na-link" id="restart" data-t="restart" style="margin-top:28px"></button>
  </section>

  <p class="credit col" id="credit" hidden><span data-t="credit"></span></p>
  <footer class="col">qaravan.org</footer>
</div>

<dialog id="player" aria-labelledby="h1">
  <div class="frame"><iframe id="playerFrame" title="Trailer" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
  <button type="button" class="close" id="closePlayer" data-t="close"></button>
</dialog>

<script>

// Сервер — lib/club.mjs через /api/club. Коды ответов должны совпадать с картой L там.
const API = "/api/club";

  q_topics: "What would you like to understand about the US?", many: "You can pick several.", other_ph: "Tell us what",

  helps: { intro: "Introduce a film before the screening", host: "Host the discussion", photo: "Take photos", venue: "Find a venue" },
  whatsapp_note: "The club talks in a WhatsApp group. Group members can see each other’s phone numbers.",
  promise: "By joining the club, I agree that whenever my plans change, I’ll cancel my screening sign-up in advance where possible, so someone else can take my spot.",
  err_promise: "Tick the box to join.",
  back: "Back", next: "Next", join: "Next: membership", sending: "Sending…",
  step_of: (i, n) => `Step ${i} of ${n}`,
  err_summary: "Check the marked fields.",
  err_net: "We couldn’t send this. Your answers are saved on this page: check your connection and try again.",
  m_eyebrow: "Membership", m_title: "Club membership",
  m_intro: "Members vote on films, propose their own and help run the club.",
  m_legend: "Monthly fee",
  tier: (t) => `$${t} a month`, rec: "Recommended",
  fee: "All membership fees go to the club.",
  pay: "Continue to payment",
  pay_hint: "Card, Apple Pay or Google Pay. You can cancel at any time: the link comes by email.",
  pay_missing: "Payment isn’t set up yet. Please write to info@qaravan.org.",
  exc_link: "Can’t pay right now, I’ll apply for an exception",
  x_eyebrow: "Exception", x_title: "Apply for an exception",
  x_q: "What makes $5 a month hard right now?",
  reasons: { ead: "Waiting for my work permit (EAD)", job: "Looking for a job", housing: "Need help with housing", family: "Supporting my family", other: "Other" },
  err_reasons: "Pick at least one.",
  x_comment: "Anything to add?", optional: "optional",
  x_privacy: "Only two people on the QARAVAN team see these answers.",
  x_send: "Send request", x_back: "Back to payment",
  done_title: "Thank you!",
  done_requested: (e) => `We’ll reply within 12 hours at ${e}.`,
  member_title: "You’re already in the club",
  member_text: "The WhatsApp link is in the email from info@qaravan.org. If you can’t find it, check spam or write to us.",
  requested_title: "We already have your request",
  requested_text: "We’ll reply within 12 hours at the email you gave us.",
  restart: "Start the form again",
  credit: "Posters and trailers from TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.",
},
};
const TOPICS = ["lgbtq", "race", "hiv", "women", "politics", "immigration", "justice", "other"];
const TALK = ["ru", "en", "both"];
const HELPS = ["intro", "host", "photo", "venue"];
const REASONS = ["ead", "job", "housing", "family", "other"];
const TIERS = [5, 10, 15];
const STEPS = 4;

const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); for (const k of kids) if (k != null) e.append(k); return e; };

let S = { lang: "ru", step: 1, first: "", last: "", email: "", order: [], added: [], topics: [], topicOther: "", talk: "", helps: [], promise: false, key: "", view: "join", tier: 10, reasons: [], xOther: "", xComment: "", state: "", shuffle: [] };
try { Object.assign(S, JSON.parse(localStorage.getItem(DRAFT) || "{}")); } catch {}
if (S.name && !S.first && !S.last) { S.first = S.name; } delete S.name; // drafts from before the name was split
const save = () => { try { localStorage.setItem(DRAFT, JSON.stringify(S)); } catch {} };
const t = (k) => STRINGS[S.lang][k];

let FILMS = [], LINKS = {}, TMDB_ON = false;

// ===== texts =====
function applyTexts() {
  document.documentElement.lang = S.lang;
  $("btnRu").setAttribute("aria-pressed", S.lang === "ru"); $("btnEn").setAttribute("aria-pressed", S.lang === "en");
  document.querySelector(".lang").setAttribute("aria-label", t("language_label"));
  document.querySelectorAll("[data-t]").forEach((n) => { const v = t(n.dataset.t); if (typeof v === "string") n.textContent = v; });
  document.querySelectorAll("[data-ph]").forEach((n) => (n.placeholder = t(n.dataset.ph)));
  const head = { join: ["eyebrow", "title"], member: ["m_eyebrow", "m_title"], exception: ["x_eyebrow", "x_title"], done: ["eyebrow", "title"] }[S.view];
  $("eyebrow").textContent = t(head[0]); $("h1").textContent = t(head[1]);
  renderChips($("topics"), TOPICS, "topics", S.topics, (c) => { S.topics = c; $("topicOtherWrap").classList.toggle("show", c.includes("other")); });
  $("topicOtherWrap").classList.toggle("show", S.topics.includes("other"));
  renderChips($("helps"), HELPS, "helps", S.helps, (c) => (S.helps = c));
  renderChips($("reasons"), REASONS, "reasons", S.reasons, (c) => { S.reasons = c; $("xOtherWrap").classList.toggle("show", c.includes("other")); hint("reasons", false); });
  $("xOtherWrap").classList.toggle("show", S.reasons.includes("other"));
  renderOpts($("talk"), "talk", TALK, (c) => t("talk")[c], S.talk, (v) => (S.talk = v));
  renderTiers();
  renderFilms();
  renderStep();
  if (S.view === "done") renderDone();
}
function renderChips(box, codes, key, chosen, onChange) {
  box.replaceChildren(...codes.map((c) => {
    const b = el("button", { type: "button", textContent: t(key)[c] });
    b.setAttribute("aria-pressed", chosen.includes(c));
    b.onclick = () => { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); const next = codes.filter((x) => (x === c ? on : chosen.includes(x))); chosen.splice(0, chosen.length, ...next); onChange([...chosen]); save(); };
    return b;
  }));
}
function renderOpts(box, name, codes, label, value, onChange) {
  box.replaceChildren(...codes.map((c) => {
    const i = el("input", { type: "radio", name, value: c, checked: value === c });
    i.onchange = () => { onChange(c); save(); };
    return el("label", {}, i, el("span", { textContent: label(c) }));
  }));
}
function renderTiers() {
  $("tiers").replaceChildren(...TIERS.map((n) => {
    const i = el("input", { type: "radio", name: "tier", value: n, checked: S.tier === n });
    i.onchange = () => { S.tier = n; save(); };
    const left = el("span", {}, i, el("span", { className: "amt", textContent: t("tier")(n) }));
    return el("label", {}, left, n === 10 ? el("span", { className: "rec", textContent: t("rec") }) : null);
  }));
}

// ===== films =====
function shuffled(list) {
  // a stable random order per person, so the first films on the page don't collect more votes
  const ids = list.map((f) => f.key);
  if (S.shuffle.length !== ids.length || !ids.every((k) => S.shuffle.includes(k))) {
    const keep = S.shuffle.filter((k) => ids.includes(k));
    const fresh = ids.filter((k) => !keep.includes(k)).sort(() => Math.random() - 0.5);
    S.shuffle = [...keep, ...fresh];
  }
  return S.shuffle.map((k) => list.find((f) => f.key === k));
}
function allFilms() {
  const own = S.added.map((f) => ({ key: "t:" + f.tmdb, title: f.title, year: f.year, poster: f.poster || "", trailer: "", note: "", mine: true }));
  const pool = FILMS.map((f) => ({ key: "m:" + f.id, title: S.lang === "ru" && f.titleRu ? f.titleRu : f.title, year: f.year, poster: f.poster, trailer: f.trailer, note: S.lang === "ru" ? f.noteRu : f.noteEn }));
  return [...own, ...shuffled(pool)];
}
let CARDS = {}, BYKEY = {};
function renderFilms() {
  const list = allFilms();
  BYKEY = Object.fromEntries(list.map((f) => [f.key, f]));
  S.order = S.order.filter((k) => BYKEY[k]);
  CARDS = {};
  $("grid").replaceChildren(...list.map((f) => {
    // without TMDB there are no posters at all: the cards are just titles and notes
    let poster = null;
    if (f.poster || TMDB_ON) {
      poster = el("span", { className: "poster" });
      if (f.poster) poster.append(el("img", { src: f.poster, alt: "", loading: "lazy" }));
      else poster.append(el("span", { className: "ph", textContent: f.title }));
    }
    const badge = el("span", { className: "badge" });
    const pick = el("button", { type: "button", className: "pick" },
      badge, f.mine ? el("span", { className: "mine", textContent: t("mine") }) : null,
      poster, el("span", { className: "ftitle", textContent: f.title }), f.year ? el("span", { className: "fyear", textContent: f.year }) : null);
    pick.onclick = () => togglePick(f.key);
    CARDS[f.key] = { pick, badge };
    const card = el("div", { className: "film" }, pick);
    if (f.note) card.append(el("p", { className: "note", textContent: f.note }));
    if (f.trailer) { const tb = el("button", { type: "button", className: "na-link trailer", textContent: t("trailer") }); tb.onclick = () => play(f.trailer, f.title); card.append(tb); }
    return card;
  }));
  updatePicks();
  $("addBlock").hidden = !TMDB_ON;
  $("credit").hidden = !TMDB_ON;
}
// a tap changes only the marks, so focus and scroll stay where they are
function updatePicks() {
  for (const [k, c] of Object.entries(CARDS)) {
    const place = S.order.indexOf(k);
    c.pick.setAttribute("aria-pressed", place >= 0);
    c.badge.textContent = place >= 0 ? place + 1 : "";
  }
  $("count").textContent = t("count")(S.order.length);
  $("order").replaceChildren(...S.order.map((k, i) => el("li", {}, el("b", { textContent: `${i + 1}.` }), " ", BYKEY[k].title)));
}
function togglePick(key) {
  const i = S.order.indexOf(key);
  if (i >= 0) S.order.splice(i, 1);
  else if (S.order.length >= 5) { hint("rank", true, t("rank_full")); return; }
  else S.order.push(key);
  hint("rank", false); save(); updatePicks();
}
function play(key, title) {
  $("playerFrame").src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(key)}?autoplay=1&rel=0&modestbranding=1&hl=${S.lang}`;
  $("playerFrame").title = title;
  $("player").showModal();
}
$("closePlayer").onclick = () => $("player").close();
$("player").addEventListener("close", () => ($("playerFrame").src = "about:blank"));
$("player").addEventListener("click", (e) => { if (e.target === $("player")) $("player").close(); });

// adding a film through TMDB search
let searchTimer = 0, searchSeq = 0;
$("search").addEventListener("input", () => {
  clearTimeout(searchTimer);
  const q = $("search").value.trim();
  if (q.length < 2) { $("results").replaceChildren(); $("searchNote").hidden = true; return; }
  searchTimer = setTimeout(async () => {
    const seq = ++searchSeq;
    try {
      const r = await fetch(`${API}?action=search&q=${encodeURIComponent(q)}`).then((x) => x.json());
      if (seq !== searchSeq) return;
      const known = new Set([...FILMS.map((f) => String(f.tmdb || "")), ...S.added.map((f) => f.tmdb)]);
      const rows = (r.results || []).filter((f) => !known.has(f.tmdb));
      $("searchNote").hidden = rows.length > 0; $("searchNote").textContent = t("search_none");
      $("results").replaceChildren(...rows.map((f) => {
        const b = el("button", { type: "button" }, f.poster ? el("img", { src: f.poster, alt: "" }) : el("span", { className: "noimg" }), el("span", {}, f.title, el("small", { textContent: f.year || "" })));
        b.onclick = () => addFilm(f);
        return b;
      }));
    } catch { /* search is a bonus: a failure leaves the list as it is */ }
  }, 300);
});
function addFilm(f) {
  if (S.added.length >= 3) { $("searchNote").hidden = false; $("searchNote").textContent = t("add_max"); return; }
  S.added.push({ tmdb: f.tmdb, title: f.title, year: f.year, poster: f.poster });
  if (S.order.length < 5) S.order.push("t:" + f.tmdb);
  $("search").value = ""; $("results").replaceChildren();
  save(); renderFilms();
  $("grid").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth" });
}

// ===== steps =====
function renderStep() {
  for (const v of ["joinForm", "memberView", "excForm", "doneView"]) $(v).hidden = true;
  $({ join: "joinForm", member: "memberView", exception: "excForm", done: "doneView" }[S.view]).hidden = false;
  document.querySelectorAll("#joinForm .screen").forEach((s) => (s.hidden = +s.dataset.step !== S.step));
  $("bar").style.width = `${(S.step / STEPS) * 100}%`;
  $("stepcount").textContent = t("step_of")(S.step, STEPS);
  $("backBtn").style.visibility = S.step > 1 ? "visible" : "hidden";
  $("nextBtn").textContent = S.step === STEPS ? t("join") : t("next");
  $("first").value = S.first; $("last").value = S.last; $("email").value = S.email; $("topicOther").value = S.topicOther;
  $("promise").checked = S.promise; $("xOther").value = S.xOther; $("xComment").value = S.xComment;
}
function hint(key, on, text) {
  const h = $("hint_" + key); if (!h) return;
  if (text) h.textContent = text; else if (h.dataset.t) h.textContent = t(h.dataset.t);
  h.classList.toggle("show", on);
}
function showErr(id, msg) { const e = $(id); e.textContent = msg || ""; e.classList.toggle("show", !!msg); }
function go(view, step) {
  if (view) S.view = view; if (step) S.step = step;
  save(); applyTexts(); showErr("err", ""); window.scrollTo(0, 0);
  const focus = S.view === "join" ? document.querySelector(`#joinForm .screen[data-step="${S.step}"]`) : $({ member: "memberView", exception: "excForm", done: "doneView" }[S.view]);
  focus?.focus({ preventScroll: true });
}
const EMAIL_RX = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function validStep(step) {
  if (step === 1) {
    const ok = { first: !!S.first.trim(), last: !!S.last.trim(), email: EMAIL_RX.test(S.email.trim()) };
    for (const k in ok) { hint(k, !ok[k]); $(k).setAttribute("aria-invalid", !ok[k]); }
    const bad = Object.keys(ok).find((k) => !ok[k]);
    if (bad) $(bad).focus();
    return !bad;
  }
  if (step === 2) { const ok = S.order.length >= 3; hint("rank", !ok, t("err_rank")); return ok; }
  if (step === 4) { hint("promise", !S.promise); return S.promise; }
  return true;
}
for (const k of ["first", "last"]) $(k).oninput = (e) => { S[k] = e.target.value; hint(k, false); e.target.removeAttribute("aria-invalid"); save(); };
$("email").oninput = (e) => { S.email = e.target.value; hint("email", false); e.target.removeAttribute("aria-invalid"); save(); };
$("topicOther").oninput = (e) => { S.topicOther = e.target.value; save(); };
$("promise").onchange = (e) => { S.promise = e.target.checked; hint("promise", false); save(); };
$("xOther").oninput = (e) => { S.xOther = e.target.value; save(); };
$("xComment").oninput = (e) => { S.xComment = e.target.value; save(); };
$("backBtn").onclick = () => S.step > 1 && go(null, S.step - 1);
$("btnRu").onclick = () => { S.lang = "ru"; save(); applyTexts(); };
$("btnEn").onclick = () => { S.lang = "en"; save(); applyTexts(); };

$("joinForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!validStep(S.step)) { showErr("err", ""); return; }
  if (S.step < STEPS) return go(null, S.step + 1);
  const btn = $("nextBtn"); btn.disabled = true; btn.textContent = t("sending");
  try {
    const r = await fetch(`${API}?action=join`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
      lang: S.lang, first: S.first, last: S.last, email: S.email, ranking: S.order, added: S.added.map(({ tmdb, title, year }) => ({ tmdb, title, year })),
      topics: S.topics, topic_other: S.topicOther, talk: S.talk, helps: S.helps, promise: S.promise, website: $("website").value,
    }) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 400 && j.fields) {
      const step = ["first", "last", "email"].some((f) => j.fields.includes(f)) ? 1 : j.fields.includes("ranking") ? 2 : 4;
      go(null, step); validStep(step); showErr("err", t("err_summary")); return;
    }
    if (!r.ok || !j.ok) throw new Error("net");
    S.key = j.key || S.key; S.state = j.state;
    if (j.state === "member" || j.state === "requested") return go("done");
    go("member");
  } catch { showErr("err", t("err_net")); }
  finally { btn.disabled = false; btn.textContent = S.step === STEPS ? t("join") : t("next"); }
});

$("payBtn").onclick = () => {
  const link = LINKS[S.tier];
  if (!link || !S.key) { showErr("payErr", t("pay_missing")); return; }
  const u = new URL(link);
  u.searchParams.set("client_reference_id", S.key);
  u.searchParams.set("prefilled_email", S.email.trim());
  location.href = u.toString();
};
$("excLink").onclick = () => go("exception");
$("restart").onclick = () => { try { localStorage.setItem(DRAFT, JSON.stringify({ lang: S.lang })); } catch {} location.reload(); };
$("xBack").onclick = () => go("member");
$("excForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!S.reasons.length) { hint("reasons", true); return; }
  const btn = $("xSend"); btn.disabled = true; btn.textContent = t("sending");
  try {
    const r = await fetch(`${API}?action=exception`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: S.key, reasons: S.reasons, other: S.xOther, comment: S.xComment, lang: S.lang }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error("net");
    S.state = j.state === "member" ? "member" : "sent";
    go("done");
  } catch { showErr("xErr", t("err_net")); }
  finally { btn.disabled = false; btn.textContent = t("x_send"); }
});
function renderDone() {
  const [title, text] = S.state === "member" ? [t("member_title"), t("member_text")]
    : S.state === "requested" ? [t("requested_title"), t("requested_text")]
    : [t("done_title"), t("done_requested")(S.email.trim())];
  $("h1").textContent = title; $("doneText").textContent = text;
}

// ===== start =====
applyTexts();
document.getElementById("hero").classList.add("on");
fetch(`${API}?action=films`).then((r) => r.json()).then((j) => {
  FILMS = j.films || []; LINKS = j.links || {}; TMDB_ON = !!j.tmdb;
  renderFilms();
}).catch(() => {});
</script>
</body>
</html>

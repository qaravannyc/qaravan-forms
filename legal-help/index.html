<style>
.intro{margin:0; font:400 17px/1.5 var(--font-brand); color:var(--q-ink); text-wrap:pretty}
.second{margin:12px 0 0; color:var(--q-muted); font-size:15px; line-height:1.45; text-wrap:pretty}
.second[hidden]{display:none}

/* what to know before starting: a plain box with a full hairline, small ink squares as bullets */
.know{margin:24px 0 0; padding:16px 20px 18px; border:1px solid var(--q-edge); list-style:none}
.know li{position:relative; padding-left:20px; font:400 15.5px/1.45 var(--font-brand); text-wrap:pretty}
.know li+li{margin-top:10px}
.know li::before{content:""; position:absolute; left:0; top:.55em; width:8px; height:8px; background:var(--q-ink)}
.start{margin-top:32px}

/* more room at the sides than the other forms: the column sits in the middle with air around it */
.wrap{max-width:540px; padding:20px 28px 64px}
@media (min-width:600px){ .wrap{padding:32px 32px 72px} }

/* one question per screen: progress bar, the section name as eyebrow, the question, then Back / Next */
.hero.in-steps{display:none}
.progress{height:4px; background:var(--q-line); margin:4px 0 0}
.progress i{display:block; height:100%; width:0; background:var(--q-ink); transition:width .25s ease-out}
@media (prefers-reduced-motion:reduce){ .progress i{transition:none} }
.q-screen{min-height:calc(100svh - 260px); padding-top:5vh}
.q-screen:focus{outline:none}
.q-screen .eyebrow{margin-bottom:14px}
.q-screen fieldset{padding-top:0}
.q-screen legend{font:600 21px/1.35 var(--font-brand)}

/* answer rows: the chosen row is marked by an ink edge and bold words, no side bar */
.opts label:has(input:checked){box-shadow:none; border-color:var(--q-ink)}
.opts label{padding-left:16px}
.opts.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts label[hidden]{display:none}

/* errors: a full red edge around the alert, never a side bar */
.err{box-shadow:none; border:2px solid var(--danger); padding:14px 18px 15px}
.bad-group .opts label{border-color:var(--danger)}
.opts+.field-hint{margin-top:12px}

.field+.field{margin-top:20px}
.lbl{display:block; margin:0 0 8px; font:600 16px/1.3 var(--font-brand)}
.lbl .opt{color:var(--q-muted); font-weight:400}
.field input{margin-top:0}
input[aria-invalid="true"]{border-color:var(--danger)}
.money{position:relative}
.money::before{content:"$"; position:absolute; left:14px; top:50%; transform:translateY(-50%); font:400 16px/1 var(--font-brand); color:var(--q-muted)}
.money input{padding-left:28px; max-width:220px}
[hidden]{display:none !important}
.money input{margin-top:0}
#thanks h1:focus{outline:none}
</style>
</head>

    <footer>qaravan.org</footer>

</div>

  q: {
    help: "What legal help do you need right now?",
    stage: "Where is your asylum case now?",
    arrived: "What year did you come to the US?",
    deadline: "Do you have a date coming up: a court hearing, an interview or a filing deadline?",
    detained: "Have you ever been in immigration detention in the US?",
    lawyer: "Do you have a lawyer for this case now?",
    search: "How long have you been looking for a lawyer?",
    tried: "Where have you already asked for a lawyer?",
    result: "What happened?",
    price: "If a private lawyer quoted you a price, how much was it?",
    scam: "Has a lawyer or a paid helper ever taken your money and not helped, or made mistakes in your documents?",
    lgbtqexp: "Does it matter to you that your lawyer has experience with LGBTQ+ cases?",
    badexp: "Has a lawyer or interpreter ever failed to understand your story as an LGBTQ+ person, or judged you for it?",
    impact: "What has happened, or may happen, because you don’t have a lawyer?",
    fees: "Can you pay the USCIS fees right now?",
    story: "If you like, tell us in a few sentences what a lawyer would change for you.",
    borough: "Where do you live?",
    meet: "Where would it be easiest for you to meet a lawyer?",
    langs: "In which language would you rather talk to a lawyer?",
    country: "Which country did you come from?",
    lgbtq: "Do you consider yourself part of the LGBTQ+ community?",
    trans: "Are you transgender or nonbinary?",
    consent: "May we use your answers, without your name, in funding applications and in conversations with New York City Council members?",
    quote: "May we quote, without your name, what you wrote about what a lawyer would change for you?",
    speak: "Would you be willing to talk about your experience with a City Council member or at a coalition action?",
    followup: "Would you like us to contact you when there is news about free lawyers or meetings with lawyers?",
  },
  hint: {
    price: "Amount in dollars.",
    fees: "Since October 16, 2026, an asylum application costs $100, there is a $105 fee every year while the case is pending, and a first work permit costs $570.",
    story: "No names or case details, please.",
  },
  o: {
    help: { asylum: "File for asylum", interview: "Prepare for a USCIS interview", court: "A case in immigration court", ead: "Work permit (EAD): first one or renewal", greencard: "Green card after asylum", appeal: "Appeal or reopening a case", detention: "Help related to ICE detention", temp: "Parole, TPS or other temporary status", other: "Other" },
    stage: { not_filed: "Not filed yet", thin: "Filed without a detailed story, for example to meet the one-year deadline or to get a work permit", filed: "Filed with USCIS, no interview yet", interviewed: "Interviewed by USCIS, no decision yet", ref_after: "USCIS sent the case to immigration court after the interview", ref_noint: "USCIS sent the case to immigration court without an interview", court: "The case has been in immigration court from the start, no decision yet", dismissed: "The immigration court case was dismissed at ICE’s request", order_appeal: "A judge ordered removal (including at a mass hearing), and an appeal is filed or being prepared", order_absentia: "A removal order was made in absentia, because the hearing was missed or no notice came", order_no_appeal: "There is a removal order, and no appeal was filed", granted: "Asylum granted", not_asylum: "I’m not applying for asylum", unsure: "I don’t know", other: "Other" },
    arrived: { y2026: "2026", y2025: "2025", y2024: "2024", y2023: "2023", y2022: "2022", before: "Before 2022" },
    deadline: { month: "Yes, within a month", m1_3: "Yes, in 1–3 months", later: "Yes, in more than 3 months", none: "No", unsure: "I don’t know" },
    detained: YN_EN,
    lawyer: { free: "Yes, a free one through an organization", paid: "Yes, a paid one", had: "I had one, but not now", never: "No, never" },
    search: { lt1: "Less than a month", m1_3: "1–3 months", m3_6: "3–6 months", gt6: "More than six months", alone: "I’m not looking, I’m handling the papers myself" },
    tried: { ark: "Ark Immigration Clinic at CBST", lsnyc: "Legal Services NYC", ie: "Immigration Equality", las: "The Legal Aid Society", otherfree: "Other free organizations", private: "Private lawyers", none: "Nowhere yet", other: "Other" },
    result: { noreply: "No one answered", full: "Turned away: no capacity", notcase: "Turned away: they don’t take cases like mine", waitlist: "Put on a waitlist", consult: "Only a consultation", nolang: "No one spoke Russian and no interpreter was offered", cost: "A private lawyer was too expensive", other: "Other" },
    scam: YN_EN, badexp: YN_EN, lgbtq: YN_EN, trans: YN_EN,
    lgbtqexp: { very: "Very important", rather: "Somewhat important", not: "Not important" },
    impact: { deadline: "I missed, or may miss, a filing deadline", nowork: "No work permit, so I take informal work", fees: "I can’t pay the USCIS fees", alone: "I’m preparing documents alone and afraid of mistakes", court: "I’m afraid of losing in court", deport: "I could be deported", other: "Other" },
    fees: { yes: "Yes", hard: "With difficulty", no: "No", unsure: "I don’t know" },
    borough: { bk: "Brooklyn", qn: "Queens", mn: "Manhattan", bx: "Bronx", si: "Staten Island", outside: "Outside New York City" },
    meet: { south_bk: "Brighton Beach, Sheepshead Bay and nearby", bk: "Other parts of Brooklyn", mn: "Manhattan", qn: "Queens", online: "Online", any: "No preference" },
    langs: { ru: "Russian", uk: "Ukrainian", en: "English", uz: "Uzbek", tg: "Tajik", other: "Other" },
    country: { ru: "Russia", ua: "Ukraine", by: "Belarus", kz: "Kazakhstan", uz: "Uzbekistan", tj: "Tajikistan", kg: "Kyrgyzstan", am: "Armenia", az: "Azerbaijan", ge: "Georgia", md: "Moldova", other: "Another country" },
    consent: { yes: "Yes", no: "No" }, quote: { yes: "Yes", no: "No" }, followup: { yes: "Yes", no: "No" },
    speak: { yes: "Yes", maybe: "Maybe", no: "No" },
  },
  contact_name: "What should we call you",
  contact: "Telegram, phone or email",
  optional: "optional",
  send: "Send answers",
  sending: "Sending…",
  err_consent: "Answer this question to send the form.",
  err_contact: "Tell us how to reach you, or choose “No”.",
  err_summary: "Check the highlighted questions and select “Send answers” again.",
  err_net: "We couldn’t send your answers. They are still on this page: check your connection and select “Send answers” again.",
  thanks_t: "Thank you!",
  thanks_p: "Your answers help us press for free lawyers for LGBTQ+ immigrants in New York. If you need legal help urgently, write to us at info@qaravan.org and we’ll tell you where to turn.",
}};

// ===== состояние =====
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
let lang = "ru", cur = null, sending = false, tried = false; // cur: ключ вопроса на экране, null — вступление
const ORDER = STEPS.flat();
const S = { story: "", price: "", contactName: "", contact: "" };
for (const [k, q] of Object.entries(Q)) if (q.type === "one") S[k] = ""; else if (q.type === "many") S[k] = [];
const OTHERS = {}; for (const q of Object.values(Q)) if (q.other) OTHERS[q.other] = "";
const rid = (() => { const a = new Uint8Array(12); crypto.getRandomValues(a); return [...a].map((b) => b.toString(36).padStart(2, "0")).join("").slice(0, 20); })();
let RID = rid;
const T = () => STRINGS[lang];
const visible = (k) => !Q[k].show || Q[k].show(S);
const seq = () => ORDER.filter(visible); // вопросы, которые человек увидит при нынешних ответах

// ===== черновик =====
function saveDraft() {
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ lang, cur, S, OTHERS, RID })); } catch (e) {}
}
function loadDraft() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); } catch (e) {}
  if (!d || typeof d !== "object") return;
  if (d.lang === "en" || d.lang === "ru") lang = d.lang;
  if (d.S && typeof d.S === "object") for (const k of Object.keys(S)) {
    const v = d.S[k];
    if (Array.isArray(S[k])) { if (Array.isArray(v)) S[k] = v.filter((c) => Q[k].opts.includes(c)); }
    else if (Q[k] && Q[k].type === "one") { if (Q[k].opts.includes(v)) S[k] = v; }
    else if (typeof v === "string") S[k] = v;
  }
  if (d.OTHERS) for (const k of Object.keys(OTHERS)) if (typeof d.OTHERS[k] === "string") OTHERS[k] = d.OTHERS[k];
  if (typeof d.RID === "string" && /^[a-z0-9]{8,40}$/.test(d.RID)) RID = d.RID;
  if (ORDER.includes(d.cur)) cur = d.cur;
}
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

// ===== рендер =====
function optionRow(k, code, multi) {
  const l = document.createElement("label");
  const i = document.createElement("input");
  i.type = multi ? "checkbox" : "radio"; i.name = k; i.value = code;
  i.checked = multi ? S[k].includes(code) : S[k] === code;
  i.onchange = () => {
    if (multi) {
      const ex = Q[k].exclusive;
      if (i.checked) S[k] = code === ex ? [code] : [...S[k].filter((c) => c !== ex), code];
      else S[k] = S[k].filter((c) => c !== code);
    } else S[k] = code;
    onChange(true);
    // один ответ без поля «Другое» — сразу к следующему вопросу
    if (!multi && code !== "other" && k !== "followup" && k === cur) setTimeout(() => { if (cur === k) next(); }, 350);
  };
  const s = document.createElement("span"); s.textContent = T().o[k][code];
  l.append(i, s);
  return l;
}
function renderQuestion(k) {
  const q = Q[k], t = T();
  const fs = document.createElement("fieldset"); fs.id = "fs_" + k; fs.hidden = !visible(k);
  const lg = document.createElement("legend"); lg.id = "q_" + k;
  const qt = document.createElement("span"); qt.textContent = t.q[k]; lg.appendChild(qt);
  if (q.required) { const r = document.createElement("span"); r.className = "req"; r.setAttribute("aria-hidden", "true"); r.textContent = " *"; lg.appendChild(r); }
  const hint = q.type === "many" ? t.many : t.hint[k];
  if (hint) { const h = document.createElement("span"); h.className = "hint"; h.textContent = hint; lg.appendChild(h); }
  fs.appendChild(lg);

  if (q.type === "one" || q.type === "many") {
    const box = document.createElement("div");
    box.className = "opts" + (q.cols ? " cols" + q.cols : "");
    box.setAttribute("role", q.type === "one" ? "radiogroup" : "group");
    box.setAttribute("aria-labelledby", "q_" + k);
    for (const code of q.opts) box.appendChild(optionRow(k, code, q.type === "many"));
    fs.appendChild(box);
    if (q.other) {
      const wrap = document.createElement("div");
      const on = q.type === "many" ? S[k].includes("other") : S[k] === "other";
      wrap.className = "other-input" + (on ? " show" : "");
      const inp = document.createElement("input"); inp.type = "text"; inp.maxLength = 300; inp.value = OTHERS[q.other];
      inp.placeholder = t.other_ph; inp.setAttribute("aria-label", t.q[k] + ": " + t.o[k].other);
      inp.oninput = () => { OTHERS[q.other] = inp.value; saveDraft(); };
      wrap.appendChild(inp); fs.appendChild(wrap);
    }
  } else if (q.type === "money") {
    const w = document.createElement("div"); w.className = "money";
    const inp = document.createElement("input"); inp.type = "text"; inp.inputMode = "numeric"; inp.maxLength = 9; inp.value = S.price;
    inp.setAttribute("aria-labelledby", "q_" + k);
    inp.oninput = () => { inp.value = inp.value.replace(/[^\d]/g, ""); S.price = inp.value; saveDraft(); };
    w.appendChild(inp); fs.appendChild(w);
  } else if (q.type === "text") {
    const ta = document.createElement("textarea"); ta.maxLength = 4000; ta.value = S.story;
    ta.setAttribute("aria-labelledby", "q_" + k);
    ta.oninput = () => { const had = S.story.trim() !== ""; S.story = ta.value; if (had !== (S.story.trim() !== "")) onChange(true); else saveDraft(); };
    fs.appendChild(ta);
  }

  if (k === "followup") {
    const box = document.createElement("div"); box.id = "contactBox"; box.hidden = S.followup !== "yes"; box.style.marginTop = "20px";
    box.innerHTML = `<div class="field"><label class="lbl" for="contactName"></label><input type="text" id="contactName" maxlength="120" autocomplete="name"></div>
      <div class="field"><label class="lbl" for="contact"></label><input type="text" id="contact" maxlength="200" autocomplete="off" aria-describedby="contactErr" aria-required="true"><p class="field-hint" id="contactErr"></p></div>`;
    box.querySelector('label[for="contactName"]').innerHTML = `${t.contact_name} <span class="opt">${t.optional}</span>`;
    box.querySelector('label[for="contact"]').innerHTML = `${t.contact} <span class="req" aria-hidden="true">*</span>`;
    box.querySelector("#contactErr").textContent = t.err_contact;
    const n = box.querySelector("#contactName"), c = box.querySelector("#contact");
    n.value = S.contactName; c.value = S.contact;
    n.oninput = () => { S.contactName = n.value; saveDraft(); };
    c.oninput = () => { S.contact = c.value; onChange(false); };
    fs.appendChild(box);
  }
  if (k === "consent") {
    const e = document.createElement("p"); e.className = "field-hint"; e.id = "consentErr"; e.textContent = t.err_consent;
    fs.appendChild(e);
  }
  return fs;
}
function renderScreen() {
  const wrap = $("steps"); wrap.innerHTML = "";
  const sec = document.createElement("section"); sec.className = "q-screen step on"; sec.id = "screen"; sec.tabIndex = -1;
  const e = document.createElement("div"); e.className = "eyebrow"; e.style.setProperty("--flag", "var(--q-purple)");
  e.textContent = T().steps[STEPS.findIndex((st) => st.includes(cur))];
  sec.append(e, renderQuestion(cur));
  wrap.appendChild(sec);
}
function renderNav() {
  const s = seq(), i = s.indexOf(cur), last = i === s.length - 1;
  $("stepcount").textContent = T().step_of(i + 1, s.length);
  $("bar").style.width = ((i + 1) / s.length) * 100 + "%";
  $("nextBtn").hidden = last;
  $("submitBox").hidden = !last;
}
function render() {
  document.documentElement.lang = lang;
  document.title = T().title;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = T()[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-aria]").forEach((el) => el.setAttribute("aria-label", T()[el.dataset.i18nAria]));
  $("second").hidden = lang !== "ru";
  $("know").innerHTML = ""; for (const p of T().know) { const li = document.createElement("li"); li.textContent = p; $("know").appendChild(li); }
  $("btnRu").setAttribute("aria-pressed", lang === "ru" ? "true" : "false");
  $("btnEn").setAttribute("aria-pressed", lang === "en" ? "true" : "false");
  $("introView").hidden = cur !== null;
  $("f").hidden = cur === null;
  $("hero").classList.toggle("in-steps", cur !== null);
  if (cur !== null) { renderScreen(); renderNav(); }
  if (tried) validate(false);
  if (sending) $("send").textContent = T().sending;
}
function setLang(l) { lang = l; render(); saveDraft(); }
$("btnRu").onclick = () => setLang("ru");
$("btnEn").onclick = () => setLang("en");

// показать или скрыть вопросы с условием и поля «Другое» без полной перерисовки
function refreshVisibility() {
  for (const k of Object.keys(Q)) { const fs = $("fs_" + k); if (fs) fs.hidden = !visible(k); }
  for (const [k, q] of Object.entries(Q)) if (q.other) {
    const fs = $("fs_" + k); if (!fs) continue;
    const on = q.type === "many" ? S[k].includes("other") : S[k] === "other";
    fs.querySelector(".other-input").classList.toggle("show", on);
  }
  for (const [k, q] of Object.entries(Q)) if (q.type === "many") {
    const fs = $("fs_" + k); if (!fs) continue;
    fs.querySelectorAll("input").forEach((i) => { i.checked = S[k].includes(i.value); });
  }
  const cb = $("contactBox"); if (cb) cb.hidden = S.followup !== "yes";
}
function onChange(structural) {
  if (structural) { refreshVisibility(); if (cur !== null) renderNav(); }
  saveDraft();
  if (tried && validate(false)) $("err").classList.remove("show");
}

// ===== шаги =====
function go(to) {
  cur = to; saveDraft();
  render();
  window.scrollTo(0, 0);
  const sc = $("screen"); if (sc) sc.focus({ preventScroll: true });
}
function next() {
  // без ответа на вопрос о согласии дальше не пускаем
  if (cur === "consent" && !S.consent) { tried = true; validate(true); return; }
  const s = seq(), i = s.indexOf(cur);
  if (i < s.length - 1) go(s[i + 1]);
}
function back() {
  const s = seq(), i = s.indexOf(cur);
  go(i > 0 ? s[i - 1] : null);
}
$("startBtn").onclick = () => go(seq()[0]);
$("nextBtn").onclick = next;
$("backBtn").onclick = back;

// ===== проверка (только последний шаг: согласие и контакт) =====
function validate(focus) {
  const bad = [];
  if (!S.consent) bad.push("consent");
  if (S.followup === "yes" && !S.contact.trim()) bad.push("contact");
  const cfs = $("fs_consent"); if (cfs) { cfs.classList.toggle("bad-group", bad.includes("consent")); $("consentErr").classList.toggle("show", bad.includes("consent")); }
  if (bad[0] === "consent" && focus && cur !== "consent") { go("consent"); return false; }
  const c = $("contact");
  if (c) { $("contactErr").classList.toggle("show", bad.includes("contact")); bad.includes("contact") ? c.setAttribute("aria-invalid", "true") : c.removeAttribute("aria-invalid"); }
  if (focus && bad.length) {
    const el = bad[0] === "consent" ? $("fs_consent").querySelector("input") : $("contact");
    if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); el.focus({ preventScroll: true }); }
  }
  return bad.length === 0;
}

// ===== отправка: только видимые вопросы =====
function payload() {
  const b = { website: $("website").value, lang, rid: RID };
  for (const k of Object.keys(Q)) {
    if (!visible(k)) continue;
    const q = Q[k];
    if (q.type === "money") b.price = S.price;
    else if (q.type === "text") b.story = S.story;
    else b[k] = S[k];
    if (q.other) b[q.other] = OTHERS[q.other];
  }
  if (S.followup === "yes") { b.contactName = S.contactName; b.contact = S.contact; }
  return b;
}
$("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  if (sending || cur !== seq()[seq().length - 1]) return;
  tried = true;
  const err = $("err");
  if (!validate(true)) { err.textContent = T().err_summary; err.classList.add("show"); return; }
  err.classList.remove("show");
  sending = true;
  const btn = $("send"); btn.disabled = true; btn.textContent = T().sending;
  try {
    const r = await fetch("/api/legal-help", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload()) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 400 && Array.isArray(j.fields) && j.fields.length) { validate(true); err.textContent = T().err_summary; err.classList.add("show"); return; }
    if (!r.ok || !j.ok) throw new Error(j.error || "HTTP " + r.status);
    clearDraft();
    $("formView").style.display = "none";
    $("thanks").classList.add("show");
    window.scrollTo(0, 0);
    $("thanks").querySelector("h1").focus();
  } catch (e) {
    err.textContent = T().err_net; err.classList.add("show");
  } finally {
    sending = false; btn.disabled = false; btn.textContent = T().send;
  }
});

// ===== старт =====
loadDraft();
if (params.get("lang") === "en" || params.get("lang") === "ru") lang = params.get("lang");
render();
requestAnimationFrame(() => $("hero").classList.add("on"));
</script>
</body>
</html>

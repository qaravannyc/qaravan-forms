# GitHub отключает регулярные запуски в публичном репозитории, если в нём 60 дней не было
# изменений, — тогда ведущие перестали бы получать письмо «отметьте, кто пришёл»
# (meeting-attendance.yml). Раз в месяц этот запуск заново включает регулярные запуски через
# API: счётчик 60 дней обнуляется без пустых коммитов (и без лишнего деплоя на Vercel).
# Себя он включает тоже.
name: Keep scheduled workflows on

on:
  schedule:
    - cron: "17 12 1 * *" # 1-го числа каждого месяца
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in meeting-attendance.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
            echo "enabled: $wf"
          done

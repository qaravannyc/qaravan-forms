<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support letter — QARAVAN</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/survey/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/survey/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/survey/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/FiraSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/FiraSansCondensed-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/qaravan.css">
<style>
/* The letter intake form on the QARAVAN design system (tokens and fonts: /assets/qaravan.css).
   Square shapes, ink controls, brand colour only as flags and marks, no tinted grounds. */
p{margin:0; text-wrap:pretty}
@keyframes q-fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.fade{animation:q-fade .35s ease-out}
main h1[tabindex]:focus{outline:none}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
.hp{position:absolute; left:-9999px; top:-9999px}
.mk{width:16px; height:16px; flex:none; display:block}

/* «to the end of the list»: a sky action is an ink button with a sky flag, lifted above the page */
.tojump{position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:15; display:inline-flex; align-items:center; gap:8px;
  min-height:44px; padding:8px 16px 8px 22px; border:2px solid var(--q-ink); background:var(--q-ink); color:var(--q-white); cursor:pointer; white-space:nowrap;
  font:600 16px/1.15 var(--font-head); letter-spacing:.01em; box-shadow:var(--shadow-pop); animation:q-rise .3s ease-out}
.tojump::before{content:""; position:absolute; left:-2px; top:-2px; bottom:-2px; width:8px; background:var(--q-sky)}
.tojump[hidden]{display:none}
.tojump:hover{box-shadow:inset 0 0 0 999px rgba(0,0,0,.14), var(--shadow-pop)}
.tojump:active{transform:translate(-50%,1px)}
@keyframes q-rise{from{opacity:0; transform:translate(-50%,10px)} to{opacity:1; transform:translate(-50%,0)}}

/* header: white with a hairline, the wordmark, «save for later» and the language menu */
.hdr{position:sticky; top:0; z-index:20; background:var(--q-white); border-bottom:1px solid var(--q-line)}
.hdr-in{max-width:1040px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px}
.hdr .wordmark img{width:140px}
.hdr-r{display:flex; align-items:center; gap:6px; min-width:0}
.linkbtn{min-height:44px; padding:10px; border:0; background:transparent; color:var(--q-ink); cursor:pointer; white-space:nowrap; text-align:right;
  font:600 15px/1.2 var(--font-brand); text-decoration:underline; text-decoration-color:var(--q-sky); text-decoration-thickness:2px; text-underline-offset:3px}
.linkbtn:hover{text-decoration-color:currentColor; text-decoration-thickness:3px}
.linkbtn .short{display:none}
@media (max-width:520px){.linkbtn .full{display:none} .linkbtn .short{display:inline}}
/* the language Dropdown: a square button with a globe; the menu is a white panel with an ink top edge */
.langwrap{position:relative; flex:none}
.langbtn{display:inline-flex; align-items:center; gap:10px; min-height:44px; padding:8px 12px 8px 14px; border:2px solid var(--q-ink); background:transparent;
  color:var(--q-ink); cursor:pointer; font:600 16px/1.15 var(--font-head); letter-spacing:.01em; transition:background-color .12s, color .12s}
.langbtn:hover{background:var(--q-line)}
.langbtn[aria-expanded="true"]{background:var(--q-ink); color:var(--q-white)}
.langbtn .globe{width:18px; height:18px; flex:none}
.langbtn .chev{width:14px; height:14px; flex:none; transition:transform .15s}
.langbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.langbg{position:fixed; inset:0; z-index:29}
.langlist{position:absolute; right:0; top:calc(100% + 6px); z-index:30; min-width:248px; padding:6px 0; display:flex; flex-direction:column;
  background:var(--q-white); border:1px solid var(--q-line); border-top:4px solid var(--q-ink); box-shadow:var(--shadow-pop); animation:q-dd .12s ease-out}
@keyframes q-dd{from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none}}
.langopt{position:relative; display:flex; align-items:center; gap:14px; min-height:46px; padding:10px 16px 10px 22px; cursor:pointer; user-select:none;
  color:var(--q-ink); font:500 17px/1.3 var(--font-brand)}
.langopt:hover{background:var(--q-line)}
.langopt:focus-visible{outline-offset:-3px}
.langopt.on{font-weight:600}
.langopt.on::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--q-sky)}
.langopt .name{flex:1; min-width:0}
.langopt .tick{width:16px; height:16px; flex:none}
/* progress on phones */
.pprog{max-width:1040px; margin:0 auto; padding:0 20px 10px}
.bar{height:4px; background:var(--q-line); overflow:hidden}
.bar i{display:block; height:100%; background:var(--q-sky); transition:width .3s ease-out}
.pmeta{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-top:8px; font:600 14px/1.2 var(--font-head); letter-spacing:.01em; color:var(--q-muted)}
/* eyebrow: a colour flag, then tracked capitals in ink */
.eyebrow{display:inline-flex; align-items:center; gap:10px; font:600 13.5px/1.2 var(--font-head); letter-spacing:.1em; text-transform:uppercase; color:var(--q-ink)}
.eyebrow::before{content:""; flex:none; width:.62em; height:.62em; background:var(--q-sky)}
.eyebrow.gray::before{background:var(--q-edge)}
.eyebrow.green::before{background:var(--q-green)}
.eyebrow.orange::before{background:var(--q-orange)}

/* layout */
.wrap{max-width:1040px; margin:0 auto; padding:24px 20px 80px; display:flex; gap:56px; align-items:flex-start; justify-content:center}
.wrap.rail{justify-content:flex-start}
main{flex:1 1 320px; max-width:560px; min-width:0}
.stack{display:flex; flex-direction:column; gap:20px}
.stack.step{gap:22px}
h1{margin:0; font:700 clamp(28px,6vw,34px)/1.1 var(--font-head); letter-spacing:var(--tracking-display); text-wrap:balance}
h1.big{font-size:clamp(32px,7vw,40px); line-height:1.08}
.help{color:var(--q-muted); font-size:16px}
.small{font-size:15px; color:var(--q-muted)}
.luck{font:700 22px/1.25 var(--font-head); letter-spacing:var(--tracking-display)}
.trfb{margin-top:34px; text-align:center}
.trfb-link{padding:6px; border:0; background:none; cursor:pointer; color:var(--q-muted); font:600 15px/1.3 var(--font-brand);
  text-decoration:underline; text-decoration-color:var(--q-sky); text-decoration-thickness:2px; text-underline-offset:4px}
.trfb-link:hover,.trfb-link.on{color:var(--q-ink)}
.trfb-panel{text-align:left; margin-top:10px; padding:18px; display:flex; flex-direction:column; gap:12px; background:var(--q-white); border:1px solid var(--q-line)}
.trfb-panel p{margin:0; font-size:15px; color:var(--q-muted)}
.trfb-panel textarea.in{min-height:96px}

/* fields: label, control, hint and error as one group */
.lbl{display:block; margin-bottom:8px; font:600 15px/1.3 var(--font-brand)}
.opt{color:var(--q-muted); font-weight:400}
.field{display:block}
.in{width:100%; min-height:44px; padding:9px 12px; border:2px solid var(--q-edge); border-radius:0; background:var(--q-white); color:var(--q-ink);
  font:400 16px/1.4 var(--font-brand); transition:border-color .12s; -webkit-appearance:none; appearance:none}
.in:hover{border-color:var(--q-ink)}
.in:focus{border-color:var(--q-ink); outline:3px solid var(--accent); outline-offset:0}
.in.err,.in.err:hover,.in.err:focus{border-color:var(--danger)}
textarea.in{line-height:1.5; resize:vertical; min-height:140px}
.selwrap{position:relative; display:block}
.selwrap select{padding-right:40px; cursor:pointer}
.selwrap svg{position:absolute; right:14px; top:50%; width:14px; height:14px; transform:translateY(-50%); pointer-events:none}
.ferr{display:flex; gap:8px; align-items:baseline; margin-top:6px; font:600 14px/1.4 var(--font-brand); color:var(--q-ink)}
.ferr::before{content:""; flex:none; width:10px; height:10px; background:var(--danger); transform:translateY(1px)}
.ferr:empty{display:none}
.hint{display:block; margin-top:6px; color:var(--q-muted); font-size:15px; line-height:1.45}
.flex{display:flex; gap:10px; flex-wrap:wrap}
.flex>.grow{flex:1 1 200px}

/* chips: square, a visible edge at rest, ink when chosen */
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{min-height:44px; padding:9px 16px; border:2px solid var(--q-edge); background:var(--q-white); color:var(--q-ink); cursor:pointer; text-align:left;
  font:600 16px/1.25 var(--font-brand); transition:background-color .12s, border-color .12s, color .12s}
.chip:hover{border-color:var(--q-ink)}
.chip:active{transform:translateY(1px)}
.chip.on{background:var(--q-ink); border-color:var(--q-ink); color:var(--q-white)}
.chip.tall{min-height:48px}
.chip.sm{min-height:40px; padding:7px 12px; font-size:15px}

/* rows with a checkbox: the chosen row gets an ink edge and a sky flag */
.row{display:flex; gap:12px; align-items:flex-start; min-height:52px; padding:13px 16px 13px 22px; border:2px solid var(--q-edge); background:var(--q-white);
  cursor:pointer; user-select:none; font:400 16px/1.4 var(--font-brand); transition:border-color .12s}
.row:hover{border-color:var(--q-ink)}
.row.on{border-color:var(--q-ink); box-shadow:inset 6px 0 0 var(--q-sky); font-weight:600}
.row .sub{font-size:15px; color:var(--q-muted); font-weight:400}
.row .col{display:flex; flex-direction:column; gap:2px}
/* checkbox (square, green when on, the check drawn in ink) and radio (the one round shape) */
.cb{width:22px; height:22px; flex:none; display:inline-grid; place-items:center; border:2px solid var(--q-ink); background:var(--q-white); color:var(--q-ink)}
.cb svg{width:14px; height:14px}
.cb.on{background:var(--q-green); border-color:var(--q-green)}
.row:hover .cb,.lrow:hover .cb,.consent:hover .cb{box-shadow:0 0 0 4px var(--q-line)}
.rd{width:22px; height:22px; flex:none; display:inline-grid; place-items:center; border:2px solid var(--q-ink); border-radius:50%; background:var(--q-white)}
.rd.on i{display:block; width:10px; height:10px; border-radius:50%; background:var(--q-sky)}

/* buttons: square, Fira Sans Condensed SemiBold; ink is the primary; green fills under an ink label */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:52px; padding:10px 24px; border:2px solid var(--q-ink);
  background:var(--q-ink); color:var(--q-white); cursor:pointer; text-align:center; font:600 19px/1.15 var(--font-head); letter-spacing:.01em;
  transition:box-shadow .15s ease-out, background-color .12s, transform .05s}
.btn:hover{box-shadow:inset 0 0 0 999px rgba(0,0,0,.14)}
.btn:active{transform:translateY(1px); box-shadow:inset 0 0 0 999px rgba(0,0,0,.24)}
.btn.full{width:100%}
.btn.green{background:var(--q-green); border-color:var(--q-green); color:var(--q-ink)}
.btn.green:hover{box-shadow:inset 0 0 0 999px rgba(0,0,0,.08)}
.btn.outline{background:transparent; color:var(--q-ink)}
.btn.outline:hover{box-shadow:none; background:var(--q-line)}
.btn.md{min-height:44px; padding:8px 18px; font-size:17px; align-self:flex-start}
.btn:disabled{background:var(--q-disabled); border-color:var(--q-disabled); color:var(--q-disabled-ink); cursor:not-allowed; box-shadow:none; transform:none}
.textbtn{min-height:48px; padding:12px; border:0; background:transparent; color:var(--q-ink); cursor:pointer; font:600 16px/1.3 var(--font-brand);
  text-decoration:underline; text-decoration-color:var(--q-sky); text-decoration-thickness:2px; text-underline-offset:4px}
.textbtn:hover{text-decoration-color:currentColor; text-decoration-thickness:3px}
.textbtn.sm{min-height:40px; padding:0 6px; font-size:15px}
.backbtn{align-self:flex-start; display:inline-flex; align-items:center; gap:6px; min-height:44px; margin-left:-8px; padding:8px 12px 8px 8px;
  border:0; background:transparent; color:var(--q-ink); cursor:pointer; font:600 17px/1.15 var(--font-head); letter-spacing:.01em}
.backbtn:hover{background:var(--q-line)}
.iconbtn{flex:none; width:44px; height:44px; display:inline-grid; place-items:center; border:2px solid var(--q-ink); background:var(--q-white); color:var(--q-ink); cursor:pointer}
.iconbtn:hover{background:var(--q-line)}
.iconbtn.sm{width:40px; height:40px}

/* cards: white with a hairline, no shadow; the welcome card carries a sky bar on top */
.card{display:flex; flex-direction:column; gap:14px; padding:18px 20px; background:var(--q-white); border:1px solid var(--q-line)}
.card-h{display:flex; justify-content:space-between; align-items:center; gap:12px}
.card-t{font:600 17px/1.3 var(--font-head); letter-spacing:.01em; color:var(--q-ink)}
.card-t.q{font:600 17px/1.3 var(--font-brand); letter-spacing:0}
.card.ink{gap:12px; padding:26px 22px 20px; font-size:16px; box-shadow:inset 0 6px 0 var(--q-sky)}
.card.ink .n{flex:none; min-width:22px; font:700 20px/1.2 var(--font-head)}
.card.ink .li{display:flex; gap:12px}
.card.plain{padding:0; gap:0; overflow:hidden}
/* notes: white with a colour bar; the words stay ink */
.note{padding:14px 18px 15px 24px; background:var(--q-white); border:1px solid var(--q-line); box-shadow:inset 6px 0 0 var(--q-sky);
  color:var(--q-ink); font:600 15px/1.45 var(--font-brand)}
.note.green{box-shadow:inset 6px 0 0 var(--q-green)}
.note.red{box-shadow:inset 6px 0 0 var(--danger)}
.note.orange{box-shadow:inset 6px 0 0 var(--q-orange)}
.divider{border-top:1px solid var(--q-line); padding-top:18px}
.consent{display:flex; gap:16px; align-items:flex-start; padding:18px 20px 18px 24px; cursor:pointer; user-select:none; transition:background-color .12s}
.consent+.consent{border-top:1px solid var(--q-line)}
.consent:hover{background:var(--q-line)}
.consent.on{box-shadow:inset 6px 0 0 var(--q-green)}
.consent .t{font:600 16px/1.35 var(--font-brand); color:var(--q-ink)}
.consent .s{font-size:15px; line-height:1.5; color:var(--q-muted)}
.consent .txt{display:flex; flex-direction:column; gap:4px; flex:1; min-width:0}
.footnav{display:flex; flex-direction:column; gap:10px; margin-top:10px; padding-top:22px; border-top:1px solid var(--q-line)}
.missing{display:flex; flex-direction:column; gap:10px; padding:14px 18px 16px 24px; background:var(--q-white); border:1px solid var(--q-line); box-shadow:inset 6px 0 0 var(--danger)}
.missing .pill{position:relative; min-height:40px; padding:6px 14px 6px 20px; border:2px solid var(--q-ink); background:var(--q-white); color:var(--q-ink); cursor:pointer;
  font:600 15px/1.15 var(--font-head); letter-spacing:.01em}
.missing .pill::before{content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--danger)}
.missing .pill:hover{background:var(--q-line)}
.stamp{font-size:15px; color:var(--q-muted); text-align:center; margin-top:4px; min-height:1em}
.linkbox{display:flex; gap:8px; align-items:center; margin-top:10px}
.linkbox input{font-size:15px}

/* calendar: square days; the chosen one fills ink */
.cal{max-width:360px; padding:16px; display:flex; flex-direction:column; gap:12px; background:var(--q-white); border:2px solid var(--q-ink)}
.cal-h{display:flex; align-items:center; justify-content:space-between; gap:8px; font:700 19px/1.2 var(--font-head)}
.cal-g{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center}
.cal-g .dow{padding:6px 0; font:600 14px/1.2 var(--font-head); letter-spacing:.01em; color:var(--q-muted)}
.cal-g button{min-height:44px; border:0; background:transparent; color:var(--q-ink); cursor:pointer; font:600 16px/1 var(--font-head); font-variant-numeric:tabular-nums; transition:background-color .12s}
.cal-g button:hover:not(:disabled){background:var(--q-line)}
.cal-g button.past,.cal-g button:disabled{color:var(--q-edge); cursor:default}
.cal-g button.today{box-shadow:inset 0 0 0 2px var(--q-ink)}
.cal-g button.on,.cal-g button.on:hover{background:var(--q-ink); color:var(--q-white)}
.cal-f{display:flex; justify-content:space-between; align-items:center; gap:12px; padding-top:12px; border-top:1px solid var(--q-line); font:600 15px/1.3 var(--font-brand)}

/* events */
.yearpills{display:grid; grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:8px}
.ypill{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:44px; padding:0 10px; border:2px solid var(--q-edge); background:var(--q-white);
  color:var(--q-ink); cursor:pointer; font:600 16px/1 var(--font-head); letter-spacing:.01em; font-variant-numeric:tabular-nums; transition:background-color .12s, border-color .12s}
.ypill:hover{border-color:var(--q-ink)}
.ypill.on{background:var(--q-ink); border-color:var(--q-ink); color:var(--q-white)}
.ypill .badge{display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px; padding:0 5px; background:var(--q-white); color:var(--q-ink); font:700 13px/1 var(--font-head)}
.picked{display:flex; flex-direction:column; gap:10px; padding:14px 16px; background:var(--q-white); border:1px solid var(--q-line)}
.pchip{display:inline-flex; align-items:center; gap:8px; min-height:36px; max-width:100%; padding:5px 8px 5px 12px; border:2px solid var(--q-ink); background:var(--q-white);
  color:var(--q-ink); cursor:pointer; text-align:left; font:600 14px/1.3 var(--font-brand)}
.pchip:hover{background:var(--q-line)}
.pchip .mk{width:12px; height:12px}
.pchip .y{flex:none; color:var(--q-muted); font:700 14px/1.3 var(--font-head)}
.timeline{display:flex; flex-direction:column; gap:28px}
.yr{display:flex; flex-direction:column; gap:6px}
.yr-h{position:sticky; top:108px; z-index:5; display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:4px; padding:12px 12px 10px;
  background:var(--q-white); border-bottom:2px solid var(--q-ink)}
.wrap.rail .yr-h{top:69px}
.yr-h b{font:700 32px/1 var(--font-head); letter-spacing:var(--tracking-display)}
.yr-h .cnt{font:600 15px/1.2 var(--font-head); letter-spacing:.01em}
.mo-h{padding:14px 12px 6px; font:600 13.5px/1.2 var(--font-head); letter-spacing:.1em; text-transform:uppercase; color:var(--q-ink)}
.grp{display:flex; flex-direction:column; gap:2px}
.lrow{display:flex; gap:14px; align-items:flex-start; min-height:52px; padding:14px 12px 14px 16px; cursor:pointer; user-select:none; background:transparent;
  font:500 16px/1.4 var(--font-brand); transition:background-color .12s}
.lrow:hover{background:var(--q-line)}
.lrow.on{font-weight:600; box-shadow:inset 5px 0 0 var(--q-sky)}
.lrow .det{font-size:15px; color:var(--q-muted); font-weight:400}
.lrow .col{display:flex; flex-direction:column; gap:3px}
.counts{margin:4px 0 8px 52px; display:flex; flex-direction:column; gap:8px}
.counts .q{font:600 15px/1.3 var(--font-brand)}

/* the section rail on wide screens */
nav.railnav{width:248px; flex:none; position:sticky; top:88px; display:none; flex-direction:column; padding-top:6px}
.wrap.rail nav.railnav{display:flex}
.rail-p{display:flex; flex-direction:column; gap:8px; padding:0 4px 18px}
.rail-p .top{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.rail-p .cap{font:600 13px/1.2 var(--font-head); letter-spacing:.1em; text-transform:uppercase}
.rail-p .num{font:600 15px/1.2 var(--font-head); letter-spacing:.01em; font-variant-numeric:tabular-nums}
.rail-p .bar{height:6px}
.rsec{display:flex; gap:14px; align-items:stretch; padding:0 4px}
.rsec.go{cursor:pointer}
.rsec.go:hover .rname b{text-decoration:underline; text-decoration-color:var(--q-sky); text-decoration-thickness:2px; text-underline-offset:3px}
.rsec .dotcol{display:flex; flex-direction:column; align-items:center; flex:none; align-self:stretch}
.rdot{width:28px; height:28px; flex:none; display:inline-grid; place-items:center; border:2px solid var(--q-edge); background:var(--q-white); color:var(--q-muted);
  font:700 15px/1 var(--font-head)}
.rdot .mk{width:14px; height:14px}
.rdot.done{background:var(--q-green); border-color:var(--q-green); color:var(--q-ink)}
.rdot.cur{background:var(--q-ink); border-color:var(--q-ink); color:var(--q-white)}
.rline{flex:1; width:2px; margin:6px 0; min-height:14px; background:var(--q-line)}
.rline.done{background:var(--q-green)}
.rbody{display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; padding-bottom:18px}
.rname{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.rname b{min-width:0; font:700 17px/28px var(--font-head); letter-spacing:.01em}
.rname span{flex:none; font-size:14px; color:var(--q-muted)}
.ritems{display:flex; flex-direction:column; margin-top:8px; padding:0 0 4px}
.ritem{display:flex; align-items:center; gap:10px; min-height:32px; padding:5px 8px; margin-left:-8px; cursor:pointer; color:var(--q-ink); font:500 15px/1.35 var(--font-brand)}
.ritem:hover{background:var(--q-line)}

<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фото с события — QARAVAN</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://photoslibrary.googleapis.com" crossorigin>
<link rel="preload" href="/assets/fonts/FiraSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/FiraSansCondensed-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/qaravan.css">
<link rel="stylesheet" href="/assets/forms.css">
<style>
.hero{margin-bottom:30px}
input[type="text"]{margin-top:10px}
.ph-add{min-height:64px; font-size:19px}
.submit{margin-top:34px}
/* after sending: an invitation to the feedback form, white with a sky bar and an ink button with a sky flag */
.fb-card{margin-top:22px; padding:22px 22px 24px 30px; background:var(--q-white); border:1px solid var(--q-line); box-shadow:inset 6px 0 0 var(--q-sky)}
.fb-card p{margin:0 0 14px; font-size:16px; text-wrap:pretty}
.fb-card a{position:relative; display:inline-flex; align-items:center; min-height:52px; padding:10px 24px 10px 34px;
  border:2px solid var(--q-ink); background:var(--q-ink); color:var(--q-white); text-decoration:none;
  font:600 19px/1.15 var(--font-head); letter-spacing:.01em; transition:box-shadow .15s ease-out}
.fb-card a::before{content:""; position:absolute; left:-2px; top:-2px; bottom:-2px; width:10px; background:var(--q-sky)}
.fb-card a:hover{box-shadow:inset 0 0 0 999px rgba(0,0,0,.14)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="wordmark" href="https://qaravan.org" aria-label="qaravan.org"><img src="/assets/logo-wordmark.svg" width="140" height="28" alt="qaravan"></a>
    <div class="lang" role="group" aria-label="Language" data-i18n-aria="language_label">
      <button type="button" id="btnRu" aria-pressed="true">RU</button>
      <button type="button" id="btnEn" aria-pressed="false">EN</button>
    </div>
  </div>

  <div id="formView">
    <header class="hero" id="hero">
      <div class="eyebrow" id="evDate"></div>
      <h1 id="evName" data-i18n="loading">…</h1>
      <p class="sub" data-i18n="intro"></p>
    </header>

    <form id="f" novalidate="">
      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

      <p class="hint" data-i18n="photos_optimizing_note"></p>
      <label class="ph-quality"><input type="checkbox" id="phOriginal"><span data-i18n="photos_original"></span></label>
      <input type="file" id="phInput" accept="image/*,video/*" multiple style="display:none">
      <button type="button" class="ph-add" id="phAdd"></button>
      <p class="hint" data-i18n="photos_hint"></p>
      <div class="ph-grid" id="phGrid"></div>
      <p class="hint" id="phStatus" role="status" style="display:none; margin-top:12px"></p>
      <p class="err" id="phErr" role="alert" style="margin-top:14px"></p>

      <div id="phConsentWrap" style="display:none">
        <p class="hint" data-i18n="photos_credit" style="margin-top:22px"></p>
        <input type="text" id="phCredit" maxlength="120">
        <p class="hint" data-i18n="photos_agree" style="margin-top:14px"></p>
      </div>

      <div class="submit">
        <p class="err" id="err" role="alert"></p>
        <button type="submit" id="send" data-i18n="send"></button>
        <footer>qaravan.org</footer>
      </div>
    </form>
  </div>

  <div id="thanks">
    <h1 data-i18n="thanks_t"></h1>
    <p id="photoWarning" class="err" role="alert"></p>
    <p class="sub" data-i18n="thanks_p"></p>
    <div class="fb-card" id="fbCard" style="display:none">
      <p data-i18n="fb_p"></p>
      <a href="#" id="fbLink" data-i18n="fb_btn"></a>
    </div>
  </div>
</div>

<script src="/assets/photo-previews.js"></script>
<script>
// ===== все тексты страницы — редактируются здесь =====
const STRINGS = {
ru: {
  photos_partial_title: "Часть файлов не удалось сохранить",
  photos_partial: (n) => `Отправка завершена, но не удалось добавить в альбом файлов: ${n}. Сохрани оригиналы и сообщи об этом организаторам события.`,
  language_label: "Язык формы",
  sending: "Отправляем…",
  loading: "Фото с события QARAVAN",
  intro: "Добавь фото и видео с события. Когда файлы загрузятся, нажми «Добавить в альбом», чтобы отправить их.",
  photos_hint: "До 50 файлов, каждый до 300 МБ. Загрузка начнётся после выбора. Оставь страницу открытой и дождись загрузки перед отправкой.",
  photos_add: "Выбрать фото и видео",
  photos_agree: "Загружая файлы, ты соглашаешься, что QARAVAN может использовать их в своих материалах и соцсетях.",
  photos_credit: "Как тебя подписать как автора? Можно оставить пустым.",
  photos_optimizing_note: "По возможности уменьшаем размер JPEG-файлов, сохраняя исходное разрешение и высокое качество. Выбери оригиналы до добавления фото, чтобы сохранить файлы и данные камеры без изменений. Видео не меняем.",
  photos_original: "Загрузить оригиналы без изменений",
  photos_fix_failed: "Не все файлы загрузились. Нажми «Повторить загрузку» на файлах с ошибкой или убери их из списка перед отправкой.",
  photos_failed_status: (done, total, failed) => `Загружено файлов: ${done} из ${total}. Не загрузилось: ${failed}. Повтори загрузку файлов с ошибкой или убери их из списка.`,
  photos_remove: "Убрать файл из списка",
  photos_retry: "Повторить загрузку",
  photos_err_size: "Этот файл больше 300 МБ. Выбери файл меньшего размера или сократи видео, затем добавь его снова.",
  photos_err_count: "Можно добавить до 50 файлов на одно событие. Чтобы выбрать другие, сначала убери ненужные файлы из списка.",
  photos_wait: "Файлы ещё загружаются. Оставь эту страницу открытой. Когда загрузка завершится, нажми «Добавить в альбом».",
  photos_none: "Нажми «Выбрать фото и видео» и добавь хотя бы один файл.",
  photos_bg: (a, b) => `Загружено файлов: ${a} из ${b}. Оставь эту страницу открытой.`,
  photos_done: "Все файлы загружены. Чтобы завершить отправку, нажми «Добавить в альбом».",
  send: "Добавить в альбом",
  err_net: "Не удалось завершить отправку. Оставь эту страницу открытой, проверь интернет и снова нажми «Добавить в альбом».",
  thanks_t: "Фото и видео отправлены. Спасибо!",
  thanks_p: "Спасибо, что делишься фотографиями и видео с сообществом.",
  fb_p: "Есть пара минут? Расскажи, как тебе само событие — это читают те, кто его готовил.",
  fb_btn: "Оставить отзыв",
  generic_event: "Событие QARAVAN"
},
en: {
  photos_partial_title: "Some files could not be saved",
  photos_partial: (n) => `Sending finished, but ${n} file(s) could not be added to the album. Keep the originals and let the event organizers know.`,
  language_label: "Form language",
  sending: "Sending…",
  loading: "Event photos",
  intro: "Choose your photos and videos from the event. When the files finish uploading, select “Add to album” to send them.",
  photos_hint: "Up to 50 files, up to 300 MB each. Uploads start after selection. Keep this page open and wait for uploads to finish before sending.",
  photos_add: "Choose photos and videos",
  photos_agree: "By uploading, you agree that QARAVAN may use these files in its materials and social media.",
  photos_credit: "How should we credit you? You can leave this empty.",
  photos_optimizing_note: "We reduce JPEG file size where possible, keeping full resolution and high quality. Choose originals before adding photos to preserve the files and camera metadata unchanged. Videos are unchanged.",
  photos_original: "Upload original files without changes",
  photos_fix_failed: "Some files did not upload. Select “Retry upload” on each failed file, or remove those files from the list before sending.",
  photos_failed_status: (done, total, failed) => `Files uploaded: ${done} of ${total}. Failed: ${failed}. Retry the failed uploads or remove those files from the list.`,
  photos_remove: "Remove file from list",
  photos_retry: "Retry upload",
  photos_err_size: "This file is over 300 MB. Choose a smaller file or shorten the video, then add it again.",
  photos_err_count: "You can add up to 50 files per event. To choose different files, first remove files you no longer want from the list.",
  photos_wait: "Files are still uploading. Keep this page open. When the upload finishes, select “Add to album”.",
  photos_none: "Select “Choose photos and videos” and add at least one file.",
  photos_bg: (a, b) => `Files uploaded: ${a} of ${b}. Keep this page open.`,
  photos_done: "All files uploaded. Select “Add to album” to finish sending them.",
  send: "Add to album",
  err_net: "We could not finish sending. Keep this page open, check your connection, and select “Add to album” again.",
  thanks_t: "Photos and videos sent. Thank you!",
  thanks_p: "Thank you for sharing your photos and videos with the community.",
  fb_p: "Got a couple of minutes? Tell us how the event went — the people who made it will read it.",
  fb_btn: "Leave feedback",
  generic_event: "QARAVAN event"
}};

// ===== состояние =====
const params = new URLSearchParams(location.search);
const eventId = ((window.__EVENT_ID__ || "") || params.get("event") || "").replace(/\D/g, "");
let lang = params.get("lang") === "en" ? "en" : "ru";
let eventName = "", eventDate = "", eventDateEn = "";

const $ = id => document.getElementById(id);
const T = () => STRINGS[lang];
const cleanDate = s => (s || "").replace(/\s*[·•]\s*/g, ", ");

function render(){
  document.documentElement.lang = lang;
  if (phSaveFailed) $("photoWarning").textContent = T().photos_partial(phSaveFailed);
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", T()[el.dataset.i18nAria]));
  $("btnRu").setAttribute("aria-pressed", lang === "ru");
  $("btnEn").setAttribute("aria-pressed", lang === "en");
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.dataset.i18n;
    if (k === "loading") { el.textContent = eventName || T().loading; return; }
    if (k === "thanks_t" && phSaveFailed) { el.textContent = T().photos_partial_title; return; }
    el.textContent = k === "send" && el.disabled ? T().sending : T()[k];
  });
  $("evDate").textContent = cleanDate(lang === "en" ? (eventDateEn || eventDate) : eventDate);
  $("phAdd").textContent = T().photos_add;
  $("fbLink").href = eventId ? `/${eventId}` : "https://qaravan.org";
  phSync();
}

$("btnRu").onclick = () => { lang = "ru"; render(); };
$("btnEn").onclick = () => { lang = "en"; render(); };

// ===== имя ивента из monday =====
async function loadEvent(){
  if (!eventId) { eventName = ""; $("hero").classList.add("on"); render(); return; }
  try{
    const r = await fetch(`/api/event?id=${eventId}`);
    if (r.ok){
      const d = await r.json();
      eventName = d.name || "";
      eventDate = d.date || "";
      eventDateEn = d.dateEn || "";
    }
  }catch(e){}
  $("hero").classList.add("on");
  render();
}

// ===== фото и видео: сразу напрямую в Google Photos =====
let phSaveFailed = 0;
const PH_MAX_SIZE = 300 * 1024 * 1024, PH_MAX_COUNT = 50, PH_PARALLEL = 4;
const photos = []; // {file, el, status: "wait"|"up"|"done"|"fail"|"removed", token}
let phAccess = null, phAccessExp = 0, phAccessReq = null, phActive = 0;

async function phGetAccess(){
  if (phAccess && Date.now() < phAccessExp - 60000) return phAccess;
  phAccessReq = phAccessReq || fetch("/api/photos-token", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ eventId }) })
    .then(async r => {
      if (!r.ok) throw new Error("token");
      const d = await r.json();
      phAccess = d.token; phAccessExp = Date.now() + (d.expiresIn || 3600) * 1000;
      return phAccess;
    })
    .finally(() => { phAccessReq = null; });
  return phAccessReq;
}

function phPump(){
  if (phActive >= PH_PARALLEL) return;
  const next = photos.find(p => p.status === "wait");
  if (!next) return;
  phActive++;
  phSend(next).finally(() => { phActive--; phSync(); phPump(); });
  phPump();
}

async function phSend(p){
  p.status = "up";
  const retry = p.el.querySelector(".ph-retry");
  if (retry) retry.remove();
  try {
    const [tok, prepared] = await Promise.all([phGetAccess(), p.prepared || Promise.resolve(p.file)]);
    if (p.status === "removed" || !prepared) return;
    p.file = prepared;
    const text = await new Promise((ok, no) => {
      const x = new XMLHttpRequest();
      p.xhr = x;
      x.open("POST", "https://photoslibrary.googleapis.com/v1/uploads");
      x.setRequestHeader("Authorization", "Bearer " + tok);
      x.setRequestHeader("Content-Type", "application/octet-stream");
      x.setRequestHeader("X-Goog-Upload-Content-Type", p.file.type || "application/octet-stream");
      x.setRequestHeader("X-Goog-Upload-Protocol", "raw");
      x.upload.onprogress = e => { if (p.status !== "removed" && e.lengthComputable) p.el.querySelector(".ph-bar i").style.width = (e.loaded / e.total * 100) + "%"; };
      x.onload = () => (x.status === 200 && x.responseText) ? ok(x.responseText) : no(new Error("http " + x.status));
      x.onerror = () => no(new Error("net"));
      x.onabort = () => no(new Error("aborted"));
      x.timeout = 15 * 60 * 1000;
      x.ontimeout = () => no(new Error("timeout"));
      x.send(p.file);
    });
    if (p.status === "removed") return;
    p.token = text.trim(); p.status = "done"; p.el.classList.add("done");
  } catch (e) {
    if (p.status === "removed") return;
    p.status = "fail"; p.el.classList.add("fail");
    const b = document.createElement("button");
    b.type = "button"; b.className = "ph-retry"; b.textContent = T().photos_retry;
    b.onclick = () => { p.el.classList.remove("fail"); p.status = "wait"; phPump(); phSync(); };
    b.setAttribute("aria-label", T().photos_retry + ": " + (p.file?.name || ""));
    p.el.appendChild(b);
  } finally {
    p.xhr = null;
  }
}

function phAddFiles(files){
  const err = $("phErr"); err.classList.remove("show");
  for (const f of files) {
    if (photos.filter(p => p.status !== "removed").length >= PH_MAX_COUNT) { err.textContent = T().photos_err_count; err.classList.add("show"); break; }
    if (f.size > PH_MAX_SIZE) { err.textContent = T().photos_err_size; err.classList.add("show"); continue; }
    const el = document.createElement("div");
    el.className = "ph-item";
    // File cards paint immediately; preview decoding never runs on the UI thread.
    const isVideo = (f.type || "").startsWith("video/");
    el.innerHTML = `<div class="ph-placeholder"><span class="ph-mark${isVideo ? " video" : ""}" aria-hidden="true"></span><span class="ph-name"></span></div>`
      + (isVideo ? "" : `<img alt="" hidden decoding="async">`)
      + `<div class="ph-bar"><i></i></div>`;
    el.querySelector(".ph-name").textContent = f.name || (isVideo ? "Video" : "Photo");
    el.title = f.name || "";
    const clearPreview = !isVideo && window.QPhotoPreview
      ? window.QPhotoPreview.enqueue(el.querySelector("img"), f, { optimize: !$("phOriginal").checked }) : () => {};
    const x = document.createElement("button");
    x.type = "button"; x.className = "ph-x"; x.textContent = "×"; x.setAttribute("aria-label", T().photos_remove + ": " + (f.name || ""));
    const rec = { file: f, el, status: "wait", token: "" };
    rec.prepared = clearPreview.ready || Promise.resolve(f);
    x.onclick = () => {
      rec.status = "removed";
      if (rec.xhr) rec.xhr.abort();
      clearPreview();
      rec.file = null; rec.token = ""; rec.prepared = null;
      el.remove();
      phSync();
    };
    el.appendChild(x);
    $("phGrid").appendChild(el);
    photos.push(rec);
  }
  phSync();
  phPump();
}

function phSync(){
  const live = photos.filter(p => p.status !== "removed");
  $("phConsentWrap").style.display = live.length ? "" : "none";
  const st = $("phStatus");
  if (!live.length) { st.style.display = "none"; return; }
  for (const p of live) {
    const retry = p.el.querySelector(".ph-retry");
    if (retry) { retry.textContent = T().photos_retry; retry.setAttribute("aria-label", T().photos_retry + ": " + (p.file?.name || "")); }
    p.el.querySelector(".ph-x").setAttribute("aria-label", T().photos_remove + ": " + (p.file?.name || ""));
  }
  const failed = live.filter(p => p.status === "fail").length;
  const done = live.filter(p => p.status === "done").length;
  st.style.display = "";
  st.textContent = failed ? T().photos_failed_status(done, live.length, failed) : done === live.length ? T().photos_done : T().photos_bg(done, live.length);
}

// ===== отправка =====
// Если Google Photos не принял файл, сервер вернёт его в списке rescue —
// дошлём сами байты нам же, чтобы ничего не пропало.
async function rescueFiles(list, eventIdFallback = ""){
  if (!Array.isArray(list) || !list.length) return;
  const records = photos;
  for (const item of list) {
    const record = records.find(p => p.status !== "removed" && p.file?.name === item.name
      && (!p.eventId || String(p.eventId) === String(item.eventId)));
    if (!record?.file || record.file.size > 4 * 1024 * 1024) continue;
    try {
      const response = await fetch(`/api/rescue-file?event=${encodeURIComponent(item.eventId || eventIdFallback)}&name=${encodeURIComponent(item.name)}`,
        { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: record.file });
      if (!response.ok) continue;
    } catch (_) { /* The warning below still tells the user to keep their originals. */ }
  }
  const warning = $("photoWarning");
  phSaveFailed = list.length;
  warning.textContent = T().photos_partial(phSaveFailed);
  warning.classList.add("show");
  document.querySelector('#thanks [data-i18n="thanks_t"]').textContent = T().photos_partial_title;
}

$("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const err = $("err");
  const ready = photos.filter(p => p.status === "done");
  if (photos.some(p => p.status === "fail")){
    err.textContent = T().photos_fix_failed; err.classList.add("show");
    return;
  }
  if (photos.some(p => p.status === "up" || p.status === "wait")){
    err.textContent = T().photos_wait; err.classList.add("show");
    return;
  }
  if (!ready.length){
    err.textContent = T().photos_none; err.classList.add("show");
    return;
  }
  err.classList.remove("show");
  $("send").disabled = true;
  $("send").textContent = T().sending;
  const body = {
    eventId, lang,
    photos_only: true,
    photos: ready.map(p => ({ token: p.token, mime: p.file.type || "", name: p.file.name || "" })),
    photo_credit: $("phCredit").value.trim(),
    website: document.querySelector(".hp").value
  };
  try{
    const r = await fetch("/api/submit", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error();
    const data = await r.json();
    await rescueFiles(data.rescue);
    $("formView").style.display = "none";
    $("fbCard").style.display = eventId ? "" : "none";
    $("thanks").classList.add("show");
    window.scrollTo({top:0});
  }catch(e){
    err.textContent = T().err_net; err.classList.add("show");
    $("send").disabled = false;
    $("send").textContent = T().send;
  }
});

// токен берём заранее, пока человек выбирает файлы — загрузка стартует сразу
$("phAdd").onclick = () => { phGetAccess().catch(() => {}); $("phInput").click(); };
$("phInput").onchange = e => { phAddFiles([...e.target.files]); e.target.value = ""; };

render();
loadEvent();
</script>
</body></html>

<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отзыв — QARAVAN</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFDF5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --q-red:#FF3333; --q-orange:#FF9933; --q-sky:#0099CC; --q-purple:#7668AA; --q-green:#66CC66; --q-gold:#EBC53F;
  --q-ink:#333333; --q-gray:#6E6E6E; --q-line:#ECE8DE; --q-paper:#FFFDF5; --q-white:#FFFFFF;
  --q-red-tint:#FFE4E4; --q-orange-tint:#FFEDD9; --q-sky-tint:#DDF1F8; --q-orange-deep:#C4691A;
  --font-brand:'Montserrat','Helvetica Neue',Arial,sans-serif;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-pill:999px;
  --shadow-card:0 2px 6px rgba(51,51,51,.05), 0 10px 28px rgba(51,51,51,.07);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--q-paper); color:var(--q-ink); font-family:var(--font-brand); font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased}
a{color:var(--q-sky); font-weight:700; text-decoration-thickness:2px}
a:hover{color:var(--q-purple)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--q-sky); outline-offset:2px}
::placeholder{color:#9C968A; opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
.wrap{max-width:560px; margin:0 auto; padding:20px 20px 64px}
.top{display:flex; justify-content:space-between; align-items:center; gap:16px; padding:4px 0 32px}
.wordmark{font-weight:900; font-size:26px; letter-spacing:-.03em; line-height:1; white-space:nowrap}
.lang{display:flex; border:1px solid var(--q-line); border-radius:var(--radius-pill); overflow:hidden; background:var(--q-white); box-shadow:var(--shadow-card)}
.lang button{border:0; background:transparent; padding:8px 15px; font:inherit; font-size:13px; font-weight:700; color:var(--q-ink); cursor:pointer; line-height:1.2; transition:background .15s ease,color .15s ease}
.lang button[aria-pressed="true"]{background:var(--q-ink); color:var(--q-white)}
h1{font-weight:800; font-size:clamp(28px,7.5vw,40px); line-height:1.1; letter-spacing:-.02em; margin:10px 0 8px; text-wrap:balance}
.sub{color:var(--q-gray); margin:0; text-wrap:pretty}

/* прогресс: сколько событий уже позади */
.prog{margin-top:16px; display:flex; align-items:center; gap:12px}
.prog .track{flex:1; height:6px; border-radius:var(--radius-pill); background:var(--q-line); overflow:hidden}
.prog .track i{display:block; height:100%; width:0; background:var(--q-sky); border-radius:var(--radius-pill); transition:width .3s ease}
.prog .lbl{font-size:13px; font-weight:700; color:var(--q-gray); white-space:nowrap}

#events{display:grid; margin-top:26px}
.ev{scroll-margin-top:20px}
.ev+.ev{border-top:1px solid var(--q-line); padding-top:30px; margin-top:32px}
.ev.enter{animation:evIn .32s ease-out both}
@keyframes evIn{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
/* шапка события — по центру, дата плашкой как в брендбуке */
.ev-head{text-align:center}
.ev .date{font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--q-gray); line-height:1.2}
.ev h2{font-size:22px; font-weight:800; line-height:1.2; letter-spacing:-.02em; margin:12px 0 0; text-wrap:balance}

/* звёзды: компактные, с живой подсветкой при наведении */
.stars{display:flex; gap:6px; margin-top:16px; justify-content:center}
.stars button{width:46px; height:46px; border-radius:var(--radius-md); border:2px solid var(--q-line); background:var(--q-white); color:#DAD5C8; cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center; transition:transform .12s cubic-bezier(.2,.8,.3,1.4),border-color .12s ease,background .12s ease,color .12s ease}
.stars button:hover{transform:translateY(-2px)}
.stars button:active{transform:scale(.92)}
.stars button.on{color:var(--q-orange); border-color:var(--q-orange); background:var(--q-orange-tint)}
.stars button.hot{color:var(--q-orange); border-color:var(--q-orange); background:var(--q-orange-tint); transform:translateY(-2px)}
.stars svg{width:24px; height:24px; display:block; fill:currentColor}
.stars-word{text-align:center; margin-top:8px; font-size:15px; font-weight:800; color:var(--q-orange-deep); min-height:22px; letter-spacing:-.01em}
@media (max-width:380px){.stars button{width:42px; height:42px} .stars svg{width:21px; height:21px}}
.need{margin-top:10px; font-size:14px; font-weight:700; color:var(--q-red); text-align:center}

/* варианты ответов */
.qa{margin-top:16px; text-align:center}
.qa-q{font-size:16px; font-weight:700; line-height:1.35; text-wrap:pretty}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; justify-content:center}
.chips button{border:2px solid var(--q-line); background:var(--q-white); color:var(--q-ink); border-radius:var(--radius-pill); padding:9px 16px; font:inherit; font-size:15px; font-weight:700; cursor:pointer; transition:transform .12s ease,background .15s ease,border-color .15s ease,color .15s ease}
.chips button:active{transform:scale(.97)}
.chips button[aria-pressed="true"]{color:var(--q-white); background:var(--q-sky); border-color:var(--q-sky)}
.chips button:nth-child(6n+1)[aria-pressed="true"]{background:var(--q-red); border-color:var(--q-red)}
.chips button:nth-child(6n+2)[aria-pressed="true"]{background:var(--q-orange); border-color:var(--q-orange)}
.chips button:nth-child(6n+3)[aria-pressed="true"]{background:var(--q-green); border-color:var(--q-green)}
.chips button:nth-child(6n+4)[aria-pressed="true"]{background:var(--q-purple); border-color:var(--q-purple)}
.chips button:nth-child(6n+5)[aria-pressed="true"]{background:var(--q-sky); border-color:var(--q-sky)}
.chips button:nth-child(6n)[aria-pressed="true"]{background:var(--q-ink); border-color:var(--q-ink)}
.linkbtn{border:0; background:none; padding:0; font:inherit; font-size:15px; font-weight:700; color:var(--q-sky); text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:2px; cursor:pointer; transition:color .15s ease}
.linkbtn:hover{color:var(--q-purple)}
.linkbtn.dim{color:var(--q-gray)}
.ta-toggle{margin-top:14px; text-align:center}
.f-lab{display:block; font-size:13px; font-weight:700; color:var(--q-gray); margin-bottom:6px; text-align:left}
.absent{margin-top:14px; font-size:15px; color:var(--q-gray); display:flex; gap:10px; flex-wrap:wrap; align-items:baseline; justify-content:center}
.na-wrap{margin-top:12px; text-align:center}
.cq{margin-top:18px}
.cq-q{display:block; font-size:16px; font-weight:700; line-height:1.35; text-wrap:pretty}
.cq textarea{min-height:80px}
.next{margin-top:12px; text-align:center}
.next button{border:2px solid var(--q-ink); background:var(--q-ink); color:var(--q-white); border-radius:var(--radius-pill); padding:14px 44px; font:inherit; font-size:16px; font-weight:700; cursor:pointer; transition:transform .15s ease,opacity .15s ease}
.next button:hover{opacity:.92}
.next button:active{transform:scale(.98)}

/* уже отвеченное сворачивается в строку — страница не растёт */
.done-row{display:flex; align-items:center; gap:12px; padding:14px 0}
.done-row .txt{flex:1; min-width:0}
.done-row .nm{font-size:16px; font-weight:700; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.done-row .mini{font-size:13px; color:var(--q-gray); margin-top:2px}
.done-row .mini b{color:var(--q-orange); font-weight:700; letter-spacing:1px}

textarea,input[type="text"],input[type="email"],input[type="tel"]{width:100%; border:2px solid var(--q-line); border-radius:var(--radius-md); background:var(--q-white); padding:13px 15px; font:inherit; font-size:16px; color:var(--q-ink)}
textarea{min-height:96px; resize:vertical; line-height:1.5; margin-top:14px}
textarea:focus,input:focus{outline:none; border-color:var(--q-sky); box-shadow:0 0 0 3px var(--q-sky-tint)}
input.ok{border-color:var(--q-green) !important}
input.bad{border-color:var(--q-red) !important}
.field-hint{display:none; color:var(--q-red); font-size:14px; font-weight:700; margin:8px 0 0}
.field-hint.show{display:block}

/* фото и видео к конкретному событию — компактно: кнопка и строка */
.ph{margin-top:16px; text-align:left}
/* Многострочный текст по центру не выравнивают — рваные края мешают читать.
   Центр — только коротким симметричным элементам (звёзды, кнопки, подпись
   оценки). Просьба — обычным левым текстом НАД кнопкой: сначала зачем,
   потом действие. */
.ph-ask{font-size:14px; line-height:1.5; color:var(--q-ink); margin:0 0 10px; text-align:left; text-wrap:pretty}
.ph-add{border:2px dashed var(--q-sky); background:var(--q-white); border-radius:var(--radius-md); width:100%; padding:13px; font:inherit; font-size:16px; font-weight:700; color:var(--q-sky); cursor:pointer; transition:transform .15s ease}
.ph-add:active{transform:scale(.99)}
.ph-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px}
.ph-item{position:relative; border-radius:var(--radius-md); overflow:hidden; background:var(--q-line); aspect-ratio:1}
.ph-item img,.ph-item video{width:100%; height:100%; object-fit:cover; display:block}
.ph-bar{position:absolute; left:0; right:0; bottom:0; height:5px; background:rgba(255,255,255,.55)}
.ph-bar i{display:block; height:100%; width:0; background:var(--q-sky); transition:width .2s}
.ph-item.done .ph-bar,.ph-item.fail .ph-bar{display:none}
.ph-retry{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border:0; cursor:pointer; font:inherit; font-size:13px; font-weight:700; color:var(--q-white); background:rgba(255,51,51,.72)}
.ph-x{position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:50%; border:0; background:rgba(0,0,0,.55); color:#fff; font-weight:900; font-size:14px; cursor:pointer; line-height:1; display:flex; align-items:center; justify-content:center}
.ph-badge{position:absolute; left:6px; top:6px; background:rgba(0,0,0,.55); color:#fff; font-size:11px; font-weight:700; padding:2px 7px; border-radius:99px}
.ph-note{font-size:13px; color:var(--q-gray); margin:12px 0 0; text-wrap:pretty}
.ph-err{display:none; color:var(--q-red); font-size:14px; font-weight:700; margin:10px 0 0}
.ph-err.show{display:block}

#tail{display:none}
#tail.show{display:block}
fieldset{border:0; padding:0; margin:40px 0 0; border-top:1px solid var(--q-line); padding-top:32px}
legend{float:left; width:100%; padding:0; margin:0 0 16px; font-weight:700; font-size:19px; line-height:1.35; text-wrap:pretty}
legend+*{clear:both}
.hint{color:var(--q-gray); font-size:14px; font-weight:400; margin:0 0 10px; text-wrap:pretty}
.opts{display:grid; gap:10px}
.opts label{display:flex; gap:12px; align-items:flex-start; border:2px solid var(--q-line); background:var(--q-white); border-radius:var(--radius-md); padding:14px 16px; cursor:pointer; font-size:16px; box-shadow:var(--shadow-card); transition:border-color .15s ease,background .15s ease}
.opts input{margin:4px 0 0; accent-color:var(--q-sky); width:19px; height:19px; flex:none}
.opts label:has(input:checked){border-color:var(--q-sky); background:var(--q-sky-tint)}
#nameWrap,#contactWrap{display:none}
#nameWrap.show,#contactWrap.show{display:block}
#contactWrap{display:none; gap:10px; margin-top:16px}
#contactWrap.show{display:grid}
.donate{background:var(--q-sky-tint); border-radius:var(--radius-lg); padding:22px; margin-top:20px}
.donate p{margin:0 0 14px; font-size:16px; text-wrap:pretty}
.donate a{display:inline-block; background:var(--q-sky); border:2px solid var(--q-sky); color:var(--q-white); text-decoration:none; border-radius:var(--radius-pill); padding:13px 24px; font-weight:700; font-size:16px}
.submit{margin-top:48px}
.submit button{width:100%; border:2px solid var(--q-ink); border-radius:var(--radius-pill); background:var(--q-ink); color:var(--q-white); font:inherit; font-size:18px; font-weight:700; padding:17px; cursor:pointer; transition:transform .15s ease,opacity .15s ease}
.submit button:hover{opacity:.92}
.submit button:active{transform:scale(.99)}
.submit button:disabled{opacity:.4; cursor:default}
.err{display:none; margin:0 0 14px; background:var(--q-red-tint); color:var(--q-ink); border-radius:var(--radius-md); padding:14px 18px; font-size:15px; font-weight:500}
.err.show{display:block}
#thanks{display:none; padding-top:6vh}
#thanks.show{display:block}
#thanks .mark{font-weight:900; font-size:44px; letter-spacing:-.03em; line-height:1; margin-bottom:20px}
.hp{position:absolute; left:-9999px; top:-9999px}
footer{margin-top:44px; color:var(--q-gray); font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="wordmark" aria-label="qaravan"><span style="color:#000000">q</span><span style="color:#FF3333">a</span><span style="color:#FF9933">r</span><span style="color:#EBC53F">a</span><span style="color:#0099CC">v</span><span style="color:#66CC66">a</span><span style="color:#7668AA">n</span></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="btnRu" aria-pressed="true">РУ</button>
      <button type="button" id="btnEn" aria-pressed="false">EN</button>
    </div>
  </div>

  <div id="formView">
    <h1 data-i18n="title"></h1>

    <div class="prog" id="prog">
      <div class="track"><i id="progBar"></i></div>
      <div class="lbl" id="progLbl"></div>
    </div>

    <form id="f" novalidate="">
      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div id="events"></div>

      <div id="tail">
        <fieldset>
          <legend data-i18n="q_consent"></legend>
          <div class="opts" id="consentOpts"></div>
          <div id="nameWrap">
            <p class="hint" style="margin-top:14px" data-i18n="name_hint"></p>
            <input type="text" id="respName" maxlength="120">
          </div>
        </fieldset>

        <fieldset>
          <legend data-i18n="q_contact"></legend>
          <div class="opts" id="contactOpts"></div>
          <div id="contactWrap">
            <p class="hint" data-i18n="contact_hint"></p>
            <div><label class="f-lab" for="respContactName" data-i18n="contact_name"></label><input type="text" id="respContactName" maxlength="120" autocomplete="name"></div>
            <div><label class="f-lab" for="respEmail" data-i18n="contact_email"></label><input type="email" id="respEmail" maxlength="200" autocomplete="email" inputmode="email" placeholder="anna@example.com"></div>
            <div><label class="f-lab" for="respPhone" data-i18n="contact_phone"></label><input type="tel" id="respPhone" maxlength="40" autocomplete="tel" inputmode="tel" placeholder="(929) 123-4567"></div>
            <p class="field-hint" id="phoneHint" data-i18n="phone_bad"></p>
          </div>
        </fieldset>

        <fieldset>
          <legend data-i18n="q_donate"></legend>
          <div class="donate">
            <p data-i18n="donate_1"></p>
            <p data-i18n="donate_2" style="font-weight:400"></p>
            <a href="#" target="_blank" rel="noopener" class="tdl" data-i18n="donate_btn"></a>
          </div>
        </fieldset>

        <div class="submit">
          <p class="err" id="err" role="alert"></p>
          <button type="submit" id="send" data-i18n="send"></button>
        </div>
      </div>
      <footer>qaravan.org</footer>
    </form>
  </div>

  <div id="thanks">
    <div class="mark" aria-hidden="true"><span style="color:#000000">q</span><span style="color:#FF3333">a</span><span style="color:#FF9933">r</span><span style="color:#EBC53F">a</span><span style="color:#0099CC">v</span><span style="color:#66CC66">a</span><span style="color:#7668AA">n</span></div>
    <h1 data-i18n="thanks_t"></h1>
    <p class="sub" data-i18n="thanks_p"></p>
  </div>
</div>

<script>
const DONATE_URL = window.__DONATE_URL__ || "https://givebutter.com/qaravan";
const STRINGS = {
ru: {

  name_hint: "Как тебя подписать?",
  q_contact: "Контакты",
  contact_hint: "Как к тебе обращаться и куда написать? Достаточно почты или телефона.",
  contact_opts: ["Можно написать мне по поводу этого отзыва","Оставлю отзыв анонимно — не пишите мне"],
  contact_name: "Имя", contact_email: "Почта", contact_phone: "Телефон",
  err_contact: "Оставь почту или телефон — иначе мы не сможем ответить.",
  phone_bad: "Проверь номер — похоже, в нём опечатка.",
  donate_1: "Честная обратная связь уже помогает нам — спасибо большое!<br><br>Есть и второй способ: все события QARAVAN бесплатные, и это возможно благодаря пожертвованиям тех, кто их находит интересными и стоящими поддержки.",
  donate_2: "Подпишись на ежемесячный донат: <b>$20 в месяц помогают нам готовить новые встречи и делают планирование более предсказуемым.</b>",
  donate_btn: "Поддержать QARAVAN",
  send: "Отправить",
  err_rating: "Поставь звёзды каждому событию — или отметь «Меня там не было».",
  err_net: "Не отправилось. Проверь интернет и попробуй ещё раз.",
  q_donate: "И последнее.",
  thanks_t: "Спасибо!",
  thanks_p: "Передадим команде."
},
en: {
  title: "How were this week's events?",
  stars_words: ["Bad", "Meh", "Okay", "Good", "Great!"],
  q_good: "What was best about it?",
  q_bad: "What should we fix?",
  chips_good: ["The people", "The atmosphere", "The topic & content", "The organizers"],
  chips_bad: ["Inconvenient time", "Hard to get to", "Too long", "Too short", "Hard to join in", "Not enough info beforehand"],
  prog: (a, b) => `${a} of ${b}`,
  prog_zero: n => `${n} event${n === 1 ? "" : "s"}`,
  prog_done: "Done",
  ev_comment_ph: "Want to add a few words? Optional",
  add_words: "Add a few words",
  photos_ask: "We really need your photos and videos — they help us bring in new people and make a convincing case for why our mission matters.",
  na: "I wasn't there",
  na_note: "Got it — we'll skip this one.",
  na_undo: "Undo",
  need_stars: "Add a rating — or mark that you weren't there.",
  next: "Next",

const params = new URLSearchParams(location.search);
const ids = ((window.__EVENTS__ || "") || params.get("e") || "").split(",").map(s => s.replace(/\D/g, "")).filter(Boolean).slice(0, 10);
const pTok = ((window.__P__ || "") || params.get("p") || "").replace(/[^0-9a-zA-Z.]/g, "").slice(0, 80);
let lang = params.get("lang") === "en" ? "en" : "ru";
let consent = "", contactOk = "", showAll = false, cursor = 0, needStarsAt = null;
const ev = ids.map(id => ({ id, name: "", date: "", rating: 0, na: false, comment: "", tags: [], custom: "", customA: "", photos: [] }));

const $ = id => document.getElementById(id);
const T = () => STRINGS[lang];
const HTML_KEYS = new Set(["donate_1", "donate_2"]);
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,2 15.1,8.3 22,9.3 17,14.1 18.2,21 12,17.8 5.8,21 7,14.1 2,9.3 8.9,8.3"/></svg>';
const answered = e => e.na || e.rating > 0;

// ===== черновик переживает перезагрузку (письмо открывают из мессенджера) =====
const DRAFT_KEY = "qrv-multi-" + ids.join("-");
function saveDraft(){
  try{
    sessionStorage.setItem(DRAFT_KEY, JSON.stringify({
      lang, consent, contactOk,
      ev: ev.map(e => ({ rating: e.rating, na: e.na, comment: e.comment, tags: e.tags, customA: e.customA })),
      name: $("respName").value, cname: $("respContactName").value,
      email: $("respEmail").value, phone: $("respPhone").value,
    }));
  }catch(x){}
}
function loadDraft(){
  try{
    const d = JSON.parse(sessionStorage.getItem(DRAFT_KEY) || "null");
    if (!d || !Array.isArray(d.ev) || d.ev.length !== ev.length) return;
    lang = d.lang === "en" ? "en" : "ru";
    consent = d.consent === "" ? "" : Number(d.consent);
    contactOk = d.contactOk === "" ? "" : Number(d.contactOk);
    d.ev.forEach((x, i) => { ev[i].rating = Number(x.rating) || 0; ev[i].na = !!x.na; ev[i].comment = String(x.comment || ""); ev[i].tags = Array.isArray(x.tags) ? x.tags : []; ev[i].customA = String(x.customA || ""); });
    $("respName").value = d.name || ""; $("respContactName").value = d.cname || "";
    $("respEmail").value = d.email || ""; $("respPhone").value = d.phone || "";
  }catch(x){}
}
const clearDraft = () => { try{ sessionStorage.removeItem(DRAFT_KEY); }catch(x){} };

// ===== фото и видео: сразу напрямую в Google Photos, к альбому своего события =====
const PH_MAX_SIZE = 300 * 1024 * 1024, PH_MAX_COUNT = 10, PH_PARALLEL = 3;
const phTok = {};           // eventId -> { token, exp }
let phActive = 0;

async function phGetAccess(eventId){
  const c = phTok[eventId];
  if (c && Date.now() < c.exp - 60000) return c.token;
  const r = await fetch("/api/photos-token", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ eventId }) });
  if (!r.ok) throw new Error("token");
  const d = await r.json();
  phTok[eventId] = { token: d.token, exp: Date.now() + (d.expiresIn || 3600) * 1000 };
  return d.token;
}
function phPump(){
  if (phActive >= PH_PARALLEL) return;
  let next = null;
  for (const e of ev) { next = e.photos.find(p => p.status === "wait"); if (next) break; }
  if (!next) return;
  phActive++;
  phSend(next).finally(() => { phActive--; phPump(); });
  phPump();
}
async function phSend(p){
  p.status = "up";
  const retry = p.el.querySelector(".ph-retry");
  if (retry) retry.remove();
  try{
    const tok = await phGetAccess(p.eventId);
    const text = await new Promise((ok, no) => {
      const x = new XMLHttpRequest();
      x.open("POST", "https://photoslibrary.googleapis.com/v1/uploads");
      x.setRequestHeader("Authorization", "Bearer " + tok);
      x.setRequestHeader("Content-Type", "application/octet-stream");
      x.setRequestHeader("X-Goog-Upload-Content-Type", p.file.type || "application/octet-stream");
      x.setRequestHeader("X-Goog-Upload-Protocol", "raw");
      x.upload.onprogress = e => { if (e.lengthComputable){ const b = p.el.querySelector(".ph-bar i"); if (b) b.style.width = (e.loaded / e.total * 100) + "%"; } };
      x.onload = () => (x.status === 200 && x.responseText) ? ok(x.responseText) : no(new Error("http " + x.status));
      x.onerror = () => no(new Error("net"));
      x.timeout = 15 * 60 * 1000;
      x.ontimeout = () => no(new Error("timeout"));
      x.send(p.file);
    });
    p.token = text.trim(); p.status = "done"; p.el.classList.add("done");
  }catch(e){
    p.status = "fail"; p.el.classList.add("fail");
    const b = document.createElement("button");
    b.type = "button"; b.className = "ph-retry"; b.textContent = T().photos_retry;
    b.onclick = () => { p.el.classList.remove("fail"); p.status = "wait"; phPump(); };
    p.el.appendChild(b);
  }
}
function phAdd(e, files, grid, errEl){
  errEl.classList.remove("show");
  for (const f of files){
    if (e.photos.filter(p => p.status !== "removed").length >= PH_MAX_COUNT){ errEl.textContent = T().photos_err_count; errEl.classList.add("show"); break; }
    if (f.size > PH_MAX_SIZE){ errEl.textContent = T().photos_err_size; errEl.classList.add("show"); continue; }
    const el = document.createElement("div");
    el.className = "ph-item";
    const url = URL.createObjectURL(f);
    const isVideo = (f.type || "").startsWith("video/");
    el.innerHTML = (isVideo
      ? `<video muted playsinline preload="metadata" src="${url}"></video><span class="ph-badge">${lang === "ru" ? "видео" : "video"}</span>`
      : `<img alt="" src="${url}">`) + `<div class="ph-bar"><i></i></div>`;
    const x = document.createElement("button");
    x.type = "button"; x.className = "ph-x"; x.textContent = "×"; x.setAttribute("aria-label", "remove");
    const rec = { file: f, el, status: "wait", token: "", eventId: e.id, name: f.name || "media" };
    x.onclick = () => { rec.status = "removed"; el.remove(); URL.revokeObjectURL(url); };
    el.appendChild(x);
    grid.appendChild(el);
    e.photos.push(rec);
  }
  phPump();
}
const phLive = e => e.photos.filter(p => p.status !== "removed");
const phBusy = () => ev.some(e => phLive(e).some(p => p.status === "wait" || p.status === "up"));

// ===== телефон и почта =====
const phoneDigits = v => v.replace(/\D/g, "");
function phoneFormat(v){
  const plus = v.trim().startsWith("+");
  let d = phoneDigits(v);
  if (!plus && d.length === 11 && d[0] === "8") return "8 (" + d.slice(1,4) + ") " + d.slice(4,7) + "-" + d.slice(7,9) + "-" + d.slice(9);
  if (!plus && d.length === 11 && d[0] === "1") return "+1 (" + d.slice(1,4) + ") " + d.slice(4,7) + "-" + d.slice(7);
  if (!plus && d.length === 10) return "(" + d.slice(0,3) + ") " + d.slice(3,6) + "-" + d.slice(6);
  if (plus && d.length === 11 && d[0] === "1") return "+1 (" + d.slice(1,4) + ") " + d.slice(4,7) + "-" + d.slice(7);
  if (plus && d.length === 11 && d[0] === "7") return "+7 (" + d.slice(1,4) + ") " + d.slice(4,7) + "-" + d.slice(7,9) + "-" + d.slice(9);
  return (plus ? "+" : "") + d;
}
const phoneValid = v => { const n = phoneDigits(v).length; return n >= 10 && n <= 15; };
const emailValid = v => /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(v.trim());

function radios(list, wrap, name, onPick, picked){
  wrap.innerHTML = "";
  list.forEach((label, i) => {
    const l = document.createElement("label");
    const r = document.createElement("input");
    r.type = "radio"; r.name = name; r.value = i; r.checked = picked === i;
    r.onchange = () => { onPick(i); saveDraft(); };
    const s = document.createElement("span"); s.textContent = label;
    l.append(r, s); wrap.appendChild(l);
  });
}

// ===== события: раскрываем по одному =====
// Открыто ровно одно событие — то, до которого дошли. Отвеченные сворачиваются в
// строку, следующие не показываются вовсе: форма про пять событий не должна
// выглядеть как анкета на три экрана. Курсор двигает только сам человек —
// кнопкой «Дальше», чтобы оценка не съедала возможность написать и приложить фото.
function nextIndex(from){
  for (let i = from + 1; i < ev.length; i++) if (!answered(ev[i])) return i;
  for (let i = 0; i < ev.length; i++) if (!answered(ev[i])) return i;
  return ev.length;
}
function advance(from){
  cursor = nextIndex(from);
  needStarsAt = null;
  render();
  setTimeout(() => {
    const host = document.querySelector(`[data-ev="${cursor}"]`);
    if (host) { host.classList.add("enter"); host.scrollIntoView({ behavior: "smooth", block: "start" }); }
    else if (allAnswered()) $("tail").scrollIntoView({ behavior: "smooth", block: "start" });
  }, 60);
}

function fillDone(e, host, idx){
  host.className = "ev";
  const row = document.createElement("div"); row.className = "done-row";
  const txt = document.createElement("div"); txt.className = "txt";
  const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = e.name || "—";
  const mini = document.createElement("div"); mini.className = "mini";
  if (e.na) mini.textContent = T().na;
  else {
    mini.innerHTML = "<b>" + "★".repeat(e.rating) + "</b>" + "☆".repeat(5 - e.rating)
      + (phLive(e).length ? ` · ${phLive(e).length} 📷` : "");
  }
  txt.append(nm, mini);
  const b = document.createElement("button");
  b.type = "button"; b.className = "linkbtn"; b.textContent = T().change;
  b.onclick = () => { cursor = idx; render(); };
  row.append(txt, b);
  host.appendChild(row);
}

function fillActive(e, host, idx){
  host.className = "ev";
  const head = document.createElement("div"); head.className = "ev-head";
  if (e.date){ const date = document.createElement("div"); date.className = "date"; date.textContent = e.date; head.appendChild(date); }
  const h = document.createElement("h2"); h.textContent = e.name || "Событие QARAVAN";
  head.appendChild(h);
  host.appendChild(head);

  if (e.na){
    const box = document.createElement("div"); box.className = "absent";
    const s = document.createElement("span"); s.textContent = T().na_note;
    const u = document.createElement("button");
    u.type = "button"; u.className = "linkbtn"; u.textContent = T().na_undo;
    u.onclick = () => { e.na = false; cursor = idx; saveDraft(); render(); };
    box.append(s, u); host.appendChild(box);
    return;
  }

  const stars = document.createElement("div");
  stars.className = "stars"; stars.setAttribute("role", "radiogroup");
  stars.setAttribute("aria-label", (e.name || "") + " — " + (lang === "ru" ? "оценка" : "rating"));
  for (let i = 1; i <= 5; i++){
    const b = document.createElement("button");
    b.type = "button"; b.innerHTML = STAR;
    b.setAttribute("role", "radio");
    b.setAttribute("aria-checked", String(e.rating === i));
    b.setAttribute("aria-label", lang === "ru" ? i + " из 5" : i + " of 5");
    b.classList.toggle("on", i <= e.rating);
    b.onclick = () => {
      e.rating = i; e.tags = []; needStarsAt = null; $("err").classList.remove("show");
      saveDraft(); render();
    };
    // подсветка «до курсора» — оценка видна ещё до клика
    b.onmouseenter = () => stars.querySelectorAll("button").forEach((x, j) => x.classList.toggle("hot", j < i));
    b.onmouseleave = () => stars.querySelectorAll("button").forEach(x => x.classList.remove("hot"));
    stars.appendChild(b);
  }
  host.appendChild(stars);

  const word = document.createElement("div"); word.className = "stars-word";
  word.textContent = e.rating ? T().stars_words[e.rating - 1] : "";
  host.appendChild(word);

  if (needStarsAt === idx){
    const n = document.createElement("div"); n.className = "need"; n.textContent = T().need_stars;
    host.appendChild(n);
  }

  if (e.rating){
    // варианты ответов: что именно было хорошо — или что поправить.
    // Набор зависит от оценки, чтобы не спрашивать про плохое у довольных.
    const good = e.rating >= 4;
    const list = good ? T().chips_good : T().chips_bad;
    const qa = document.createElement("div"); qa.className = "qa";
    const q = document.createElement("div"); q.className = "qa-q"; q.textContent = good ? T().q_good : T().q_bad;
    const chips = document.createElement("div"); chips.className = "chips";
    list.forEach(label => {
      const c = document.createElement("button");
      c.type = "button"; c.textContent = label;
      const on = (e.tags || []).includes(label);
      c.setAttribute("aria-pressed", String(on));
      c.onclick = () => {
        e.tags = e.tags || [];
        const at = e.tags.indexOf(label);
        if (at === -1) e.tags.push(label); else e.tags.splice(at, 1);
        c.setAttribute("aria-pressed", String(at === -1));
        saveDraft();
      };
      chips.appendChild(c);
    });
    qa.append(q, chips); host.appendChild(qa);

    // поле для текста свёрнуто в ссылку — пустой textarea не должен занимать экран
    if (e.comment || e.taOpen){
      const tb = document.createElement("div"); tb.className = "ta-block";
      const ta = document.createElement("textarea");
      ta.placeholder = T().ev_comment_ph; ta.maxLength = 2000; ta.value = e.comment || "";
      ta.oninput = () => { e.comment = ta.value; saveDraft(); };
      tb.appendChild(ta); host.appendChild(tb);
    } else {
      const tw = document.createElement("div"); tw.className = "ta-toggle";
      const tl = document.createElement("button");
      tl.type = "button"; tl.className = "linkbtn dim"; tl.textContent = T().add_words;
      tl.onclick = () => {
        e.taOpen = true; render();
        setTimeout(() => document.querySelector(`[data-ev="${idx}"] .ta-block textarea`)?.focus(), 60);
      };
      tw.appendChild(tl); host.appendChild(tw);
    }

    // отдельный вопрос про это событие — если организаторы его задали
    if (e.custom){
      const cq = document.createElement("div"); cq.className = "cq";
      const lab = document.createElement("label");
      lab.className = "cq-q"; lab.textContent = e.custom;
      lab.setAttribute("for", "cq-" + e.id);
      const cta = document.createElement("textarea");
      cta.id = "cq-" + e.id; cta.maxLength = 4000; cta.value = e.customA || "";
      cta.oninput = () => { e.customA = cta.value; saveDraft(); };
      cq.append(lab, cta); host.appendChild(cq);
    }

    // фото и видео — к альбому именно этого события. Компактно: кнопка и одна
    // строка; согласие показываем, только когда файлы уже добавлены.
    const ph = document.createElement("div"); ph.className = "ph";
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*,video/*"; inp.multiple = true; inp.style.display = "none";
    const add = document.createElement("button");
    add.type = "button"; add.className = "ph-add"; add.textContent = "📷 " + T().photos_add;
    add.onclick = () => inp.click();
    const ask = document.createElement("p"); ask.className = "ph-ask"; ask.textContent = T().photos_ask;
    const grid = document.createElement("div"); grid.className = "ph-grid";
    const errEl = document.createElement("p"); errEl.className = "ph-err";
    const note = document.createElement("p"); note.className = "ph-note"; note.textContent = T().photos_note;
    const syncNote = () => { note.style.display = phLive(e).length ? "" : "none"; };
    inp.onchange = () => { phAdd(e, Array.from(inp.files || []), grid, errEl); inp.value = ""; syncNote(); };
    ph.append(ask, add, inp, grid, errEl, note);
    // уже загруженные превью переносим в новую сетку — перерисовка их не теряет
    phLive(e).forEach(p => grid.appendChild(p.el));
    syncNote();
    host.appendChild(ph);
  }

  const naWrap = document.createElement("div"); naWrap.className = "na-wrap";
  const na = document.createElement("button");
  na.type = "button"; na.className = "linkbtn"; na.textContent = T().na;
  na.onclick = () => {
    e.na = true; e.rating = 0; needStarsAt = null; saveDraft();
    advance(idx);   // отмечать нечего — сразу к следующему
  };
  naWrap.appendChild(na); host.appendChild(naWrap);

  // «Дальше» появляется только после оценки: пока не оценили — двигаться некуда,
  // а после оценки человек сам решает, писать ли комментарий и грузить ли фото.
  if (e.rating){
    const nx = document.createElement("div"); nx.className = "next";
    const nb = document.createElement("button");
    nb.type = "button";
    nb.textContent = nextIndex(idx) >= ev.length ? T().next_last : T().next;
    nb.onclick = () => advance(idx);
    nx.appendChild(nb); host.appendChild(nx);
  }
}

const allAnswered = () => ev.every(answered);

function renderEvents(){
  const box = $("events"); box.innerHTML = "";
  ev.forEach((e, i) => {
    if (!showAll && i > cursor) return;          // до сюда ещё не дошли
    const host = document.createElement("div");
    host.dataset.ev = String(i);
    box.appendChild(host);
    if (showAll || i === cursor) fillActive(e, host, i);
    else fillDone(e, host, i);
  });
  const done = ev.filter(answered).length;
  $("progBar").style.width = (ev.length ? Math.round(done / ev.length * 100) : 0) + "%";
  $("progLbl").textContent = done === ev.length ? T().prog_done : (done === 0 ? T().prog_zero(ev.length) : T().prog(done, ev.length));
  $("prog").style.display = ev.length > 1 ? "" : "none";
  $("tail").classList.toggle("show", allAnswered());
}

function render(){
  document.documentElement.lang = lang;
  $("btnRu").setAttribute("aria-pressed", lang === "ru");
  $("btnEn").setAttribute("aria-pressed", lang === "en");
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.dataset.i18n;
    if (HTML_KEYS.has(k)) { el.innerHTML = T()[k]; return; }
    el.textContent = T()[k];
  });
  document.querySelectorAll(".tdl").forEach(a => a.href = DONATE_URL);
  renderEvents();
  radios(T().consent, $("consentOpts"), "consent",
    i => { consent = i; $("nameWrap").classList.toggle("show", i === 0); },
    consent === "" ? -1 : consent);
  $("nameWrap").classList.toggle("show", consent === 0);
  radios(T().contact_opts, $("contactOpts"), "contactok",
    i => { contactOk = i; $("contactWrap").classList.toggle("show", i === 0); },
    contactOk === "" ? -1 : contactOk);
  $("contactWrap").classList.toggle("show", contactOk === 0);
}

$("btnRu").onclick = () => { lang = "ru"; saveDraft(); render(); };
$("btnEn").onclick = () => { lang = "en"; saveDraft(); render(); };

const ph = $("respPhone"), em = $("respEmail"), hint = $("phoneHint");
ph.addEventListener("input", () => { ph.value = phoneFormat(ph.value); ph.classList.remove("bad"); hint.classList.remove("show"); ph.classList.toggle("ok", phoneValid(ph.value)); saveDraft(); });
ph.addEventListener("blur", () => { if (!ph.value.trim()) { ph.classList.remove("ok","bad"); hint.classList.remove("show"); return; } const g = phoneValid(ph.value); ph.classList.toggle("ok", g); ph.classList.toggle("bad", !g); hint.classList.toggle("show", !g); });
em.addEventListener("input", () => { em.classList.remove("bad"); em.classList.toggle("ok", emailValid(em.value)); saveDraft(); });
em.addEventListener("blur", () => { if (!em.value.trim()) { em.classList.remove("ok","bad"); return; } const g = emailValid(em.value); em.classList.toggle("ok", g); em.classList.toggle("bad", !g); });
$("respName").addEventListener("input", saveDraft);
$("respContactName").addEventListener("input", saveDraft);

async function loadEvents(){
  await Promise.all(ev.map(async e => {
    try{
      const r = await fetch(`/api/event?id=${e.id}`);
      if (r.ok){ const d = await r.json(); e.name = d.name || ""; e.date = d.date || ""; e.custom = (d.custom || "").trim(); }
    }catch(x){}
  }));
  render();
}

$("f").addEventListener("submit", async x => {
  x.preventDefault();
  const err = $("err");
  const missing = ev.findIndex(e => !answered(e));
  if (missing !== -1){
    needStarsAt = missing; cursor = missing; render();
    err.textContent = T().err_rating; err.classList.add("show");
    const host = document.querySelector(`[data-ev="${missing}"]`);
    if (host) host.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  if (contactOk === 0 && !emailValid(em.value) && !phoneValid(ph.value)){
    err.textContent = T().err_contact; err.classList.add("show");
    em.classList.add("bad");
    return;
  }
  if (phBusy()){
    err.textContent = T().photos_wait; err.classList.add("show");
    return;
  }
  err.classList.remove("show");
  $("send").disabled = true;
  const credit = (consent === 0 ? $("respName").value.trim() : "") || (contactOk === 0 ? $("respContactName").value.trim() : "");
  const body = {
    multi: 1, p: pTok, lang,
    events: ev.map(e => ({
      id: e.id, rating: e.rating || 0, comment: (e.comment || "").trim(), no_show: !!e.na,
      tags: e.na ? [] : (e.tags || []),
      custom_a: e.custom ? (e.customA || "").trim() : "",
      photos: phLive(e).filter(p => p.status === "done" && p.token).map(p => ({ token: p.token, name: p.name })),
    })),
    photo_credit: credit,
    consent: consent === "" ? "" : STRINGS.ru.consent[consent],
    name: consent === 0 ? $("respName").value.trim() : "",
    contact_ok: contactOk === "" ? "" : STRINGS.ru.contact_opts[contactOk],
    contact_name: contactOk === 0 ? $("respContactName").value.trim() : "",
    email: contactOk === 0 ? em.value.trim() : "",
    phone: contactOk === 0 ? ph.value.trim() : "",
    website: document.querySelector(".hp").value
  };
  try{
    const r = await fetch("/api/submit", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error();
    clearDraft();
    $("formView").style.display = "none";
    $("thanks").classList.add("show");
    window.scrollTo({top:0});
  }catch(e2){
    err.textContent = T().err_net; err.classList.add("show");
    $("send").disabled = false;
  }
});

loadDraft();
render();
loadEvents();
</script>
</body></html>

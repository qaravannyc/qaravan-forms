<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отзыв — QARAVAN</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFDF5">

<link rel="preconnect" href="https://photoslibrary.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Qaravan tokens */
  --q-red:#FF3333; --q-orange:#FF9933; --q-yellow:#F8F36E;
  --q-green:#66CC66; --q-sky:#0099CC; --q-purple:#7668AA;
  --q-black:#000000; --q-ink:#333333; --q-gray:#6E6E6E;
  --q-line:#ECE8DE; --q-paper:#FFFDF5; --q-white:#FFFFFF;
  --q-red-tint:#FFE4E4; --q-orange-tint:#FFEDD9; --q-sky-tint:#DDF1F8;
  --font-brand:'Montserrat','Helvetica Neue',Arial,sans-serif;
  --radius-md:12px; --radius-lg:16px; --radius-pill:999px;
  --shadow-card:0 2px 6px rgba(51,51,51,.05), 0 10px 28px rgba(51,51,51,.07);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--q-paper); color:var(--q-ink);
  font-family:var(--font-brand); font-size:17px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--q-sky); font-weight:700; text-decoration-thickness:2px}
a:hover{color:var(--q-purple)}
.wrap{max-width:560px; margin:0 auto; padding:20px 20px 64px}

/* header */
.top{display:flex; justify-content:space-between; align-items:center; gap:16px; padding:4px 0 32px}
.wordmark{font-weight:900; font-size:26px; letter-spacing:-.03em; line-height:1; white-space:nowrap}
a.wordmark{text-decoration:none}
.lang{display:flex; gap:0; border:2px solid var(--q-ink); border-radius:var(--radius-pill); overflow:hidden; background:var(--q-white)}
.lang button{
  border:0; background:transparent; padding:8px 15px; font:inherit; font-size:13px; font-weight:700;
  color:var(--q-ink); cursor:pointer; line-height:1.2; transition:background .15s ease, color .15s ease;
}
.lang button[aria-pressed="true"]{background:var(--q-ink); color:var(--q-white)}

/* hero */
.eyebrow{font-size:13px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--q-sky)}
h1{font-weight:800; font-size:clamp(28px,7.5vw,40px); line-height:1.1; letter-spacing:-.02em; margin:10px 0 8px; text-wrap:balance}
.sub{color:var(--q-gray); margin:0; text-wrap:pretty}
.hero{margin-bottom:14px;opacity:0; transform:translateY(8px); transition:opacity .28s ease-out, transform .28s ease-out}
.hero.on{opacity:1; transform:none}
@media (prefers-reduced-motion:reduce){ .hero{transition:none; transform:none} }

/* sections */
fieldset{border:0; padding:24px 0 0; margin:0}
fieldset+fieldset{border-top:1px solid var(--q-line); margin-top:40px; padding-top:36px}
legend{float:left; width:100%; padding:0; margin:0 0 22px; font-weight:700; font-size:19px; line-height:1.35; text-wrap:pretty}
legend+*{clear:both}
fieldset legend+textarea{margin-top:0}
fieldset legend+input[type="number"]{margin-top:0}
.hint{color:var(--q-gray); font-size:14px; font-weight:400; margin:8px 0 0; text-wrap:pretty}
legend .hint{display:block; margin:6px 0 0}
.req{color:var(--q-red)}

/* stars */
.stars{display:flex; gap:10px; margin-top:0}
.stars button{
  width:56px; height:56px; border-radius:var(--radius-lg); border:2px solid var(--q-ink);
  background:var(--q-white); color:#D8D3C6; cursor:pointer; padding:0;
  display:flex; align-items:center; justify-content:center;
  transition:transform .15s ease, border-color .15s ease, background .15s ease, color .15s ease;
}
.stars button:active{transform:scale(.95)}
.stars button.on{color:var(--q-orange); border-color:var(--q-orange); background:var(--q-orange-tint)}
.stars svg{width:26px; height:26px; display:block; fill:currentColor}

.na-link{border:0; background:none; color:var(--q-gray); font:inherit; font-size:14px; font-weight:700; text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:0; margin-top:18px; display:block}
.na-link:hover{color:var(--q-ink)}

/* chips */
.chips{display:flex; flex-wrap:wrap; gap:12px; margin-top:14px}
.chips button{
  border:2px solid var(--q-ink); background:var(--q-white); border-radius:var(--radius-pill);
  padding:10px 18px; font:inherit; font-size:15px; font-weight:700; line-height:1.25;
  cursor:pointer; color:var(--q-ink);
  transition:transform .15s ease, background .15s ease, border-color .15s ease, color .15s ease;
}
.chips button:active{transform:scale(.97)}
.chips button[aria-pressed="true"]{background:var(--q-sky); border-color:var(--q-sky); color:var(--q-white)}
.chips button:nth-child(6n+1)[aria-pressed="true"]{background:var(--q-red); border-color:var(--q-red)}
.chips button:nth-child(6n+2)[aria-pressed="true"]{background:var(--q-orange); border-color:var(--q-orange)}
.chips button:nth-child(6n+3)[aria-pressed="true"]{background:var(--q-green); border-color:var(--q-green)}
.chips button:nth-child(6n+4)[aria-pressed="true"]{background:var(--q-purple); border-color:var(--q-purple)}
.chips button:nth-child(6n+5)[aria-pressed="true"]{background:var(--q-sky); border-color:var(--q-sky)}
.chips button:nth-child(6n)[aria-pressed="true"]{background:var(--q-ink); border-color:var(--q-ink)}
.other-input{display:none; margin-top:14px}
.other-input.show{display:block}

/* text fields */
textarea,input[type="text"],input[type="email"],input[type="tel"]{
  width:100%; border:2px solid var(--q-ink); border-radius:var(--radius-md); background:var(--q-white);
  padding:13px 16px; font:inherit; font-size:16px; color:var(--q-ink); margin-top:18px;
  transition:border-color .15s ease, box-shadow .15s ease;
}
textarea{min-height:118px; resize:vertical; line-height:1.5}
textarea:focus,input[type="text"]:focus,input[type="email"]:focus,input[type="tel"]:focus{
  outline:none; border-color:var(--q-sky); box-shadow:0 0 0 3px var(--q-sky-tint);
}
button:focus-visible,a:focus-visible{outline:3px solid var(--q-sky); outline-offset:2px}

/* radio rows */
.opts{display:grid; gap:12px; margin-top:0}
.donate+.opts{margin-top:18px}
.opts label{
  display:flex; gap:12px; align-items:flex-start; border:2px solid var(--q-ink);
  background:var(--q-white); border-radius:var(--radius-md); padding:14px 16px; cursor:pointer;
  font-size:16px; transition:border-color .15s ease, background .15s ease;
}
.opts input{margin:4px 0 0; accent-color:var(--q-sky); width:19px; height:19px; flex:none}
.opts label:has(input:checked){border-color:var(--q-sky); background:var(--q-sky-tint)}
#nameWrap{display:none}
#nameWrap.show{display:block}

/* donate card */
.donate{
  background:var(--q-sky-tint); border-radius:var(--radius-lg);
  padding:22px; margin-top:18px;
}
.donate p{margin:0 0 14px; font-size:16px; text-wrap:pretty}
.donate a{
  display:inline-block; background:var(--q-sky); border:2px solid var(--q-sky); color:var(--q-white);
  text-decoration:none; border-radius:var(--radius-pill); padding:13px 24px; font-weight:700; font-size:16px;
  transition:transform .15s ease, opacity .15s ease;
}
.donate a:hover{color:var(--q-white); opacity:.9}
.donate a:active{transform:scale(.97)}

/* submit */
.submit{margin-top:48px}
.submit button{
  width:100%; border:2px solid var(--q-ink); border-radius:var(--radius-pill); background:var(--q-ink);
  color:var(--q-white); font:inherit; font-size:18px; font-weight:700; padding:17px; cursor:pointer;
  transition:transform .15s ease, opacity .15s ease;
}
.submit button:active{transform:scale(.99)}
.submit button:disabled{opacity:.4; cursor:default; transform:none}
.err{
  display:none; margin:0 0 14px; background:var(--q-red-tint); color:var(--q-ink);
  border-radius:var(--radius-md); padding:14px 18px; font-size:15px; font-weight:500;
}
.err.show{display:block}

/* thanks */
#thanks{display:none; padding-top:6vh}
#thanks.show{display:block}
#thanks h1{margin-top:0}



input.ok{border-color:var(--q-green) !important}
input.bad{border-color:var(--q-red) !important}
.field-hint{display:none; color:var(--q-red); font-size:14px; margin:8px 0 0}
.field-hint.show{display:block}

/* steps */
.step{display:none}
.step.on{display:block; animation:stepin .3s ease-out}
@keyframes stepin{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){ .step.on{animation:none} }
.stepnav{margin-top:46px; display:flex; align-items:center; justify-content:space-between; gap:14px}
.stepnav .next{border:2px solid var(--q-ink); border-radius:var(--radius-pill); background:var(--q-ink); color:var(--q-white); font:inherit; font-size:17px; font-weight:700; padding:15px 34px; cursor:pointer; transition:transform .15s ease}
.stepnav .next:active{transform:scale(.97)}
.stepnav .back{border:0; background:none; color:var(--q-gray); font:inherit; font-size:15px; font-weight:700; cursor:pointer; padding:10px 0}
.stepcount{color:var(--q-gray); font-size:13px; font-weight:700; letter-spacing:.06em}
.submit .back{border:0; background:none; color:var(--q-gray); font:inherit; font-size:15px; font-weight:700; cursor:pointer; padding:0; margin-top:22px}
/* photos */
.ph-add{border:2px dashed var(--q-ink); background:var(--q-white); border-radius:var(--radius-md); width:100%; padding:15px; font:inherit; font-size:16px; font-weight:700; color:var(--q-ink); cursor:pointer; transition:transform .15s ease, background .15s ease}
.ph-add:active{transform:scale(.99)}
.ph-quality{display:flex; gap:8px; align-items:flex-start; margin:12px 0; font-size:14px; line-height:1.45; cursor:pointer}
.ph-quality input{flex:none; width:18px; height:18px; margin:1px 0 0; accent-color:var(--q-sky)}
.ph-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px}
.ph-item{position:relative; border-radius:var(--radius-md); overflow:hidden; background:var(--q-line); aspect-ratio:1}
.ph-item img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
.ph-item img[hidden]{display:none}
.ph-placeholder{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:30px 10px 14px; text-align:center}
.ph-placeholder>span:first-child{font-size:28px; line-height:1}
.ph-name{font-size:11px; line-height:1.3; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.ph-bar{position:absolute; left:0; right:0; bottom:0; height:5px; background:rgba(255,255,255,.55)}
.ph-bar i{display:block; height:100%; width:0; background:var(--q-sky); transition:width .2s}
.ph-item.done .ph-bar{display:none}
.ph-item.fail .ph-bar{display:none}
.ph-retry{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border:0; cursor:pointer; font:inherit; font-size:13px; font-weight:700; color:var(--q-white); background:rgba(255,51,51,.72)}
.ph-x{position:absolute; z-index:2; top:6px; right:6px; width:26px; height:26px; border-radius:50%; border:0; background:rgba(0,0,0,.55); color:#fff; font-weight:900; font-size:14px; cursor:pointer; line-height:1; display:flex; align-items:center; justify-content:center}
.ph-badge{position:absolute; left:6px; top:6px; background:rgba(0,0,0,.55); color:#fff; font-size:11px; font-weight:700; padding:2px 7px; border-radius:99px}
.hp{position:absolute; left:-9999px; top:-9999px}
footer{margin-top:56px; color:var(--q-gray); font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="wordmark" href="https://qaravan.org" aria-label="qaravan.org"><span style="color:#000000">q</span><span style="color:#FF3333">a</span><span style="color:#FF9933">r</span><span style="color:#EBC53F">a</span><span style="color:#0099CC">v</span><span style="color:#66CC66">a</span><span style="color:#7668AA">n</span></a>
    <div class="lang" role="group" aria-label="Language" data-i18n-aria="language_label">
      <button type="button" id="btnRu" aria-pressed="true">РУ</button>
      <button type="button" id="btnEn" aria-pressed="false">EN</button>
    </div>
  </div>

  <div id="formView">
    <header class="hero" id="hero">
      <div class="eyebrow" id="evDate"></div>
      <h1 id="evName" data-i18n="loading">…</h1>
    </header>

    <form id="f" novalidate="">
      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

      <div class="step on" data-step="1">
      <fieldset>
        <legend><span data-i18n="q_rating"></span> <span class="req">*</span></legend>
        <div class="stars" id="stars" role="radiogroup"></div>
        <button type="button" class="na-link" id="naBtn" data-i18n="na_link"></button>
      </fieldset>

      <fieldset>
        <legend><span data-i18n="q_high"></span><span class="hint" data-i18n="multi"></span></legend>
        <div class="chips" id="chipsHigh"></div>
        <div class="other-input" id="highOtherWrap">
          <input type="text" id="highOther" maxlength="200">
        </div>
      </fieldset>

      <fieldset>
        <legend><span data-i18n="q_low"></span><span class="hint" data-i18n="multi_none"></span></legend>
        <div class="chips" id="chipsLow"></div>
        <div class="other-input" id="lowOtherWrap">
          <input type="text" id="lowOther" maxlength="200">
        </div>
      </fieldset>

      <p class="err" id="err1" role="alert" style="margin-top:26px"></p>
      <div class="stepnav">
        <span class="stepcount">1 / 3</span>
        <button type="button" class="next" data-goto="2" data-i18n="nav_next"></button>
      </div>
      </div>

      <div class="step" data-step="2">
      <fieldset id="customWrap" style="display:none">
        <legend id="customQ"></legend>
        <textarea id="customA" maxlength="4000"></textarea>
      </fieldset>

      <fieldset>
        <legend><span data-i18n="q_moment"></span><span class="hint" data-i18n="moment_hint"></span></legend>
        <textarea id="moment" maxlength="4000"></textarea>
      </fieldset>

      <fieldset>
        <legend><span data-i18n="q_whycome"></span><span class="hint" data-i18n="multi"></span></legend>
        <div class="chips" id="chipsWhy"></div>
        <div class="other-input" id="whyOtherWrap">
          <input type="text" id="whyOther" maxlength="200">
        </div>
      </fieldset>

      <fieldset>
        <legend><span data-i18n="q_photos"></span><span class="hint" data-i18n="photos_hint"></span></legend>
        <p class="hint" data-i18n="photos_optimizing_note"></p>
      <label class="ph-quality"><input type="checkbox" id="phOriginal"><span data-i18n="photos_original"></span></label>
      <input type="file" id="phInput" accept="image/*,video/*" multiple style="display:none">
        <button type="button" class="ph-add" id="phAdd"></button>
        <div class="ph-grid" id="phGrid"></div>
        <p class="hint" id="phStatus" role="status" style="display:none; margin-top:12px"></p>
        <p class="err" id="phErr" role="alert" style="margin-top:14px"></p>
        <div id="phConsentWrap" style="display:none">
          <p class="hint" data-i18n="photos_agree" style="margin-top:16px"></p>
          <div id="phCreditWrap" style="margin-top:6px">
            <p class="hint" data-i18n="photos_credit"></p>
            <input type="text" id="phCredit" maxlength="120">
          </div>
        </div>
      </fieldset>

      <div class="stepnav">
        <button type="button" class="back" data-goto="1" data-i18n="nav_back"></button>
        <span class="stepcount">2 / 3</span>
        <button type="button" class="next" data-goto="3" data-i18n="nav_next"></button>
      </div>
      </div>

      <div class="step" data-step="3">
      <fieldset>
        <legend data-i18n="q_consent"></legend>
        <div class="opts" id="consentOpts"></div>
        <div id="nameWrap">
          <p class="hint" data-i18n="name_hint"></p>
          <input type="text" id="respName" maxlength="120">
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="q_contact"></legend>
        <div class="opts" id="contactOpts"></div>
        <div id="contactWrap" style="display:none">
          <input type="text" id="respContactName" maxlength="120" autocomplete="name">
          <input type="email" id="respEmail" aria-describedby="emailHint" maxlength="200" autocomplete="email" inputmode="email">
          <input type="tel" id="respPhone" aria-describedby="phoneHint" maxlength="40" autocomplete="tel" inputmode="tel">
          <p class="field-hint" id="phoneHint" data-i18n="phone_bad"></p>
          <p class="field-hint" id="emailHint" data-i18n="email_bad"></p>
        </div>
      </fieldset>

      <div class="submit">
        <p class="err" id="err" role="alert"></p>
        <button type="submit" id="send" data-i18n="send"></button>
        <button type="button" class="back" data-goto="2" data-i18n="nav_back"></button>
        <footer>qaravan.org</footer>
      </div>
      </div>
    </form>
  </div>

  <div id="thanks">
    <h1 data-i18n="thanks_t"></h1>
    <p id="photoWarning" class="err" role="alert"></p>
    <p class="sub" data-i18n="thanks_p"></p>
    <div class="donate" id="thanksDonate">
      <p data-i18n="donate_1"></p>
      <p data-i18n="donate_2" style="font-weight:400"></p>
      <a href="#" target="_blank" rel="noopener" class="tdl" data-i18n="donate_btn"></a>
    </div>
  </div>
</div>

<script src="/assets/photo-previews.js"></script>
<script>
// ===== настройки =====
const DONATE_URL = window.__DONATE_URL__ || "https://givebutter.com/qaravan"; // ссылка на ежемесячный платёж — задаётся переменной окружения DONATE_URL

// ===== все тексты формы — редактируются здесь =====
const STRINGS = {
ru: {
  photos_partial: (n) => `Отправка завершена, но не удалось добавить в альбом файлов: ${n}. Сохрани оригиналы и сообщи об этом организаторам события.`,
  na_error: "Не удалось сохранить отметку. Проверь интернет и снова нажми «Меня там не было».",
  email_bad: "Проверь почту: нужен адрес в формате name@example.com.",
  language_label: "Язык формы",
  sending: "Отправляем…",
  loading: "Отзыв о событии QARAVAN",
  multi: "Можно выбрать несколько вариантов.",
  multi_none: "Можно выбрать несколько вариантов или пропустить вопрос.",
  q_rating: "Как тебе в целом?",
  q_high: "Что понравилось больше всего?",
  high: ["Люди и общение","Новые знакомства","Атмосфера","Тема и содержание","Ведущие и организация","Место","Еда и угощения","Было полезно","Другое"],
  q_low: "Что было некомфортно?",
  low: ["Неудобное время","Сложно добираться","Неудобное место","Слишком долго","Слишком коротко","Слишком тяжело физически","Не с кем было поговорить","Слишком много людей","Языковой барьер","Мало информации заранее","Дорого вышло","Другое","Всё было ок"],
  q_moment_good: "Что организаторам удалось особенно хорошо — и почему для тебя это было важно?",
  q_moment_bad: "Что пошло не так — и что нам стоит поменять в следующий раз?",
  moment_hint: "Твой ответ прочитают те, кто готовил и вёл событие.",
  q_whycome: "Я пошёл / пошла на эту встречу, потому что…",
  whycome: ["Было одиноко","Здесь мало друзей и знакомых","Интересна тема","Хотелось побыть среди своих","Хотелось говорить на русском языке","Хотелось говорить на английском языке","Искал(а) поддержку","Новые знакомства","Другое"],
  q_photos: "Есть фото или видео с события?",
  photos_hint: "До 50 файлов, каждый до 300 МБ. Загрузка начнётся после выбора. Оставь страницу открытой и дождись загрузки перед отправкой.",
  photos_add: "Выбрать фото и видео",
  photos_agree: "Загружая файлы, ты соглашаешься, что QARAVAN может использовать их в своих материалах и соцсетях.",
  photos_credit: "Как тебя подписать как автора? Можно оставить пустым.",
  photos_optimizing_note: "По возможности уменьшаем размер JPEG-файлов, сохраняя исходное разрешение и высокое качество. Выбери оригиналы до добавления фото, чтобы сохранить файлы и данные камеры без изменений. Видео не меняем.",
  photos_original: "Загрузить оригиналы без изменений",

// Первая строка — русский вопрос, вторая — английский. Пустых строк не считаем.
function customByLang(text, lng){
  const lines = String(text || "").split(/\n+/).map(t => t.trim()).filter(Boolean);
  if (!lines.length) return "";
  return lng === "en" && lines[1] ? lines.slice(1).join(" ") : lines[0];
}

// эти строки содержат <b> — рендерятся как HTML

const T = () => STRINGS[lang];

// бренд-правило: запятая — это запятая, никаких средних точек в датах
const cleanDate = s => (s || "").replace(/\s*[·•]\s*/g, ", ");
const OTHER_LABELS = new Set(["Другое", "Other", "Something else"]);

// ===== рендер текстов =====
function chip(list, set, wrap, otherWrap){
  wrap.innerHTML = "";
  list.forEach((label, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label;
    b.dataset.i = i;
    b.setAttribute("aria-pressed", set.has(i) ? "true" : "false");
    b.onclick = () => {
      set.has(i) ? set.delete(i) : set.add(i);
      b.setAttribute("aria-pressed", set.has(i) ? "true" : "false");
      if (OTHER_LABELS.has(label))
        otherWrap.classList.toggle("show", set.has(i));
    };
    wrap.appendChild(b);
  });
  // восстановить видимость «Другое» при смене языка
  const otherIdx = list.findIndex(l => OTHER_LABELS.has(l));
  otherWrap.classList.toggle("show", set.has(otherIdx));
}

function radios(list, wrap, name, onPick, picked){
  wrap.innerHTML = "";
  list.forEach((label, i) => {
    const l = document.createElement("label");
    const r = document.createElement("input");
    r.type = "radio"; r.name = name; r.value = i;
    r.checked = picked === i;
    r.onchange = () => onPick(i);
    const s = document.createElement("span");
    s.textContent = label;
    l.append(r, s);
    wrap.appendChild(l);
  });
}

function render(){
  document.documentElement.lang = lang;
  if (phSaveFailed) $("photoWarning").textContent = T().photos_partial(phSaveFailed);
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", T()[el.dataset.i18nAria]));
  $("btnRu").setAttribute("aria-pressed", lang === "ru");
  $("btnEn").setAttribute("aria-pressed", lang === "en");
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.dataset.i18n;
    if (k === "loading") { el.textContent = eventName || T().loading; return; }
    if (k === "q_moment") { el.textContent = momentQuestion(); return; }
    if (HTML_KEYS.has(k)) { el.innerHTML = T()[k]; return; }

// ===== фото и видео: сразу напрямую в Google Photos =====
let phSaveFailed = 0;
const PH_MAX_SIZE = 300 * 1024 * 1024, PH_MAX_COUNT = 50, PH_PARALLEL = 4;
const photos = []; // {file, el, status: "wait"|"up"|"done"|"fail", token}
let phAccess = null, phAccessExp = 0, phAccessReq = null, phActive = 0;

async function phGetAccess(){
  if (phAccess && Date.now() < phAccessExp - 60000) return phAccess;
  // один запрос на всех: параллельные загрузки не должны ходить за токеном каждая сама
  phAccessReq = phAccessReq || fetch("/api/photos-token", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ eventId }) })
    .then(async r => {
      if (!r.ok) throw new Error("token");
      const d = await r.json();
      phAccess = d.token; phAccessExp = Date.now() + (d.expiresIn || 3600) * 1000;
      return phAccess;
    })
    .finally(() => { phAccessReq = null; });
  return phAccessReq;
}

function phPump(){
  if (phActive >= PH_PARALLEL) return;
  const next = photos.find(p => p.status === "wait");
  if (!next) return;
  phActive++;
  phSend(next).finally(() => { phActive--; phSync(); phPump(); });
  phPump();
}

async function phSend(p){
  p.status = "up";
  const retry = p.el.querySelector(".ph-retry");
  if (retry) retry.remove();
  try {
    const [tok, prepared] = await Promise.all([phGetAccess(), p.prepared || Promise.resolve(p.file)]);
    if (p.status === "removed" || !prepared) return;
    p.file = prepared;
    const text = await new Promise((ok, no) => {
      const x = new XMLHttpRequest();
      p.xhr = x;
      x.open("POST", "https://photoslibrary.googleapis.com/v1/uploads");
      x.setRequestHeader("Authorization", "Bearer " + tok);
      x.setRequestHeader("Content-Type", "application/octet-stream");
      x.setRequestHeader("X-Goog-Upload-Content-Type", p.file.type || "application/octet-stream");
      x.setRequestHeader("X-Goog-Upload-Protocol", "raw");
      x.upload.onprogress = e => { if (p.status !== "removed" && e.lengthComputable) p.el.querySelector(".ph-bar i").style.width = (e.loaded / e.total * 100) + "%"; };
      x.onload = () => (x.status === 200 && x.responseText) ? ok(x.responseText) : no(new Error("http " + x.status));
      x.onerror = () => no(new Error("net"));
      x.onabort = () => no(new Error("aborted"));
      x.timeout = 15 * 60 * 1000;
      x.ontimeout = () => no(new Error("timeout"));
      x.send(p.file);
    });
    if (p.status === "removed") return;
    p.token = text.trim(); p.status = "done"; p.el.classList.add("done");
  } catch (e) {
    if (p.status === "removed") return;
    p.status = "fail"; p.el.classList.add("fail");
    const b = document.createElement("button");
    b.type = "button"; b.className = "ph-retry"; b.textContent = T().photos_retry;
    b.onclick = () => { p.el.classList.remove("fail"); p.status = "wait"; phPump(); phSync(); };
    b.setAttribute("aria-label", T().photos_retry + ": " + (p.file?.name || ""));
    p.el.appendChild(b);
  } finally {
    p.xhr = null;
  }
}

function phAddFiles(files){
  const err = $("phErr"); err.classList.remove("show");
  for (const f of files) {
    if (photos.filter(p => p.status !== "removed").length >= PH_MAX_COUNT) { err.textContent = T().photos_err_count; err.classList.add("show"); break; }
    if (f.size > PH_MAX_SIZE) { err.textContent = T().photos_err_size; err.classList.add("show"); continue; }
    const el = document.createElement("div");
    el.className = "ph-item";
    // File cards paint immediately; preview decoding never runs on the UI thread.
    const isVideo = (f.type || "").startsWith("video/");
    el.innerHTML = `<div class="ph-placeholder"><span aria-hidden="true">${isVideo ? "🎞" : "📷"}</span><span class="ph-name"></span></div>`
      + (isVideo ? "" : `<img alt="" hidden decoding="async">`)
      + `<div class="ph-bar"><i></i></div>`;
    el.querySelector(".ph-name").textContent = f.name || (isVideo ? "Video" : "Photo");
    el.title = f.name || "";
    const clearPreview = !isVideo && window.QPhotoPreview
      ? window.QPhotoPreview.enqueue(el.querySelector("img"), f, { optimize: !$("phOriginal").checked }) : () => {};
    const x = document.createElement("button");
    x.type = "button"; x.className = "ph-x"; x.textContent = "×"; x.setAttribute("aria-label", T().photos_remove + ": " + (f.name || ""));
    const rec = { file: f, el, status: "wait", token: "" };
    rec.prepared = clearPreview.ready || Promise.resolve(f);
    x.onclick = () => {
      rec.status = "removed";
      if (rec.xhr) rec.xhr.abort();
      clearPreview();
      rec.file = null; rec.token = ""; rec.prepared = null;
      el.remove();
      phSync();
    };
    el.appendChild(x);
    $("phGrid").appendChild(el);
    photos.push(rec);
  }
  phSync();
  phPump();
}

function phSync(){
  const live = photos.filter(p => p.status !== "removed");
  $("phConsentWrap").style.display = live.length ? "" : "none";
  // счётчик под сеткой: видно, что загрузка идёт сама и ждать её не нужно
  const st = $("phStatus");
  if (!live.length) { st.style.display = "none"; return; }
  for (const p of live) {
    const retry = p.el.querySelector(".ph-retry");
    if (retry) { retry.textContent = T().photos_retry; retry.setAttribute("aria-label", T().photos_retry + ": " + (p.file?.name || "")); }
    p.el.querySelector(".ph-x").setAttribute("aria-label", T().photos_remove + ": " + (p.file?.name || ""));
  }
  const failed = live.filter(p => p.status === "fail").length;
  const done = live.filter(p => p.status === "done").length;
  st.style.display = "";
  st.textContent = failed ? T().photos_failed_status(done, live.length, failed) : done === live.length ? T().photos_done : T().photos_bg(done, live.length);
}


// ===== телефон: живое форматирование и проверка от опечаток =====
const phoneDigits = v => v.replace(/\D/g, "");
function phoneFormat(v){
  const plus = v.trim().startsWith("+");
  let d = phoneDigits(v);
  if (!plus && d.length === 11 && d[0] === "8") return "8 (" + d.slice(1,4) + ") " + d.slice(4,7) + "-" + d.slice(7,9) + "-" + d.slice(9);
  if (!plus && d.length === 11 && d[0] === "1") return "+1 (" + d.slice(1,4) + ") " + d.slice(4,7) + "-" + d.slice(7);
  if (!plus && d.length === 10) return "(" + d.slice(0,3) + ") " + d.slice(3,6) + "-" + d.slice(6);
  if (plus && d.length === 11 && d[0] === "1") return "+1 (" + d.slice(1,4) + ") " + d.slice(4,7) + "-" + d.slice(7);
  if (plus && d.length === 11 && d[0] === "7") return "+7 (" + d.slice(1,4) + ") " + d.slice(4,7) + "-" + d.slice(7,9) + "-" + d.slice(9);
  return (plus ? "+" : "") + d;
}
const phoneValid = v => { const n = phoneDigits(v).length; return n >= 10 && n <= 15; };
const emailValid = v => /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(v.trim());

function wireContactValidation(){
  const ph = $("respPhone"), em = $("respEmail"), hint = $("phoneHint");
  ph.addEventListener("input", () => {
    ph.value = phoneFormat(ph.value);
    ph.classList.remove("bad"); hint.classList.remove("show");
    ph.classList.toggle("ok", phoneValid(ph.value));
  });
  ph.addEventListener("blur", () => {
    if (!ph.value.trim()) { ph.classList.remove("ok", "bad"); hint.classList.remove("show"); return; }
    const good = phoneValid(ph.value);
    ph.classList.toggle("ok", good); ph.classList.toggle("bad", !good);
    hint.classList.toggle("show", !good);
  });
  em.addEventListener("input", () => { em.classList.remove("bad"); $("emailHint").classList.remove("show"); em.setAttribute("aria-invalid", "false"); em.classList.toggle("ok", emailValid(em.value)); });
  em.addEventListener("blur", () => {
    if (!em.value.trim()) { em.classList.remove("ok", "bad"); return; }
    const good = emailValid(em.value);
    em.classList.toggle("ok", good); em.classList.toggle("bad", !good);
    $("emailHint").classList.toggle("show", !good); em.setAttribute("aria-invalid", String(!good));
  });
}
wireContactValidation();

// Если Google Photos не принял файл, сервер вернёт его в списке rescue —
// дошлём сами байты нам же, чтобы ничего не пропало.
async function rescueFiles(list, eventIdFallback = ""){
  if (!Array.isArray(list) || !list.length) return;
  const records = photos;
  for (const item of list) {
    const record = records.find(p => p.status !== "removed" && p.file?.name === item.name
      && (!p.eventId || String(p.eventId) === String(item.eventId)));
    if (!record?.file || record.file.size > 4 * 1024 * 1024) continue;
    try {
      const response = await fetch(`/api/rescue-file?event=${encodeURIComponent(item.eventId || eventIdFallback)}&name=${encodeURIComponent(item.name)}`,
        { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: record.file });
      if (!response.ok) continue;
    } catch (_) { /* The warning below still tells the user to keep their originals. */ }
  }
  const warning = $("photoWarning");
  phSaveFailed = list.length;
  warning.textContent = T().photos_partial(phSaveFailed);
  warning.classList.add("show");
}

$("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const err = $("err");
  if (!rating){
    err.textContent = T().err_rating; err.classList.add("show");
    const box = $("stars").getBoundingClientRect();
    window.scrollTo({ top: window.scrollY + box.top - 120, behavior: "smooth" });
    return;
  }
  if (photos.some(p => p.status === "fail")){
    goStep(2);
    err.textContent = T().photos_fix_failed; err.classList.add("show");
    return;
  }
  if (photos.some(p => p.status === "up" || p.status === "wait")){
    err.textContent = T().photos_wait; err.classList.add("show");
    return;
  }
  if (contactOk === 0 && !emailValid($("respEmail").value) && !phoneValid($("respPhone").value)){
    err.textContent = T().err_contact; err.classList.add("show");
    $("respEmail").classList.add("bad");
    return;
  }
  err.classList.remove("show");
  $("send").disabled = true;
  $("send").textContent = T().sending;

  const pick = (set, list, otherVal) => {
    const out = [...set].map(i => STRINGS.ru[list][i] ?? "").filter(Boolean);
    if (otherVal.trim()) out.push("Другое: " + otherVal.trim());
    return out;
  };
  // метки пишем в monday по-русски независимо от языка интерфейса — одна система меток в колонках
  const body = {
    eventId, lang,
    rating,
    highlights: pick(high, "high", $("highOther").value),
    discomfort: pick(low, "low", $("lowOther").value),
    moment: $("moment").value.trim(),
    why_come: pick(why, "whycome", $("whyOther").value),
    consent: consent === "" ? "" : STRINGS.ru.consent[consent],
    name: consent === 0 ? $("respName").value.trim() : "",
    email: contactOk === 0 ? $("respEmail").value.trim() : "",
    phone: contactOk === 0 ? $("respPhone").value.trim() : "",
    contact_name: contactOk === 0 ? $("respContactName").value.trim() : "",
    contact_ok: contactOk === "" ? "" : STRINGS.ru.contact_opts[contactOk],
    custom_a: customQ ? $("customA").value.trim() : "",
    photos: photos.filter(p => p.status === "done").map(p => ({ token: p.token, mime: p.file.type || "", name: p.file.name || "" })),
    photo_credit: $("phCredit").value.trim(),
    p: pTok,
    website: document.querySelector(".hp").value
  };
  try{
    const r = await fetch("/api/submit", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error();
    const data = await r.json();
    await rescueFiles(data.rescue, eventId);
    $("formView").style.display = "none";
    $("thanks").classList.add("show");
    window.scrollTo({top:0});
  }catch(e){
    err.textContent = T().err_net; err.classList.add("show");
    $("send").disabled = false;
    $("send").textContent = T().send;
  }
});
